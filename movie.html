<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحميل ملفات الترجمة | Subtile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/movie.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <a href="index.html" class="brand-logo">
      <div class="brand-icon"><i class="fas fa-closed-captioning"></i></div>
      <div class="brand-name">Sub<span>tile</span></div>
    </a>

    <ul class="nav-links">
      <li><a href="index.html" class="nav-link">الرئيسية</a></li>
      <li><a href="index.html#trending" class="nav-link">الأعمال الشائعة</a></li>
      <li><a href="index.html#recent" class="nav-link">أحدث الترجمات</a></li>
    </ul>

    <div class="nav-actions">
      <button class="btn btn-secondary" onclick="openUploadModal()"><i class="fas fa-plus"></i> رفع ترجمة</button>
    </div>
  </header>

  <!-- Movie Backdrop & Hero Info -->
  <section id="movieBackdropSection" class="movie-header-backdrop">
    <div class="backdrop-gradient"></div>
    <div class="movie-hero-content">
      <img id="moviePoster" src="" alt="Poster" class="movie-hero-poster">
      <div class="movie-hero-details">
        <h1 id="movieTitle" class="movie-hero-title">--</h1>
        <div id="movieMeta" class="movie-hero-meta"></div>
        <p id="movieOverview" class="movie-hero-overview">--</p>
      </div>
    </div>
  </section>

  <!-- Main Content & Subtitles List -->
  <main class="container">
    
    <!-- TV Show Season / Episode Bar -->
    <div id="tvSelectorBar" class="tv-selector-bar" style="display: none;">
      <div class="tv-selector-group">
        <span style="font-weight: 700; color: var(--text-muted); font-size: 0.9rem;">الموسم:</span>
        <div id="seasonTabsContainer" class="season-tabs"></div>
      </div>
      <div class="tv-selector-group">
        <span style="font-weight: 700; color: var(--text-muted); font-size: 0.9rem;">الحلقة:</span>
        <select id="episodeSelect" class="episode-select" onchange="filterTvSubtitles()">
          <option value="all">كل الحلقات / الموسم كامل</option>
        </select>
      </div>
    </div>

    <!-- Filters Toolbar -->
    <div class="subtitles-filter-toolbar">
      <div class="filter-group">
        <label style="font-weight: 600; font-size: 0.88rem; color: var(--text-muted);"><i class="fas fa-filter"></i> تصفية:</label>
        
        <select id="langFilter" class="filter-select" onchange="applyFilters()">
          <option value="all">كل اللغات</option>
          <option value="ar">العربية (Arabic 🇸🇦)</option>
          <option value="en">الإنجليزية (English 🇬🇧)</option>
        </select>

        <select id="qualityFilter" class="filter-select" onchange="applyFilters()">
          <option value="all">كل النسخ والجودات</option>
          <option value="BluRay">BluRay</option>
          <option value="WEB">WEB-DL / WEBRip</option>
          <option value="4K">4K / UHD</option>
          <option value="1080p">1080p</option>
        </select>
      </div>

      <div>
        <span id="subtitlesCount" style="color: var(--text-muted); font-size: 0.85rem; font-weight: 600;">0 ملف متوفر</span>
      </div>
    </div>

    <!-- Subtitles List -->
    <div id="subtitlesList" class="subtitles-list"></div>

  </main>

  <!-- Upload Modal -->
  <div id="uploadModal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">رفع ملف ترجمة للعمل</h3>
        <button class="modal-close" onclick="closeUploadModal()">&times;</button>
      </div>
      <form id="uploadForm" onsubmit="handleUploadSubtitle(event)">
        <div class="form-group">
          <label class="form-label">العمل</label>
          <input type="text" id="modalMovieNameInput" class="form-control" readonly>
        </div>
        <div class="form-group" style="display: flex; gap: 1rem;">
          <div style="flex: 1;">
            <label class="form-label">اللغة</label>
            <select class="form-control">
              <option value="ar">العربية (Arabic 🇸🇦)</option>
              <option value="en">الإنجليزية (English 🇬🇧)</option>
              <option value="fr">الفرنسية (French 🇫🇷)</option>
              <option value="es">الإسبانية (Spanish 🇪🇸)</option>
            </select>
          </div>
          <div style="flex: 1;">
            <label class="form-label">النسخة / Release</label>
            <input type="text" class="form-control" placeholder="مثال: 1080p.BluRay.x264" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">ملف الترجمة (.srt أو .zip)</label>
          <input type="file" accept=".srt,.zip,.vtt" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">اسم المترجم أو الرافع</label>
          <input type="text" class="form-control" placeholder="اسمك أو الفريق" required>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.8rem; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeUploadModal()">إلغاء</button>
          <button type="submit" class="btn btn-primary">رفع الترجمة</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-links">
      <a href="index.html">الرئيسية</a>
      <a href="index.html#trending">الأعمال الشائعة</a>
      <a href="index.html#recent">أحدث الترجمات</a>
    </div>
    <p>© 2026 Subtile - منصة ترجمات الأفلام والمسلسلات</p>
  </footer>

  <!-- Scripts -->
  <script src="js/security.js"></script>
  <script src="js/data.js"></script>
  <script src="js/movie-page.js"></script>
</body>
</html>
