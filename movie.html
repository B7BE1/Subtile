<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtile | Premium Cinema UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/movie.css?v=4">
  
  <style>
    :root {
      --bg-black: #050507;
      --bg-dark: #0a0a0c;
      --bg-card-glass: rgba(20, 20, 24, 0.6);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.2);
      --divider-color: rgba(255, 255, 255, 0.1);
      --text-primary: #ffffff;
      --text-muted: #8a8a92;
      --danger: #ef4444;
      --radius-lg: 1.5rem;
      --radius-md: 1rem;
      --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      background-color: var(--bg-black);
    }

    .split-container {
      display: flex;
      min-height: 100vh;
      position: relative;
      opacity: 0; visibility: hidden; transition: opacity 0.8s ease;
    }
    .split-container.loaded { opacity: 1; visibility: visible; }

    /* 1. Left Side */
    .left-panel {
      background-color: var(--bg-black);
      width: 45%;
      padding: 8rem 4rem 4rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 2;
      border-left: 1px solid var(--divider-color);
    }
    .left-panel::-webkit-scrollbar { display: none; }

    .left-content {
      max-width: 380px;
      width: 100%;
      text-align: center;
      animation: slideInLeft 1s ease;
    }

    .movie-poster {
      width: 100%;
      max-width: 280px;
      border-radius: var(--radius-lg);
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      margin: 0 auto 2.5rem;
      transition: transform 0.5s ease;
      border: 1px solid var(--border-color);
    }
    .left-content:hover .movie-poster { transform: scale(1.03); }

    .movie-tags { display: flex; gap: 0.5rem; margin-bottom: 1rem; justify-content: center; }
    .tag {
      padding: 0.3rem 0.8rem; background: transparent; color: var(--text-muted);
      border-radius: 50px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; border: 1px solid var(--border-color);
    }

    .movie-title {
      font-family: 'Playfair Display', serif; font-size: 3.2rem; font-weight: 900;
      line-height: 1.1; margin-bottom: 1.5rem; color: white; letter-spacing: -0.03em;
    }

    .movie-meta { display: flex; gap: 1.5rem; margin-bottom: 2rem; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; align-items: center; justify-content: center; }
    .meta-item { display: flex; align-items: center; gap: 0.4rem; }
    .rating-token {
      width: 45px; height: 45px; border-radius: 50%; background: black;
      box-shadow: 0 0 0 2px white, inset 0 0 0 3px black;
      display: flex; align-items: center; justify-content: center;
    }
    .rating-token span { font-weight: 900; font-size: 0.9rem; color: white; }

    .movie-desc {
      color: var(--text-muted); margin-bottom: 2rem; line-height: 1.8; font-size: 1.05rem;
      text-align: center;
    }

    /* 2. Right Side */
    .right-panel {
      width: 55%;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-start; /* Fix list jumping on filter */
      padding: 8rem 4rem 4rem;
      z-index: 1;
      overflow: hidden;
    }

    .banner-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--bg-dark);
      background-size: cover; background-position: center;
      filter: grayscale(90%) brightness(0.25) contrast(1.2);
      z-index: -2;
    }

    .banner-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to right, rgba(5,5,7,0.8) 0%, rgba(5,5,7,0.4) 100%);
      z-index: -1;
    }

    .list-wrapper {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      position: relative;
    }

    /* Controls Header */
    .list-controls-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }
    
    .view-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: white;
      flex-grow: 1;
    }

    /* Neo Back Button */
    .neo-back-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .neo-back-btn:hover {
      background: white; color: black; border-color: transparent;
      transform: scale(1.1) rotate(-10deg); box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
    }

    /* Top: 5 Small Rectangles (Filters) */
    .filter-pills {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.8rem;
      flex-grow: 1;
    }
    .pill {
      padding: 0.6rem 0.5rem; 
      background: rgba(255,255,255,0.05); 
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color); 
      border-radius: 12px; 
      cursor: pointer;
      transition: var(--transition); 
      font-size: 0.85rem; 
      font-weight: 600; 
      color: var(--text-muted);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .pill:hover { border-color: var(--border-hover); color: white; background: rgba(255,255,255,0.1); transform: translateY(-2px); }
    .pill.active { background: white; color: black; border-color: white; box-shadow: 0 5px 15px rgba(255,255,255,0.1); }

    /* Subtitles List */
    .subtitles-list { display: grid; gap: 1.2rem; }

    .subtitle-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 2rem; 
      background: var(--bg-card-glass); 
      backdrop-filter: blur(20px) saturate(150%);
      border-radius: var(--radius-md); 
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid var(--border-color); 
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateY(30px) scale(0.98);
    }
    .subtitle-item.visible { opacity: 1; transform: translateY(0) scale(1); }
    .subtitle-item:hover {
      background: rgba(255,255,255,0.08); 
      border-color: var(--border-hover);
      transform: translateY(-5px) scale(1.01) !important; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    .sub-info { display: flex; flex-direction: column; gap: 0.5rem; }
    .sub-release {
      font-weight: 700; font-size: 1.2rem; color: white; 
      display: flex; align-items: center; gap: 1rem; letter-spacing: -0.02em;
    }
    .format-badge {
      background: white; color: black; padding: 0.2rem 0.6rem; border-radius: 6px;
      font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
    }
    .sub-meta { display: flex; gap: 1.5rem; font-size: 0.9rem; color: var(--text-muted); }
    
    .download-btn {
      background: rgba(255,255,255,0.05); color: white; width: 55px; height: 55px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; text-decoration: none; 
      transition: var(--transition); border: 1px solid var(--border-color); font-size: 1.2rem;
    }
    .download-btn:hover { background: white; color: black; transform: scale(1.1) rotate(10deg); border-color: transparent; }

    /* === NEW: Seasons List View === */
    .seasons-list-view {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .season-card {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 1.5rem;
      background: var(--bg-card-glass);
      backdrop-filter: blur(20px) saturate(150%);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
      transform: translateY(30px);
    }
    .season-card.visible { opacity: 1; transform: translateY(0); }
    .season-card:hover {
      background: rgba(255,255,255,0.08);
      border-color: var(--border-hover);
      transform: translateY(-5px) scale(1.01);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    .season-thumb {
      width: 100px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border-color);
      background: rgba(255,255,255,0.05);
      flex-shrink: 0;
    }

    .season-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .season-title {
      font-weight: 700;
      font-size: 1.3rem;
      color: white;
      letter-spacing: -0.02em;
    }

    .season-sub {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .season-arrow {
      color: var(--text-muted);
      font-size: 1.2rem;
      transition: transform 0.3s ease;
    }
    .season-card:hover .season-arrow {
      color: white;
      transform: translateX(5px);
    }

    /* Navbar & Modal */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 4rem;
      background: rgba(5, 5, 7, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
    }
    .brand-logo { display: flex; align-items: center; gap: 0.8rem; text-decoration: none; color: var(--text-primary); }
    .brand-icon {
      width: 42px; height: 42px; background: white; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: black; transition: transform 0.3s ease;
    }
    .brand-logo:hover .brand-icon { transform: rotate(-10deg) scale(1.1); }
    .brand-name { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 800; }
    .nav-actions { display: flex; align-items: center; gap: 1rem; }
    .btn {
      padding: 0.8rem 1.8rem; border-radius: 50px; border: none; font-weight: 600; cursor: pointer;
      transition: var(--transition); display: inline-flex; align-items: center; gap: 0.5rem; font-family: inherit; font-size: 0.85rem;
    }
    .btn-primary { background: white; color: black; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255,255,255,0.2); }
    .btn-outline { background: transparent; color: white; border: 1px solid var(--border-color); }
    .btn-outline:hover { border-color: white; background: rgba(255,255,255,0.05); }
    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      backdrop-filter: blur(15px); z-index: 2000; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-backdrop.active { display: flex; animation: fadeIn 0.3s ease; }
    .modal-content {
      background: #121214; border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      width: 100%; max-width: 500px; padding: 2.5rem; animation: scaleIn 0.4s ease; box-shadow: 0 40px 80px rgba(0,0,0,0.8);
    }
    .modal-header { display: flex; justify-content: space-between; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; }
    .modal-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: white; }
    .modal-close { background: rgba(255,255,255,0.05); border: none; color: var(--text-muted); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; transition: 0.3s; }
    .modal-close:hover { background: var(--danger); color: white; transform: rotate(90deg); }
    .form-group { margin-bottom: 1.5rem; }
    .form-label { display: block; margin-bottom: 0.5rem; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .form-control {
      width: 100%; background: #000; border: 1px solid var(--border-color); padding: 0.9rem 1.2rem;
      border-radius: var(--radius-md); color: white; font-family: inherit; outline: none; transition: 0.3s;
    }
    .form-control:focus { border-color: white; background: #050507; box-shadow: 0 0 0 3px rgba(255,255,255,0.1); }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideInLeft { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* Responsive */
    @media (max-width: 1024px) {
      .split-container { flex-direction: column; }
      .left-panel { position: relative; height: auto; overflow-y: visible; border-left: none; }
      .left-panel, .right-panel { width: 100%; padding: 8rem 1.5rem 4rem; border-top: 1px solid var(--divider-color); }
      .left-content { max-width: 100%; }
      .movie-title { font-size: 2.5rem; }
      .filter-pills { grid-template-columns: repeat(3, 1fr); }
    }
    #globalLoader {
      position: fixed; inset: 0; background: var(--bg-black); z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- Global Loader -->
  <div id="globalLoader">
    <i class="fas fa-spinner fa-spin" style="font-size: 3rem; color: rgba(255,255,255,0.2);"></i>
  </div>

  <!-- Navbar -->
  <header class="navbar">
    <a href="index.html" class="brand-logo">
      <div class="brand-icon"><i class="fas fa-closed-captioning"></i></div>
      <div class="brand-name">Sub<span>tile</span></div>
    </a>
    <div class="nav-actions">
      <button class="btn btn-outline" onclick="openUploadModal()"><i class="fas fa-upload"></i> Upload</button>
      <button class="btn btn-primary">Premium</button>
    </div>
  </header>

  <!-- Main Split Layout -->
  <div class="split-container">
    
    <!-- Left Panel (Work Info) -->
    <aside class="left-panel">
      <div class="left-content">
        <img id="moviePoster" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Loading Poster" class="movie-poster" style="background: rgba(255,255,255,0.05); min-height: 420px;">
        
        <div id="movieTags" class="movie-tags">
          <!-- Tags injected by JS -->
        </div>
        
        <h1 id="movieTitle" class="movie-title"></h1>
        
        <div id="movieMeta" class="movie-meta">
          <!-- Meta injected by JS -->
        </div>
        
        <p id="movieOverview" class="movie-desc"></p>
      </div>
    </aside>

    <!-- Right Panel (Lists) -->
    <main class="right-panel">
      <div id="movieBackdropSection" class="banner-bg"></div>
      <div class="banner-overlay"></div>

      <div class="list-wrapper">
        
        <!-- Controls Header -->
        <div class="list-controls-header">
          <button id="backToSeasonsBtn" class="neo-back-btn" style="display: none;" title="Back to Seasons">
            <i class="fas fa-chevron-left"></i>
          </button>
          <h2 class="view-title" id="viewTitle">Seasons</h2>
          
          <div id="filterPillsContainer" class="filter-pills" style="display: none;">
            <div class="pill active" data-filter="all">All</div>
            <div class="pill" data-filter="lang:ar">Arabic</div>
            <div class="pill" data-filter="lang:en">English</div>
            <div class="pill" data-filter="quality:4K">4K</div>
            <div class="pill" data-filter="quality:1080p">1080p</div>
          </div>
        </div>

        <!-- Seasons List View -->
        <div id="seasonsListView" class="seasons-list-view">
          <!-- JS will inject seasons here -->
        </div>

        <!-- Subtitles List View -->
        <div id="subtitlesListView" style="display: none;">
          <div class="subtitles-list" id="subtitlesList"></div>
        </div>

      </div>
    </main>

  </div>

  <!-- Modal -->
  <div id="uploadModal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Upload Subtitle</h3>
        <button class="modal-close" onclick="closeUploadModal()"><i class="fas fa-times"></i></button>
      </div>
      <form onsubmit="handleUpload(event)">
        <div class="form-group">
          <label class="form-label">Movie / TV Show</label>
          <input type="text" class="form-control" value="Dune: Part Two (2024)" readonly>
        </div>
        <div class="form-group">
          <label class="form-label">Release Version</label>
          <input type="text" class="form-control" placeholder="e.g., 1080p.BluRay.x264" required>
        </div>
        <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
          <div style="flex:1">
            <label class="form-label">Language</label>
            <select class="form-control"><option>English</option><option>Arabic</option></select>
          </div>
          <div style="flex:1">
            <label class="form-label">Format</label>
            <select class="form-control"><option>SRT</option><option>ZIP</option></select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 1rem;"><i class="fas fa-paper-plane"></i> Submit File</button>
      </form>
    </div>
  </div>

  <script src="js/security.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-ui.js"></script>
  <script src="js/data.js"></script>
  <script src="js/tmdb-service.js"></script>
  <script src="js/movie-page.js"></script>
  <script>
    // Modal Logic
    function openUploadModal() { document.getElementById('uploadModal').classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeUploadModal() { document.getElementById('uploadModal').classList.remove('active'); document.body.style.overflow = 'auto'; }
    document.getElementById('uploadModal').addEventListener('click', function(e) { if(e.target === this) closeUploadModal(); });
    function handleUpload(e) { e.preventDefault(); closeUploadModal(); alert('Uploaded successfully!'); }

    // IntersectionObserver logic for fade in
    function attachFadeIn(elements) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry, index) => {
          if (entry.isIntersecting) {
            const delay = index * 80;
            setTimeout(() => {
              entry.target.classList.add('visible');
            }, delay);
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });
      elements.forEach(item => observer.observe(item));
    }
    window.attachFadeIn = attachFadeIn;
  </script>
</body>
</html>
