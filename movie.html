<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtitles Archive — Subtile</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-base: #060608;
      --bg-panel: rgba(14, 14, 18, 0.72);
      --bg-card: rgba(22, 22, 30, 0.65);
      --bg-card-hover: rgba(30, 30, 42, 0.88);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.22);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --brand-accent: #ffffff;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Dynamic Full-Bleed Movie Backdrop */
    .global-backdrop-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      z-index: 0;
      opacity: 0.38;
      transform: scale(1.04);
      filter: blur(4px) saturate(130%);
      transition: background-image 0.8s ease-in-out, opacity 0.8s ease-in-out;
      pointer-events: none;
    }

    .global-backdrop-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: radial-gradient(circle at 65% 30%, rgba(6, 6, 8, 0.2) 0%, rgba(6, 6, 8, 0.75) 60%, rgba(6, 6, 8, 0.98) 100%),
                  linear-gradient(to right, rgba(6, 6, 8, 0.95) 0%, rgba(6, 6, 8, 0.65) 40%, rgba(6, 6, 8, 0.4) 60%, rgba(6, 6, 8, 0.85) 100%),
                  linear-gradient(to bottom, rgba(6, 6, 8, 0.8) 0%, transparent 20%, transparent 80%, rgba(6, 6, 8, 0.98) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .split-container {
      display: flex;
      min-height: 100vh;
      position: relative;
      z-index: 2;
      opacity: 0; visibility: hidden; transition: opacity 0.6s ease;
    }
    .split-container.loaded { opacity: 1; visibility: visible; }

    /* Left Side: Movie Hero Info */
    .left-panel {
      background: linear-gradient(to right, rgba(6, 6, 8, 0.8) 0%, rgba(6, 6, 8, 0.5) 85%, transparent 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      width: 44%;
      padding: 6.5rem 3.5rem 4rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 10;
    }
    .left-panel::-webkit-scrollbar { display: none; }

    .left-content {
      max-width: 420px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .movie-poster {
      width: 100%;
      max-width: 300px;
      aspect-ratio: 2/3;
      border-radius: var(--radius-lg);
      box-shadow: 0 28px 60px -15px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.12);
      margin: 0 auto 2rem;
      transition: var(--transition);
      object-fit: cover;
    }
    .left-content:hover .movie-poster {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 36px 70px -15px rgba(0, 0, 0, 1), 0 0 0 1px rgba(255, 255, 255, 0.25);
    }

    .movie-title {
      font-size: 3rem;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 1rem;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .tags {
      display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1.5rem;
    }
    .tag {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(10px);
      padding: 0.4rem 1rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #e5e7eb;
      border: 1px solid var(--border-color);
    }

    .meta {
      display: flex; align-items: center; justify-content: center; gap: 1.5rem;
      margin-bottom: 2rem; color: var(--text-muted); font-size: 0.95rem; font-weight: 600;
    }
    .meta-item { display: flex; align-items: center; gap: 0.4rem; }
    
    .rating-circle {
      display: inline-flex; align-items: center; justify-content: center;
      background: #ffffff; color: #050507;
      font-weight: 900; font-size: 0.95rem;
      padding: 0.25rem 0.75rem; border-radius: 50px;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.25);
    }

    .overview {
      color: #d1d5db; line-height: 1.85; font-size: 1.05rem;
      text-align: center; margin-bottom: 2.5rem; font-weight: 400;
    }

    /* Right Side: Seasons & Subtitles */
    .right-panel {
      width: 56%;
      padding: 6.5rem 4rem 4rem 3.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      z-index: 5;
    }

    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2rem;
    }
    .panel-title {
      font-size: 1.8rem; font-weight: 900; color: #ffffff;
      display: flex; align-items: center; gap: 0.75rem;
    }
    
    .back-btn {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border-color);
      color: #ffffff; padding: 0.5rem 1rem; border-radius: 50px;
      font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: var(--transition);
      display: inline-flex; align-items: center; gap: 0.5rem;
    }
    .back-btn:hover { background: rgba(255,255,255,0.15); border-color: var(--border-hover); }

    /* Filters */
    .filter-pills { display: flex; gap: 0.6rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .pill {
      background: rgba(255, 255, 255, 0.05); color: #9ca3af;
      padding: 0.55rem 1.1rem; border-radius: 50px; font-size: 0.82rem; font-weight: 700;
      border: 1px solid var(--border-color); cursor: pointer; transition: var(--transition);
    }
    .pill:hover { border-color: var(--border-hover); color: white; background: rgba(255,255,255,0.1); }
    .pill.active { background: #ffffff; color: #050507; border-color: #ffffff; box-shadow: 0 4px 16px rgba(255,255,255,0.25); }

    /* Subtitles List */
    .subtitles-list { display: grid; gap: 1rem; }
    .subtitle-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.4rem 1.8rem;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-md);
      transition: var(--transition);
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }
    .subtitle-item:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.6);
    }

    .sub-info { display: flex; flex-direction: column; gap: 0.4rem; }
    .sub-release {
      font-weight: 700; font-size: 1.1rem; color: #f9fafb;
      word-break: break-all;
    }
    
    .format-badge {
      padding: 0.25rem 0.65rem; border-radius: 6px;
      font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .format-badge.badge-ass {
      background: rgba(168, 85, 247, 0.18);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.45);
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.25);
    }
    .format-badge.badge-srt {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .format-badge.badge-vtt {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .format-badge.badge-zip {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }

    .sub-meta { display: flex; gap: 1.2rem; font-size: 0.85rem; color: #9ca3af; flex-wrap: wrap; }
    
    .download-btn {
      background: rgba(255,255,255,0.08); color: white; width: 46px; height: 46px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; text-decoration: none;
      transition: var(--transition); border: 1px solid var(--border-color); font-size: 1.05rem;
      flex-shrink: 0;
    }
    .download-btn:hover { background: #ffffff; color: #050507; transform: scale(1.1); border-color: transparent; box-shadow: 0 4px 16px rgba(255,255,255,0.3); }

    /* Seasons Cards */
    .seasons-list-view { display: flex; flex-direction: column; gap: 1rem; }
    .season-card {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 1.6rem;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      cursor: pointer; transition: var(--transition);
    }
    .season-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }
    .season-card-info { display: flex; align-items: center; gap: 1.2rem; }
    .season-thumb { width: 48px; height: 68px; border-radius: 8px; object-fit: cover; }
    .season-title { font-weight: 800; font-size: 1.2rem; color: #fff; }
    .season-sub { font-size: 0.85rem; color: #9ca3af; }

    /* Navbar */
    .nav-header {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
      padding: 1.2rem 3rem; display: flex; justify-content: space-between; align-items: center;
      background: rgba(6, 6, 8, 0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
    }
    .nav-brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: #fff; font-weight: 900; font-size: 1.2rem; }
    
    /* Toast */
    #toastContainer { position: fixed; bottom: 2rem; right: 2rem; z-index: 999; display: flex; flex-direction: column; gap: 0.8rem; }
    .toast { background: rgba(14, 14, 18, 0.95); backdrop-filter: blur(20px); border: 1px solid var(--border-hover); padding: 1rem 1.5rem; border-radius: 12px; color: #fff; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: flex; align-items: center; gap: 0.6rem; }

    /* Global Loader */
    #globalLoader {
      position: fixed; inset: 0; background: var(--bg-base); z-index: 200;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.4s ease;
    }

    @media (max-width: 900px) {
      .split-container { flex-direction: column; }
      .left-panel { width: 100%; height: auto; position: relative; padding: 6rem 2rem 2rem; }
      .right-panel { width: 100%; padding: 2rem; }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Cinema Backdrop -->
  <div id="globalMovieBackdrop" class="global-backdrop-bg"></div>
  <div class="global-backdrop-overlay"></div>

  <!-- Global Loader -->
  <div id="globalLoader">
    <i class="fas fa-spinner fa-spin text-3xl text-white"></i>
  </div>

  <!-- Top Navbar -->
  <header class="nav-header">
    <a href="index.html" class="nav-brand">
      <div style="width: 32px; height: 32px; background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
        <svg style="width: 18px; height: 18px; color: #000;" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
      </div>
      <span>SUBTILE</span>
    </a>
    <div style="display: flex; gap: 1rem; align-items: center;">
      <a href="index.html" class="back-btn"><i class="fas fa-home"></i> Trending</a>
      <a href="browse.html" class="back-btn"><i class="fas fa-compass"></i> Browse</a>
    </div>
  </header>

  <!-- Split Container -->
  <div class="split-container">
    
    <!-- Left Panel: Movie Hero Artwork & Details -->
    <div class="left-panel">
      <div class="left-content">
        <img id="moviePoster" src="" alt="Poster" class="movie-poster">
        <h1 id="movieTitle" class="movie-title"></h1>
        <div id="movieTags" class="tags"></div>
        <div id="movieMeta" class="meta"></div>
        <p id="movieOverview" class="overview"></p>
      </div>
    </div>

    <!-- Right Panel: Seasons & Subtitles List -->
    <div class="right-panel">
      
      <div class="panel-header">
        <h2 id="viewTitle" class="panel-title"><i class="fas fa-closed-captioning"></i> Subtitles Archive</h2>
        <button id="backToSeasonsBtn" class="back-btn" style="display: none;"><i class="fas fa-arrow-left"></i> Back to Seasons</button>
      </div>

      <!-- Filter Pills -->
      <div id="filterPillsContainer" class="filter-pills">
        <button class="pill active" data-filter="all">All Languages</button>
        <button class="pill" data-filter="lang:ar">Arabic 🇸🇦</button>
        <button class="pill" data-filter="lang:en">English 🇬🇧</button>
        <button class="pill" data-filter="lang:fr">Français 🇫🇷</button>
        <button class="pill" data-filter="lang:ja">日本語 🇯🇵</button>
        <button class="pill" data-filter="quality:1080p">1080p BluRay</button>
        <button class="pill" data-filter="quality:4k">4K UHD</button>
      </div>

      <!-- Seasons List (for TV & Anime) -->
      <div id="seasonsListView" class="seasons-list-view" style="display: none;"></div>

      <!-- Subtitles List -->
      <div id="subtitlesListView">
        <div id="subtitlesList" class="subtitles-list"></div>
      </div>

    </div>

  </div>

  <div id="toastContainer"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/movie-page.js"></script>
</body>
</html>
