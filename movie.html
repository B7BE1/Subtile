<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtile | Download Subtitles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/movie.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="movie-page-body">

  <!-- Top Header (From index.html) -->
  <header class="subdl-header">
    <a href="index.html" class="subdl-logo">
      <span class="logo-badge">SUBTILE</span>
    </a>

    <ul class="subdl-nav">
      <li><a href="index.html" class="subdl-nav-link active">Latest</a></li>
      <li><a href="index.html#mostDownloaded" class="subdl-nav-link">Trends</a></li>
      <li><a href="index.html#mostDownloaded" class="subdl-nav-link">Leaderboard</a></li>
      <li><a href="https://github.com/B7BE1/Subtile" target="_blank" class="subdl-nav-link">Community</a></li>
    </ul>

    <div class="subdl-header-actions">
      <div id="navAuthSlot">
        <button class="btn-auth-subdl" onclick="openAuthModal('login')">
          <i class="fas fa-sign-in-alt"></i> Login / Sign Up
        </button>
      </div>
      <button class="btn-icon-subdl" onclick="openUploadModal()" title="Upload Subtitle">
        <i class="fas fa-upload"></i>
      </button>
    </div>
  </header>

  <!-- Movie Backdrop & Hero Info -->
  <section id="movieBackdropSection" class="movie-header-backdrop">
    <div class="backdrop-gradient"></div>
    <div class="movie-hero-content">
      <img id="moviePoster" src="https://via.placeholder.com/200x300" alt="Poster" class="movie-hero-poster">
      <div class="movie-hero-details">
        <h1 id="movieTitle" class="movie-hero-title">Movie Title</h1>
        <div id="movieMeta" class="movie-hero-meta">
          <span><i class="fas fa-star" style="color: #fbbf24;"></i> 8.5</span>
          <span><i class="fas fa-calendar-alt"></i> 2023</span>
          <span><i class="fas fa-clock"></i> 2h 15m</span>
        </div>
        <p id="movieOverview" class="movie-hero-overview">Loading overview...</p>
      </div>
    </div>
  </section>

  <!-- Main Content & Subtitles List -->
  <main class="container">
    
    <!-- TV Show Season / Episode Bar -->
    <div id="tvSelectorBar" class="tv-selector-bar" style="display: none;">
      <div class="tv-selector-group">
        <span style="font-weight: 700; color: var(--text-secondary); font-size: 0.9rem;">Season:</span>
        <div id="seasonTabsContainer" class="season-tabs">
          <!-- Populated by JS -->
        </div>
      </div>
      <div class="tv-selector-group">
        <span style="font-weight: 700; color: var(--text-secondary); font-size: 0.9rem;">Episode:</span>
        <select id="episodeSelect" class="episode-select" onchange="filterTvSubtitles()">
          <option value="all">All Episodes</option>
        </select>
      </div>
    </div>

    <!-- Filters Toolbar -->
    <div class="subtitles-filter-toolbar">
      <div class="filter-group">
        <label style="font-weight: 600; font-size: 0.88rem; color: var(--text-secondary);"><i class="fas fa-filter"></i> Filter:</label>
        
        <select id="langFilter" class="filter-select" onchange="applyFilters()">
          <option value="all">All Languages</option>
          <option value="ar">🇸🇦 Arabic</option>
          <option value="en">🇬🇧 English</option>
        </select>

        <select id="qualityFilter" class="filter-select" onchange="applyFilters()">
          <option value="all">All Qualities</option>
          <option value="BluRay">BluRay</option>
          <option value="WEB">WEB-DL</option>
          <option value="4K">4K / UHD</option>
        </select>
      </div>

      <div>
        <span id="subtitlesCount" class="subtitles-count-badge">
          0 subtitles
        </span>
      </div>
    </div>

    <div id="subtitlesList" class="subtitles-list">
      <!-- Generated by JS -->
    </div>

  </main>

  <!-- Auth Modal (From index.html) -->
  <div id="authModal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Subtile Account</h3>
        <button class="modal-close" onclick="closeAuthModal()">&times;</button>
      </div>
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1.2rem;">
        <button id="authTabLogin" class="btn-subdl-submit" style="flex: 1; padding: 0.4rem;" onclick="switchAuthTab('login')">Login</button>
        <button id="authTabRegister" class="btn-auth-subdl" style="flex: 1; padding: 0.4rem; justify-content: center;" onclick="switchAuthTab('register')">Register</button>
      </div>
      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label">Username or Email</label>
          <input type="text" id="loginUsername" class="form-control" placeholder="username" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-subdl-submit" style="margin-top: 0.5rem;">Sign In</button>
      </form>
      <form id="registerForm" style="display: none;" onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="regUsername" class="form-control" placeholder="username" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="regEmail" class="form-control" placeholder="email@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-subdl-submit" style="margin-top: 0.5rem;">Create Account</button>
      </form>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="uploadModal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Upload Subtitle</h3>
        <button class="modal-close" onclick="closeUploadModal()">&times;</button>
      </div>
      <form id="uploadForm" onsubmit="handleUploadSubtitle(event)">
        <div class="form-group">
          <label class="form-label">Movie / TV Show Title</label>
          <input type="text" id="modalMovieNameInput" class="form-control" placeholder="e.g. Dune: Part Two" readonly>
        </div>
        <div class="form-group" style="display: flex; gap: 0.8rem;">
          <div style="flex: 1;">
            <label class="form-label">Language</label>
            <select class="form-control">
              <option value="Arabic">Arabic</option>
              <option value="English">English</option>
              <option value="French">French</option>
              <option value="Spanish">Spanish</option>
            </select>
          </div>
          <div style="flex: 1;">
            <label class="form-label">Release Name</label>
            <input type="text" class="form-control" placeholder="1080p.BluRay.x264" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Subtitle File (.srt / .zip)</label>
          <input type="file" accept=".srt,.zip,.vtt" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Translator / Uploader</label>
          <input type="text" class="form-control" placeholder="Your name or team" required>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.8rem; margin-top: 1.5rem;">
          <button type="button" class="btn-auth-subdl" onclick="closeUploadModal()">Cancel</button>
          <button type="submit" class="btn-subdl-submit" style="width: auto; padding: 0.5rem 1.2rem;">Upload</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Footer -->
  <footer class="subdl-footer">
    <ul class="subdl-footer-links">
      <li><a href="#">Filter Languages</a></li>
      <li><a href="#">Advertise</a></li>
      <li><a href="#">Search and Download API</a></li>
      <li><a href="#">DMCA</a></li>
      <li><a href="#">Terms</a></li>
    </ul>
    <div style="color: var(--text-muted);">
      &copy; 2026 Subtile
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/security.js"></script>
  <script src="js/data.js"></script>
  <script src="js/tmdb-service.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-ui.js"></script>
  <script src="js/movie-page.js"></script>
</body>
</html>
