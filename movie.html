<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtile | Premium Cinema UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/movie.css?v=5">
  
  <style>
    :root {
      --bg-black: #08080a;
      --bg-dark: #0d0d11;
      --bg-card-glass: rgba(22, 22, 28, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --border-hover: rgba(255, 255, 255, 0.25);
      --divider-color: rgba(255, 255, 255, 0.12);
      --text-primary: #ffffff;
      --text-muted: #9ca3af;
      --danger: #ef4444;
      --radius-lg: 1.25rem;
      --radius-md: 0.85rem;
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      background-color: var(--bg-black);
      position: relative;
    }

    /* Fixed High-Definition Movie Backdrop Across the Entire Page */
    .global-movie-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      z-index: 0;
      opacity: 0.38;
      filter: brightness(0.9) contrast(1.15) saturate(1.1);
      pointer-events: none;
      transition: opacity 0.8s ease, background-image 0.5s ease;
    }

    .global-backdrop-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 75% 25%, rgba(8, 8, 10, 0.2) 0%, rgba(8, 8, 10, 0.85) 65%, rgba(8, 8, 10, 0.98) 100%),
                  linear-gradient(to right, rgba(8, 8, 10, 0.95) 0%, rgba(8, 8, 10, 0.5) 45%, rgba(8, 8, 10, 0.8) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .split-container {
      display: flex;
      min-height: 100vh;
      position: relative;
      z-index: 2;
      opacity: 0; visibility: hidden; transition: opacity 0.6s ease;
    }
    .split-container.loaded { opacity: 1; visibility: visible; }

    /* 1. Left Side (Movie Info Glass Panel) */
    .left-panel {
      background: rgba(10, 10, 14, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      width: 42%;
      padding: 7.5rem 3.5rem 4rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 10;
      border-right: 1px solid var(--border-color);
    }
    .left-panel::-webkit-scrollbar { display: none; }

    .left-content {
      max-width: 360px;
      width: 100%;
      text-align: center;
      animation: slideInLeft 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .movie-poster {
      width: 100%;
      max-width: 260px;
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.12);
      margin: 0 auto 2rem;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      object-fit: cover;
    }
    .left-content:hover .movie-poster {
      transform: scale(1.03);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.25);
    }

    .movie-tags { display: flex; gap: 0.5rem; margin-bottom: 1rem; justify-content: center; flex-wrap: wrap; }
    .tag {
      padding: 0.35rem 0.85rem; background: rgba(255, 255, 255, 0.06); color: #d1d5db;
      border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      border: 1px solid var(--border-color); letter-spacing: 0.04em;
    }

    .movie-title {
      font-family: 'Playfair Display', serif; font-size: 2.8rem; font-weight: 900;
      line-height: 1.1; margin-bottom: 1.2rem; color: #ffffff; letter-spacing: -0.02em;
    }

    .movie-meta { display: flex; gap: 1.2rem; margin-bottom: 1.8rem; color: var(--text-muted); font-weight: 600; font-size: 0.9rem; align-items: center; justify-content: center; flex-wrap: wrap; }
    .meta-item { display: flex; align-items: center; gap: 0.4rem; }
    .rating-circle {
      width: 40px; height: 40px; border-radius: 50%; background: #171717;
      border: 2px solid #fbbf24;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 0.85rem; color: #fbbf24;
      box-shadow: 0 4px 12px rgba(251, 191, 36, 0.2);
    }

    .movie-desc {
      color: #9ca3af; margin-bottom: 2rem; line-height: 1.7; font-size: 0.95rem;
      text-align: center;
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 2. Right Side (Subtitles Glass View) */
    .right-panel {
      width: 58%;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 7.5rem 4rem 4rem;
      z-index: 5;
      min-height: 100vh;
    }

    .list-wrapper {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      position: relative;
    }

    /* Controls Header */
    .list-controls-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.2rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    
    .view-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      flex-grow: 1;
      letter-spacing: -0.02em;
    }

    /* Back Button */
    .neo-back-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .neo-back-btn:hover {
      background: white; color: black; border-color: transparent;
      transform: scale(1.08) rotate(-8deg); box-shadow: 0 8px 24px rgba(255, 255, 255, 0.15);
    }

    /* Filter Pills */
    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    .pill {
      padding: 0.5rem 0.9rem; 
      background: rgba(255,255,255,0.06); 
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color); 
      border-radius: 10px; 
      cursor: pointer;
      transition: var(--transition); 
      font-size: 0.8rem; 
      font-weight: 700; 
      color: var(--text-muted);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .pill:hover { border-color: var(--border-hover); color: white; background: rgba(255,255,255,0.12); transform: translateY(-2px); }
    .pill.active { background: #ffffff; color: #0a0a0a; border-color: #ffffff; box-shadow: 0 4px 16px rgba(255,255,255,0.2); }

    /* Subtitles List */
    .subtitles-list { display: grid; gap: 1rem; }

    .subtitle-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.5rem 1.8rem; 
      background: rgba(18, 18, 24, 0.75); 
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-radius: var(--radius-md); 
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid var(--border-color); 
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(20px);
    }
    .subtitle-item.visible { opacity: 1; transform: translateY(0); }
    .subtitle-item:hover {
      background: rgba(28, 28, 38, 0.88); 
      border-color: var(--border-hover);
      transform: translateY(-3px) scale(1.008); 
      box-shadow: 0 20px 48px rgba(0,0,0,0.6);
    }

    .sub-info { display: flex; flex-direction: column; gap: 0.4rem; }
    .sub-release {
      font-weight: 700; font-size: 1.1rem; color: #f9fafb; 
      display: flex; align-items: center; gap: 0.8rem; letter-spacing: -0.01em;
      word-break: break-all;
    }
    .format-badge {
      background: #ffffff; color: #0a0a0a; padding: 0.15rem 0.5rem; border-radius: 6px;
      font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .sub-meta { display: flex; gap: 1.2rem; font-size: 0.82rem; color: #9ca3af; flex-wrap: wrap; }
    
    .download-btn {
      background: rgba(255,255,255,0.08); color: white; width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; text-decoration: none; 
      transition: var(--transition); border: 1px solid var(--border-color); font-size: 1.1rem;
      flex-shrink: 0;
    }
    .download-btn:hover { background: #ffffff; color: #0a0a0a; transform: scale(1.1) rotate(6deg); border-color: transparent; box-shadow: 0 4px 20px rgba(255,255,255,0.25); }

    /* Seasons List View */
    .seasons-list-view {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .season-card {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      padding: 1.2rem 1.6rem;
      background: rgba(18, 18, 24, 0.75);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      transform: translateY(20px);
    }
    .season-card.visible { opacity: 1; transform: translateY(0); }
    .season-card:hover {
      background: rgba(28, 28, 38, 0.88);
      border-color: var(--border-hover);
      transform: translateY(-3px) scale(1.008);
      box-shadow: 0 20px 48px rgba(0,0,0,0.6);
    }

    .season-thumb {
      width: 90px;
      height: 56px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border-color);
      background: rgba(255,255,255,0.05);
      flex-shrink: 0;
    }

    .season-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .season-title {
      font-weight: 700;
      font-size: 1.2rem;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .season-sub {
      font-size: 0.85rem;
      color: #9ca3af;
      font-weight: 500;
    }

    .season-arrow {
      color: var(--text-muted);
      font-size: 1.1rem;
      transition: transform 0.3s ease;
    }
    .season-card:hover .season-arrow {
      color: white;
      transform: translateX(4px);
    }

    /* Navbar & Modal */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 3.5rem;
      background: rgba(8, 8, 10, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
    }
    .brand-logo { display: flex; align-items: center; gap: 0.8rem; text-decoration: none; color: var(--text-primary); }
    .brand-icon {
      width: 38px; height: 38px; background: white; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: black; transition: transform 0.3s ease;
    }
    .brand-logo:hover .brand-icon { transform: rotate(-8deg) scale(1.08); }
    .brand-name { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 800; }
    .nav-actions { display: flex; align-items: center; gap: 1rem; }
    .btn {
      padding: 0.65rem 1.6rem; border-radius: 9999px; border: none; font-weight: 700; cursor: pointer;
      transition: var(--transition); display: inline-flex; align-items: center; gap: 0.5rem; font-family: inherit; font-size: 0.82rem;
    }
    .btn-primary { background: white; color: black; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,255,255,0.25); }
    .btn-outline { background: transparent; color: white; border: 1px solid var(--border-color); }
    .btn-outline:hover { border-color: white; background: rgba(255,255,255,0.08); }
    
    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      backdrop-filter: blur(15px); z-index: 2000; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-backdrop.active { display: flex; animation: fadeIn 0.3s ease; }
    .modal-content {
      background: #121216; border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      width: 100%; max-width: 500px; padding: 2.5rem; animation: scaleIn 0.3s ease; box-shadow: 0 40px 80px rgba(0,0,0,0.8);
    }
    .modal-header { display: flex; justify-content: space-between; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; }
    .modal-title { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: white; }
    .modal-close { background: rgba(255,255,255,0.05); border: none; color: var(--text-muted); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; transition: 0.3s; }
    .modal-close:hover { background: var(--danger); color: white; transform: rotate(90deg); }
    .form-group { margin-bottom: 1.5rem; }
    .form-label { display: block; margin-bottom: 0.5rem; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .form-control {
      width: 100%; background: #08080a; border: 1px solid var(--border-color); padding: 0.85rem 1.1rem;
      border-radius: var(--radius-md); color: white; font-family: inherit; outline: none; transition: 0.3s;
    }
    .form-control:focus { border-color: white; background: #0c0c10; box-shadow: 0 0 0 3px rgba(255,255,255,0.1); }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideInLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* Responsive */
    @media (max-width: 1024px) {
      .split-container { flex-direction: column; }
      .left-panel { position: relative; height: auto; overflow-y: visible; border-right: none; border-bottom: 1px solid var(--divider-color); width: 100%; padding: 7rem 1.5rem 3rem; }
      .right-panel { width: 100%; padding: 3rem 1.5rem 4rem; }
      .left-content { max-width: 100%; }
      .movie-title { font-size: 2.2rem; }
    }
    #globalLoader {
      position: fixed; inset: 0; background: var(--bg-black); z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- Global Loader -->
  <div id="globalLoader">
    <i class="fas fa-spinner fa-spin" style="font-size: 2.5rem; color: rgba(255,255,255,0.2);"></i>
  </div>

  <!-- Dynamic Global Movie Backdrop Image -->
  <div id="globalMovieBackdrop" class="global-movie-backdrop"></div>
  <div class="global-backdrop-overlay"></div>

  <!-- Navbar -->
  <header class="navbar">
    <a href="index.html" class="brand-logo">
      <div class="brand-icon"><i class="fas fa-closed-captioning"></i></div>
      <div class="brand-name">Sub<span>tile</span></div>
    </a>
    <div class="nav-actions">
      <a href="browse.html" class="btn btn-outline"><i class="fas fa-compass"></i> Discover</a>
      <button class="btn btn-outline" onclick="openUploadModal()"><i class="fas fa-upload"></i> Upload</button>
      <button class="btn btn-primary">Premium</button>
    </div>
  </header>

  <!-- Main Split Layout -->
  <div class="split-container">
    
    <!-- Left Panel (Work Info) -->
    <aside class="left-panel">
      <div class="left-content">
        <img id="moviePoster" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Loading Poster" class="movie-poster" style="background: rgba(255,255,255,0.05); min-height: 380px;">
        
        <div id="movieTags" class="movie-tags">
          <!-- Tags injected by JS -->
        </div>
        
        <h1 id="movieTitle" class="movie-title"></h1>
        
        <div id="movieMeta" class="movie-meta">
          <!-- Meta injected by JS -->
        </div>
        
        <p id="movieOverview" class="movie-desc"></p>
      </div>
    </aside>

    <!-- Right Panel (Lists) -->
    <main class="right-panel">
      <div class="list-wrapper">
        
        <!-- Controls Header -->
        <div class="list-controls-header">
          <button id="backToSeasonsBtn" class="neo-back-btn" style="display: none;" title="Back to Seasons">
            <i class="fas fa-chevron-left"></i>
          </button>
          <h2 class="view-title" id="viewTitle">Seasons</h2>
          
          <div id="filterPillsContainer" class="filter-pills" style="display: none;">
            <div class="pill active" data-filter="all">All</div>
            <div class="pill" data-filter="lang:ar">Arabic</div>
            <div class="pill" data-filter="lang:en">English</div>
            <div class="pill" data-filter="quality:4K">4K</div>
            <div class="pill" data-filter="quality:1080p">1080p</div>
          </div>
        </div>

        <!-- Seasons List View -->
        <div id="seasonsListView" class="seasons-list-view">
          <!-- JS will inject seasons here -->
        </div>

        <!-- Subtitles List View -->
        <div id="subtitlesListView" style="display: none;">
          <div class="subtitles-list" id="subtitlesList"></div>
        </div>

      </div>
    </main>

  </div>

  <!-- Modal -->
  <div id="uploadModal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Upload Subtitle</h3>
        <button class="modal-close" onclick="closeUploadModal()"><i class="fas fa-times"></i></button>
      </div>
      <form onsubmit="handleUpload(event)">
        <div class="form-group">
          <label class="form-label">Movie / TV Show</label>
          <input id="modalMovieNameInput" type="text" class="form-control" value="" readonly>
        </div>
        <div class="form-group">
          <label class="form-label">Release Version</label>
          <input type="text" class="form-control" placeholder="e.g., 1080p.BluRay.x264" required>
        </div>
        <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
          <div style="flex:1">
            <label class="form-label">Language</label>
            <select class="form-control"><option>Arabic</option><option>English</option></select>
          </div>
          <div style="flex:1">
            <label class="form-label">Format</label>
            <select class="form-control"><option>SRT</option><option>ZIP</option></select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.9rem;"><i class="fas fa-paper-plane"></i> Submit File</button>
      </form>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script src="js/security.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-ui.js"></script>
  <script src="js/data.js"></script>
  <script src="js/tmdb-service.js"></script>
  <script src="js/movie-page.js"></script>
  <script>
    // Modal Logic
    function openUploadModal() { document.getElementById('uploadModal').classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeUploadModal() { document.getElementById('uploadModal').classList.remove('active'); document.body.style.overflow = 'auto'; }
    document.getElementById('uploadModal').addEventListener('click', function(e) { if(e.target === this) closeUploadModal(); });
    function handleUpload(e) { e.preventDefault(); closeUploadModal(); alert('Uploaded successfully!'); }

    // IntersectionObserver logic for fade in
    function attachFadeIn(elements) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry, index) => {
          if (entry.isIntersecting) {
            const delay = index * 60;
            setTimeout(() => {
              entry.target.classList.add('visible');
            }, delay);
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.05 });
      elements.forEach(item => observer.observe(item));
    }
    window.attachFadeIn = attachFadeIn;
  </script>
</body>
</html>
