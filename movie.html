<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(r) {
      if (r && r.length) {
        r.forEach(function(s) { s.unregister(); });
        if ('caches' in window) caches.keys().then(function(k) { k.forEach(function(c) { caches.delete(c); }); });
      }
    });
  }
  </script>
  <meta name="description" content="Download subtitles for movies, series, and anime.">
  <meta name="referrer" content="no-referrer">
  <title>Subtitles Archive — Subtile</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/ui-upgrade.css">

  <style>
    :root {
      --bg-base: #060608;
      --bg-panel: rgba(14, 14, 18, 0.72);
      --bg-card: rgba(22, 22, 30, 0.65);
      --bg-card-hover: rgba(30, 30, 42, 0.88);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.22);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --brand-accent: #ffffff;
      --brand-yellow: #f5c518;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Dynamic Full-Bleed Movie Backdrop */
    .global-backdrop-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      z-index: 0;
      opacity: 0.38;
      transform: scale(1.04);
      filter: saturate(120%);
      transition: background-image 0.4s ease-in-out, opacity 0.4s ease-in-out;
      pointer-events: none;
    }

    .global-backdrop-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: radial-gradient(circle at 65% 30%, rgba(6, 6, 8, 0.2) 0%, rgba(6, 6, 8, 0.75) 60%, rgba(6, 6, 8, 0.98) 100%),
                  linear-gradient(to right, rgba(6, 6, 8, 0.95) 0%, rgba(6, 6, 8, 0.65) 40%, rgba(6, 6, 8, 0.4) 60%, rgba(6, 6, 8, 0.85) 100%),
                  linear-gradient(to bottom, rgba(6, 6, 8, 0.8) 0%, transparent 20%, transparent 80%, rgba(6, 6, 8, 0.98) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .split-container {
      display: flex;
      min-height: 100vh;
      position: relative;
      z-index: 2;
      opacity: 1; visibility: visible;
    }
    .split-container.loaded { opacity: 1; visibility: visible; }

    /* Left Side: Movie Hero Info */
    .left-panel {
      background: linear-gradient(to right, rgba(6, 6, 8, 0.9) 0%, rgba(6, 6, 8, 0.7) 85%, transparent 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      width: 44%;
      padding: 6.5rem 3.5rem 4rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 10;
    }
    .left-panel::-webkit-scrollbar { display: none; }

    .left-content {
      max-width: 420px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .movie-poster {
      width: 100%;
      max-width: 300px;
      aspect-ratio: 2/3;
      border-radius: var(--radius-lg);
      box-shadow: 0 28px 60px -15px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.12);
      margin: 0 auto 2rem;
      transition: var(--transition);
      object-fit: cover;
    }
    .left-content:hover .movie-poster {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 36px 70px -15px rgba(0, 0, 0, 1), 0 0 0 1px rgba(255, 255, 255, 0.25);
    }

    .movie-title {
      font-size: 3rem;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 1rem;
      color: #ffffff;
      letter-spacing: -0.02em;
      word-break: break-word;
    }

    .tags {
      display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1.5rem;
    }
    .tag {
      background: rgba(255, 255, 255, 0.07);
      padding: 0.4rem 1rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #e5e7eb;
      border: 1px solid var(--border-color);
    }

    .preview-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.06); border: 1px solid var(--border-color);
      color: var(--text-muted); cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: all 0.25s ease; flex-shrink: 0;
    }
    .preview-btn:hover { background: rgba(59,130,246,0.15); color: #3b82f6; border-color: #3b82f6; }

    .scan-btn:hover { background: rgba(16,185,129,0.15) !important; color: #10b981 !important; border-color: #10b981 !important; }
    .scan-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .preview-overlay {
      position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    .preview-overlay.active { display: flex; }
    .preview-modal {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 16px; width: min(700px, 92vw); max-height: 80vh;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }
    .preview-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.2rem; border-bottom: 1px solid var(--border-color);
    }
    .preview-header h3 { margin: 0; font-size: 0.95rem; font-weight: 700; color: var(--text-main); }
    .preview-close {
      width: 32px; height: 32px; border-radius: 8px; border: none;
      background: rgba(255,255,255,0.06); color: var(--text-muted);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .preview-close:hover { background: rgba(239,68,68,0.15); color: #ef4444; }
    .preview-body {
      padding: 1rem 1.2rem; overflow-y: auto; flex: 1;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.8rem; line-height: 1.7; color: #d1d5db;
      white-space: pre-wrap; word-break: break-word;
      background: rgba(0,0,0,0.2);
    }
    .preview-body .sub-line { padding: 0.3rem 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .preview-body .sub-timestamp { color: #3b82f6; font-weight: 600; }
    .preview-loading {
      display: flex; align-items: center; justify-content: center;
      padding: 3rem; color: var(--text-muted);
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .meta {
      display: flex; align-items: center; justify-content: center; gap: 1.5rem;
      margin-bottom: 2rem; color: var(--text-muted); font-size: 0.95rem; font-weight: 600;
    }
    .meta-item { display: flex; align-items: center; gap: 0.4rem; }
    
    .rating-circle {
      display: inline-flex; align-items: center; justify-content: center;
      background: #ffffff; color: #050507;
      font-weight: 900; font-size: 0.95rem;
      padding: 0.25rem 0.75rem; border-radius: 50px;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.25);
    }

    .overview {
      color: #d1d5db; line-height: 1.85; font-size: 1.05rem;
      text-align: center; margin-bottom: 2.5rem; font-weight: 400;
      display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Right Side: Seasons & Subtitles */
    .right-panel {
      width: 56%;
      padding: 6.5rem 4rem 4rem 3.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      z-index: 5;
    }

    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2rem;
    }
    .panel-title {
      font-size: 1.8rem; font-weight: 900; color: #ffffff;
      display: flex; align-items: center; gap: 0.75rem;
    }
    
    .back-btn {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border-color);
      color: #ffffff; padding: 0.5rem 1rem; border-radius: 50px;
      font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: var(--transition);
      display: inline-flex; align-items: center; gap: 0.5rem;
    }
    .back-btn:hover { background: rgba(255,255,255,0.15); border-color: var(--border-hover); }

    /* Filters */
    .filter-pills { display: flex; gap: 0.6rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .pill {
      background: var(--surface); color: var(--text-muted);
      padding: 0.55rem 1.1rem; border-radius: 50px; font-size: 0.82rem; font-weight: 700;
      border: 1px solid var(--border-color); cursor: pointer; transition: var(--transition);
    }
    .pill:hover { border-color: var(--border-hover); color: var(--text); background: var(--surface-hover); }
    .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 16px rgba(var(--accent-rgb), 0.25); }

    /* Subtitles List */
    .subtitles-list { display: grid; gap: 1rem; }
    .subtitle-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.4rem 1.8rem;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      transition: var(--transition);
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }
    .subtitle-item:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.6);
    }

    .sub-info { display: flex; flex-direction: column; gap: 0.4rem; }
    .sub-release {
      font-weight: 700; font-size: 1.1rem; color: #f9fafb;
      word-break: break-all;
    }
    
    .format-badge {
      padding: 0.25rem 0.65rem; border-radius: 6px;
      font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .format-badge.badge-ass {
      background: rgba(168, 85, 247, 0.18);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.45);
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.25);
    }
    .format-badge.badge-srt {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .format-badge.badge-vtt {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .format-badge.badge-zip {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }

    .sub-meta { display: flex; gap: 1.2rem; font-size: 0.85rem; color: #9ca3af; flex-wrap: wrap; }
    
    .download-btn {
      background: rgba(255,255,255,0.08); color: white; width: 46px; height: 46px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; text-decoration: none;
      transition: var(--transition); border: 1px solid var(--border-color); font-size: 1.05rem;
      flex-shrink: 0;
    }
    .download-btn:hover { background: #ffffff; color: #050507; transform: scale(1.1); border-color: transparent; box-shadow: 0 4px 16px rgba(255,255,255,0.3); }

    /* Seasons Cards */
    .seasons-list-view { display: flex; flex-direction: column; gap: 1rem; }
    .season-card {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 1.6rem;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      cursor: pointer; transition: var(--transition);
    }
    .season-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }
    .season-card-info { display: flex; align-items: center; gap: 1.2rem; }
    .season-thumb { width: 48px; height: 68px; border-radius: 8px; object-fit: cover; }
    .season-title { font-weight: 800; font-size: 1.2rem; color: #fff; }
    .season-sub { font-size: 0.85rem; color: #9ca3af; }

    /* Navbar */
    .nav-header {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
      padding: 1rem clamp(1rem, 4vw, 3rem); display: flex; justify-content: space-between; align-items: center;
      background: rgba(6, 6, 8, 0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
    }
    .nav-brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: #fff; font-weight: 900; font-size: 1.2rem; }
    .nav-right { display: flex; gap: 1rem; align-items: center; }
    .nav-right .back-btn { display: inline-flex; }
    .movie-nav-hamburger { display: none; background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; padding: 0.5rem; }

    @media (max-width: 768px) {
      .nav-right .back-btn { display: none; }
      .movie-nav-hamburger { display: flex; align-items: center; justify-content: center; }
    }
    #movieMobileNav {
      display: none; position: fixed; inset: 0; background: rgba(5,5,7,0.99);
      z-index: 200; flex-direction: column; align-items: center; justify-content: center; gap: 2rem;
    }
    #movieMobileNav.active { display: flex; }
    #movieMobileNav a, #movieMobileNav button {
      font-size: 1.3rem; font-weight: 700; color: #fff; text-decoration: none;
      padding: 0.8rem 2rem; border-radius: 12px; transition: all 0.2s; background: none; border: none; cursor: pointer;
    }
    #movieMobileNav a:hover, #movieMobileNav button:hover { background: rgba(255,255,255,0.08); }
    
    /* Toast */
    #toastContainer { position: fixed; bottom: 2rem; right: 2rem; z-index: 999; display: flex; flex-direction: column; gap: 0.8rem; }
    .toast { background: rgba(14, 14, 18, 0.98); border: 1px solid var(--border-hover); padding: 1rem 1.5rem; border-radius: 12px; color: #fff; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: flex; align-items: center; gap: 0.6rem; }

    /* Global Loader */
    #globalLoader {
      position: fixed; inset: 0; background: var(--bg-base); z-index: 200;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.4s ease;
    }

    @media (max-width: 900px) {
      .split-container { flex-direction: column; }
      .left-panel { width: 100%; height: auto; position: relative; padding: 5rem 1.5rem 2rem; }
      .right-panel { width: 100%; padding: 1.5rem; }
      .movie-title { font-size: clamp(1.5rem, 5vw, 3rem) !important; }
      .meta { flex-wrap: wrap; gap: 0.8rem !important; }
      .overview { font-size: 0.9rem; -webkit-line-clamp: 3; }
      .reviews-section { padding: 1.5rem 1rem 3rem !important; }
    }
    @media (max-width: 480px) {
      .left-panel { padding: 4.5rem 1rem 1.5rem; }
      .right-panel { padding: 1rem; }
      .movie-poster { max-width: 180px !important; }
      .season-card { padding: 0.8rem !important; }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Cinema Backdrop -->
  <div id="globalMovieBackdrop" class="global-backdrop-bg"></div>
  <div class="global-backdrop-overlay"></div>

  <!-- Global Loader -->
  <div id="globalLoader">
    <i class="fas fa-spinner fa-spin text-3xl text-white"></i>
  </div>

  <!-- Top Navbar -->
  <header class="nav-header">
    <a href="index.html" class="nav-brand">
      <div style="width: 32px; height: 32px; background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
        <svg style="width: 18px; height: 18px; color: #000;" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
      </div>
      <span>SUBTILE</span>
    </a>
    <div class="nav-right">
      <a href="index.html" class="back-btn"><i class="fas fa-home"></i> Trending</a>
      <a href="browse.html" class="back-btn"><i class="fas fa-compass"></i> Browse</a>
      <div id="navAuthSlot"></div>
      <button class="movie-nav-hamburger" onclick="document.getElementById('movieMobileNav').classList.toggle('active')"><i class="fas fa-bars"></i></button>
    </div>
  </header>

  <!-- Mobile Nav Overlay -->
  <div id="movieMobileNav" class="mobile-nav">
    <button onclick="this.parentElement.classList.remove('active')" style="position:absolute;top:1.5rem;right:1.5rem;background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;"><i class="fas fa-times"></i></button>
    <a href="index.html"><i class="fas fa-fire"></i> Trending</a>
    <a href="browse.html"><i class="fas fa-compass"></i> Browse</a>
    <a href="login.html"><i class="fas fa-sign-in-alt"></i> Login</a>
  </div>

  <!-- Split Container -->
  <div class="split-container">
    
    <!-- Left Panel: Movie Hero Artwork & Details -->
    <div class="left-panel">
      <div class="left-content">
        <img id="moviePoster" src="" alt="Poster" class="movie-poster">
        <h1 id="movieTitle" class="movie-title"></h1>
        <div id="movieTags" class="tags"></div>
        <div id="movieMeta" class="meta"></div>
        <p id="movieOverview" class="overview"></p>
        <a href="#subtitlesListView" id="heroDownloadBtn" style="margin-top: 1.5rem; width: 100%; padding: 0.85rem 1.5rem; background: #ffffff; color: #050507; border-radius: 12px; font-weight: 800; font-size: 0.95rem; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 0.6rem; transition: all 0.2s ease; box-shadow: 0 4px 20px rgba(255,255,255,0.15);" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
          <i class="fas fa-arrow-down"></i> Select & Download Subtitles
        </a>
        <div id="favBtnSlot" style="margin-top: 0.75rem; width: 100%;"></div>
        <div id="shareBtnSlot" style="margin-top: 0.5rem; width: 100%;"></div>
      </div>
    </div>

    <!-- Right Panel: Seasons & Subtitles List -->
    <div class="right-panel">
      
      <div class="panel-header">
        <h2 id="viewTitle" class="panel-title"><i class="fas fa-closed-captioning"></i> <span data-i18n="subtitlesArchive">Subtitles Archive</span></h2>
        <div style="display:flex; gap:0.5rem; align-items:center;">
          <button id="batchDownloadBtn" class="back-btn btn-ripple" style="display:none;" onclick="batchDownloadAll()"><i class="fas fa-file-archive"></i> Download All</button>
          <button id="scanAllBtn" class="back-btn btn-ripple" style="display:none;" onclick="scanAllSubtitles()"><i class="fas fa-shield-alt"></i> Scan All</button>
          <button id="watchlistBtn" class="back-btn btn-ripple" onclick="toggleWatchlist()"><i class="far fa-bookmark"></i> <span id="watchlistBtnText" data-i18n="addToWatchlist">Add to Watchlist</span></button>
          <button id="backToSeasonsBtn" class="back-btn btn-ripple" style="display: none;"><i class="fas fa-arrow-left"></i> <span data-i18n="backToSeasons">Back to Seasons</span></button>
        </div>
      </div>

      <!-- Filter Pills -->
      <div id="filterPillsContainer" class="filter-pills">
        <button class="pill active" data-filter="all" data-i18n="allLanguages">All Languages</button>
        <button class="pill" data-filter="lang:ar">Arabic 🇸🇦</button>
        <button class="pill" data-filter="lang:en">English 🇬🇧</button>
        <button class="pill" data-filter="lang:fr">Français 🇫🇷</button>
        <button class="pill" data-filter="lang:ja">日本語 🇯🇵</button>
        <button class="pill" data-filter="quality:1080p">1080p BluRay</button>
        <button class="pill" data-filter="quality:4k">4K UHD</button>
      </div>

      <!-- Seasons List (for TV & Anime) -->
      <div id="seasonsListView" class="seasons-list-view" style="display: none;"></div>

      <!-- Subtitles List -->
      <div id="subtitlesListView">
        <div id="subtitlesList" class="subtitles-list"></div>
      </div>

    </div>

  </div>

  <!-- Reviews Section -->
  <div id="reviewsSection" style="max-width:1100px; margin: 0 auto; padding: 2rem 2rem 4rem;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem;">
      <h2 style="font-size:1.4rem; font-weight:900; color: var(--text-main);"><i class="fas fa-star" style="color:#fbbf24;"></i> <span data-i18n="reviews">Reviews</span></h2>
      <span id="reviewCount" style="font-size:0.85rem; color: var(--text-muted);"></span>
    </div>

    <!-- Review Form -->
    <div id="reviewFormContainer" style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1.5rem; margin-bottom: 2rem;">
      <div id="reviewFormLoggedOut" style="text-align:center; padding: 1rem; color: var(--text-muted); font-size: 0.9rem;">
        <span data-i18n="loginToReview">Login to leave a review</span>
      </div>
      <div id="reviewFormActive" style="display:none;">
        <div style="margin-bottom:1rem;">
          <label style="display:block; font-size:0.8rem; font-weight:700; color: var(--text-muted); margin-bottom:0.4rem;" data-i18n="rateAndReview">Rate & Review</label>
          <div id="starRating" style="display:flex; gap:0.3rem; font-size:1.4rem; cursor:pointer;">
            <i class="far fa-star" data-star="1" onmouseover="previewStars(1)" onmouseout="resetStars()" onclick="setRating(1)"></i>
            <i class="far fa-star" data-star="2" onmouseover="previewStars(2)" onmouseout="resetStars()" onclick="setRating(2)"></i>
            <i class="far fa-star" data-star="3" onmouseover="previewStars(3)" onmouseout="resetStars()" onclick="setRating(3)"></i>
            <i class="far fa-star" data-star="4" onmouseover="previewStars(4)" onmouseout="resetStars()" onclick="setRating(4)"></i>
            <i class="far fa-star" data-star="5" onmouseover="previewStars(5)" onmouseout="resetStars()" onclick="setRating(5)"></i>
          </div>
        </div>
        <textarea id="reviewComment" rows="3" maxlength="500" placeholder="Write your thoughts..." style="width:100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 0.5rem; padding: 0.7rem 1rem; color: var(--text-main); font-size: 0.9rem; resize: vertical; outline: none; margin-bottom:1rem;"></textarea>
        <button onclick="submitReview()" style="background:#fff; color:#050507; font-weight:800; padding:0.6rem 1.4rem; border-radius:0.5rem; border:none; cursor:pointer; font-size:0.85rem;" data-i18n="submitReview">Submit Review</button>
      </div>
    </div>

    <!-- Reviews List -->
    <div id="reviewsList" class="space-y-3"></div>
  </div>

  <div id="toastContainer"></div>

  <!-- Subtitle Preview Modal -->
  <div id="previewModal" class="preview-overlay" onclick="if(event.target===this)closePreview()">
    <div class="preview-modal">
      <div class="preview-header">
        <h3 id="previewTitle">Subtitle Preview</h3>
        <button class="preview-close" onclick="closePreview()"><i class="fas fa-times"></i></button>
      </div>
      <div id="previewBody" class="preview-body">
        <div class="preview-loading"><i class="fas fa-spinner fa-spin" style="margin-right:0.5rem;"></i> Loading preview...</div>
      </div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="uploadModal" style="display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; padding:1rem;" onclick="if(event.target===this)closeUploadModal()">
    <div style="background:#12151b; border:1px solid #23262e; border-radius:16px; max-width:500px; width:100%; padding:2rem; box-shadow:0 16px 40px rgba(0,0,0,0.8); position:relative;">
      <button onclick="closeUploadModal()" style="position:absolute; top:1rem; left:1rem; background:none; border:none; color:#6b7280; cursor:pointer; font-size:1.1rem;"><i class="fas fa-times"></i></button>
      <h3 style="font-size:1.2rem; font-weight:800; color:#fff; margin-bottom:1.5rem;"><i class="fas fa-upload" style="margin-right:0.5rem;"></i> Upload Subtitle</h3>
      <form id="uploadForm" onsubmit="handleUploadSubtitle(event)" class="space-y-4">
        <div>
          <label style="display:block; font-size:0.8rem; font-weight:700; color:#9ca3af; margin-bottom:6px;">Subtitle File (.srt, .ass, .vtt)</label>
          <input type="file" accept=".srt,.ass,.vtt,.zip" style="width:100%; background:rgba(5,5,7,0.8); border:1px solid #27272a; border-radius:12px; padding:12px; color:#fff; font-size:0.875rem; outline:none; box-sizing:border-box;">
        </div>
        <div>
          <label style="display:block; font-size:0.8rem; font-weight:700; color:#9ca3af; margin-bottom:6px;">Language</label>
          <select data-custom style="width:100%; background:var(--surface); border:1px solid var(--border-color); border-radius:12px; padding:12px; color:var(--text); font-size:0.875rem; outline:none; box-sizing:border-box;">
            <option value="ar">Arabic</option>
            <option value="en">English</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
            <option value="ja">Japanese</option>
          </select>
        </div>
        <button type="submit" style="width:100%; background:#fff; color:#050507; font-weight:900; border:none; padding:12px; border-radius:12px; cursor:pointer; font-size:0.875rem; display:flex; align-items:center; justify-content:center; gap:8px;">
          <i class="fas fa-upload"></i> Upload
        </button>
      </form>
    </div>
  </div>

  <!-- Scripts -->

  <script src="js/security.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/custom-select.js"></script>
  <script src="js/movie-page.js"></script>
  <script src="js/features.js"></script>
  <script>
  if (typeof KeyboardShortcuts !== 'undefined') KeyboardShortcuts.init();
  </script>
</body>
</html>
