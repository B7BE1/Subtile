<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtile | Premium 3D Cinema UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-black: #050507;
      --bg-dark: #0a0a0c;
      --bg-card-glass: rgba(15, 15, 18, 0.6);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.2);
      --text-primary: #ffffff;
      --text-muted: #8a8a92;
      --accent: #ffffff;
      --danger: #ef4444;
      --radius-lg: 1.5rem;
      --radius-md: 0.75rem;
      --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      background-color: var(--bg-black);
    }

    /* Split Layout Container */
    .split-container {
      display: flex;
      min-height: 100vh;
      position: relative;
    }

    /* Left Side (Movie Details - Centered & Clear) */
    .left-panel {
      background-color: var(--bg-black);
      width: 45%;
      padding: 8rem 4rem 4rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center; /* Centered content */
      position: relative;
      z-index: 2;
    }

    /* Fade Overlay */
    .left-panel::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      right: -100px;
      width: 200px;
      background: linear-gradient(to right, var(--bg-black) 20%, transparent 100%);
      z-index: 3;
      pointer-events: none;
    }

    .left-content {
      max-width: 400px;
      width: 100%;
      text-align: center; /* Clear centered text */
      animation: slideInLeft 1s ease;
    }

    .movie-poster {
      width: 100%;
      max-width: 300px;
      border-radius: var(--radius-lg);
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      margin: 0 auto 2.5rem;
      transform: rotate(0deg); /* Straightened for clarity */
      transition: transform 0.5s ease;
      border: 1px solid var(--border-color);
      filter: grayscale(20%);
    }
    .left-content:hover .movie-poster { transform: scale(1.02); filter: grayscale(0%); }

    .movie-tags { display: flex; gap: 0.5rem; margin-bottom: 1rem; justify-content: center; }
    .tag {
      padding: 0.3rem 0.8rem; background: transparent; color: var(--text-muted);
      border-radius: 50px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; border: 1px solid var(--border-color);
    }

    .movie-title {
      font-family: 'Playfair Display', serif; font-size: 3.5rem; font-weight: 900;
      line-height: 1.1; margin-bottom: 1.5rem; color: white; letter-spacing: -0.03em;
    }

    .movie-meta { display: flex; gap: 1.5rem; margin-bottom: 2rem; color: var(--text-muted); font-weight: 600; font-size: 0.95rem; align-items: center; justify-content: center; }
    .meta-item { display: flex; align-items: center; gap: 0.4rem; }
    
    .rating-token {
      width: 50px; height: 50px; border-radius: 50%; background: black;
      box-shadow: 0 0 0 2px white, inset 0 0 0 4px black;
      display: flex; align-items: center; justify-content: center;
    }
    .rating-token span { font-weight: 900; font-size: 1rem; color: white; }

    .movie-desc {
      color: var(--text-muted); margin-bottom: 2rem; line-height: 1.8; font-size: 1.05rem;
      text-align: center; /* Removed border for cleaner look */
    }

    /* Right Side (Banner & 3D Subtitles List) */
    .right-panel {
      width: 55%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8rem 4rem 4rem;
      z-index: 1;
      overflow: hidden;
      perspective: 1500px;
    }

    .banner-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://image.tmdb.org/t/p/original/8Y43POKjjKDGI9MH89NW0NAzzp8.jpg');
      background-size: cover;
      background-position: center;
      filter: grayscale(90%) brightness(0.3) contrast(1.2);
      z-index: -2;
      transition: transform 0.3s ease-out;
    }

    .banner-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to right, var(--bg-black) 0%, rgba(5,5,7,0.4) 15%, rgba(5,5,7,0.2) 50%, rgba(5,5,7,0.8) 100%);
      z-index: -1;
    }

    .list-wrapper {
      width: 100%;
      max-width: 600px;
      transform-style: preserve-3d;
      transform: rotateX(5deg);
      transition: transform 0.1s ease-out;
    }

    .filter-pills {
      display: flex; gap: 0.6rem; margin-bottom: 2rem; flex-wrap: wrap;
      transform: translateZ(40px);
    }
    .pill {
      padding: 0.6rem 1.2rem; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px);
      border: 1px solid var(--border-color); border-radius: 50px; cursor: pointer;
      transition: var(--transition); font-size: 0.85rem; font-weight: 600; color: var(--text-muted);
    }
    .pill:hover { border-color: var(--border-hover); color: white; background: rgba(255,255,255,0.1); }
    .pill.active { background: white; color: black; border-color: white; }

    .subtitles-list {
      display: grid;
      gap: 1.2rem;
      max-height: 60vh;
      overflow-y: auto;
      padding-right: 0.5rem;
      transform: translateZ(20px);
    }

    .subtitles-list::-webkit-scrollbar { width: 4px; }
    .subtitles-list::-webkit-scrollbar-track { background: transparent; }
    .subtitles-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

    .subtitle-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.5rem; background: var(--bg-card-glass); backdrop-filter: blur(15px) saturate(150%);
      border-radius: var(--radius-md); transition: var(--transition);
      border: 1px solid var(--border-color); opacity: 0; transform: translateX(30px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .subtitle-item.visible { opacity: 1; transform: translateX(0); }

    .subtitle-item:hover {
      background: rgba(255,255,255,0.08); border-color: var(--border-hover);
      transform: translateX(-5px) translateZ(20px) !important;
    }

    .sub-info { display: flex; flex-direction: column; gap: 0.5rem; }
    .sub-release {
      font-weight: 700; font-size: 1.1rem; color: white; display: flex; align-items: center; gap: 0.8rem; letter-spacing: -0.02em;
    }
    .format-badge {
      background: white; color: black; padding: 0.2rem 0.6rem; border-radius: 6px;
      font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
    }
    .sub-meta { display: flex; gap: 1.5rem; font-size: 0.85rem; color: var(--text-muted); }
    
    .download-btn {
      background: rgba(255,255,255,0.05); color: white; width: 45px; height: 45px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; text-decoration: none; transition: var(--transition);
      border: 1px solid var(--border-color);
    }
    .download-btn:hover { background: white; color: black; transform: scale(1.1); border-color: transparent; }

    /* Navbar */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 4rem;
      background: rgba(5, 5, 7, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
    }
    .brand-logo { display: flex; align-items: center; gap: 0.8rem; text-decoration: none; color: var(--text-primary); }
    .brand-icon {
      width: 42px; height: 42px; background: white; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: black; transition: transform 0.3s ease;
    }
    .brand-logo:hover .brand-icon { transform: rotate(-10deg) scale(1.1); }
    .brand-name { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 800; }

    .nav-actions { display: flex; align-items: center; gap: 1rem; }
    .btn {
      padding: 0.8rem 1.8rem; border-radius: 50px; border: none; font-weight: 600; cursor: pointer;
      transition: var(--transition); display: inline-flex; align-items: center; gap: 0.5rem; font-family: inherit; font-size: 0.85rem;
    }
    .btn-primary { background: white; color: black; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255,255,255,0.2); }
    .btn-outline { background: transparent; color: white; border: 1px solid var(--border-color); }
    .btn-outline:hover { border-color: white; background: rgba(255,255,255,0.05); }

    /* Modal */
    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      backdrop-filter: blur(15px); z-index: 2000; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-backdrop.active { display: flex; animation: fadeIn 0.3s ease; }
    .modal-content {
      background: #121214; border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      width: 100%; max-width: 500px; padding: 2.5rem; animation: scaleIn 0.4s ease; box-shadow: 0 40px 80px rgba(0,0,0,0.8);
    }
    .modal-header { display: flex; justify-content: space-between; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; }
    .modal-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: white; }
    .modal-close { background: rgba(255,255,255,0.05); border: none; color: var(--text-muted); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; transition: 0.3s; }
    .modal-close:hover { background: var(--danger); color: white; transform: rotate(90deg); }
    .form-group { margin-bottom: 1.5rem; }
    .form-label { display: block; margin-bottom: 0.5rem; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .form-control {
      width: 100%; background: #000; border: 1px solid var(--border-color); padding: 0.9rem 1.2rem;
      border-radius: var(--radius-md); color: white; font-family: inherit; outline: none; transition: 0.3s;
    }
    .form-control:focus { border-color: white; background: #050507; box-shadow: 0 0 0 3px rgba(255,255,255,0.1); }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideInLeft { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* Responsive */
    @media (max-width: 1024px) {
      .split-container { flex-direction: column; }
      .left-panel, .right-panel { width: 100%; padding: 8rem 1.5rem 4rem; }
      .left-panel::after { display: none; }
      .left-content { text-align: center; max-width: 100%; }
      .movie-title { font-size: 3rem; }
      .right-panel { min-height: auto; }
      .list-wrapper { transform: rotateX(0deg) !important; }
      .filter-pills, .subtitles-list { transform: translateZ(0px) !important; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <a href="index.html" class="brand-logo">
      <div class="brand-icon"><i class="fas fa-closed-captioning"></i></div>
      <div class="brand-name">Sub<span>tile</span></div>
    </a>
    <div class="nav-actions">
      <button class="btn btn-outline" onclick="openUploadModal()"><i class="fas fa-upload"></i> Upload</button>
      <button class="btn btn-primary">Premium</button>
    </div>
  </header>

  <!-- Main Split Layout -->
  <div class="split-container">
    
    <!-- Left Panel (Work Info - Centered & Clear) -->
    <aside class="left-panel">
      <div class="left-content">
        <img src="https://image.tmdb.org/t/p/w500/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg" alt="Poster" class="movie-poster">
        
        <div class="movie-tags">
          <span class="tag">2024</span>
          <span class="tag">Sci-Fi</span>
          <span class="tag">Action</span>
        </div>
        
        <h1 class="movie-title">Dune: Part Two</h1>
        
        <div class="movie-meta">
          <div class="rating-token"><span>8.6</span></div>
          <div class="meta-item"><i class="fas fa-clock"></i> 2h 46m</div>
          <div class="meta-item"><i class="fas fa-language"></i> EN</div>
        </div>
        
        <p class="movie-desc">
          Paul Atreides unites with Chani and the Fremen while seeking revenge against the conspirators who destroyed his family. Facing a choice between the love of his life and the fate of the universe.
        </p>
      </div>
    </aside>

    <!-- Right Panel (Banner & Floating 3D Subtitles List) -->
    <main class="right-panel" id="rightPanel">
      <div class="banner-bg" id="bannerBg"></div>
      <div class="banner-overlay"></div>

      <!-- 3D List Wrapper -->
      <div class="list-wrapper" id="listWrapper">
        
        <div class="filter-pills">
          <div class="pill active">All</div>
          <div class="pill">Arabic</div>
          <div class="pill">English</div>
          <div class="pill">4K</div>
          <div class="pill">1080p</div>
        </div>

        <div class="subtitles-list" id="subList">
          <!-- Items injected by JS -->
        </div>
      </div>
    </main>

  </div>

  <!-- Modal -->
  <div id="uploadModal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Upload Subtitle</h3>
        <button class="modal-close" onclick="closeUploadModal()"><i class="fas fa-times"></i></button>
      </div>
      <form onsubmit="handleUpload(event)">
        <div class="form-group">
          <label class="form-label">Movie / TV Show</label>
          <input type="text" class="form-control" value="Dune: Part Two (2024)" readonly>
        </div>
        <div class="form-group">
          <label class="form-label">Release Version</label>
          <input type="text" class="form-control" placeholder="e.g., 1080p.BluRay.x264" required>
        </div>
        <div style="display: flex; gap: 1rem; margin-bottom: 2rem;">
          <div style="flex:1">
            <label class="form-label">Language</label>
            <select class="form-control"><option>English</option><option>Arabic</option></select>
          </div>
          <div style="flex:1">
            <label class="form-label">Format</label>
            <select class="form-control"><option>SRT</option><option>ZIP</option></select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 1rem;"><i class="fas fa-paper-plane"></i> Submit File</button>
      </form>
    </div>
  </div>

  <script>
    // Mock Data
    const subtitles = [
      { release: "Dune.Part.Two.2024.720p.HD", format: "SRT", lang: "Arabic", flag: "SA", author: "Translator Pro", downloads: "12.4k" },
      { release: "Dune.Part.Two.2024.1080p.BluRay", format: "ZIP", lang: "Arabic", flag: "SA", author: "Sub Team X", downloads: "8.9k" },
      { release: "Dune.Part.Two.2024.2160p.4K.UHD", format: "SRT", lang: "English", flag: "GB", author: "Official", downloads: "24.1k" },
      { release: "Dune.Part.Two.2024.1080p.WEB-DL", format: "SRT", lang: "English", flag: "US", author: "Crawler", downloads: "15.3k" },
      { release: "Dune.Part.Two.2024.720p.WEBRip", format: "SRT", lang: "Arabic", flag: "EG", author: "Pro Subs", downloads: "5.2k" }
    ];

    // Render List
    const list = document.getElementById('subList');
    subtitles.forEach((sub) => {
      const item = document.createElement('div');
      item.className = 'subtitle-item';
      item.innerHTML = `
        <div class="sub-info">
          <div class="sub-release">
            ${sub.release}
            <span class="format-badge">${sub.format}</span>
          </div>
          <div class="sub-meta">
            <span><i class="fas fa-flag"></i> ${sub.lang} (${sub.flag})</span>
            <span><i class="fas fa-user"></i> ${sub.author}</span>
            <span><i class="fas fa-download"></i> ${sub.downloads}</span>
          </div>
        </div>
        <a href="#" class="download-btn"><i class="fas fa-download"></i></a>
      `;
      list.appendChild(item);
    });

    // Scroll/Load Reveal Animation
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          setTimeout(() => {
            entry.target.classList.add('visible');
          }, Array.from(entry.target.parentNode.children).indexOf(entry.target) * 100);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.subtitle-item').forEach(item => observer.observe(item));

    // 3D Mouse Parallax (Rotation X & Y)
    const rightPanel = document.getElementById('rightPanel');
    const listWrapper = document.getElementById('listWrapper');
    const bannerBg = document.getElementById('bannerBg');

    rightPanel.addEventListener('mousemove', (e) => {
      const rect = rightPanel.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      
      listWrapper.style.transform = `rotateY(${x * 12}deg) rotateX(${5 - (y * 12)}deg)`;
      bannerBg.style.transform = `scale(1.1) translate(${x * -20}px, ${y * -20}px)`;
    });

    rightPanel.addEventListener('mouseleave', () => {
      listWrapper.style.transform = `rotateY(0deg) rotateX(5deg)`;
      bannerBg.style.transform = `scale(1.1) translate(0, 0)`;
    });

    // Modal Logic
    function openUploadModal() { document.getElementById('uploadModal').classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeUploadModal() { document.getElementById('uploadModal').classList.remove('active'); document.body.style.overflow = 'auto'; }
    document.getElementById('uploadModal').addEventListener('click', function(e) { if(e.target === this) closeUploadModal(); });
    function handleUpload(e) { e.preventDefault(); closeUploadModal(); alert('Uploaded successfully!'); }

    // Filter Pills Interaction
    document.querySelectorAll('.pill').forEach(pill => {
      pill.addEventListener('click', function() {
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
