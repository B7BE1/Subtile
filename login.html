<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subtile — Cinema Account Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050507; color: #fff; }
        .cinema-bg {
            background-image: url('https://images.metahub.space/background/medium/tt15398776/img');
            background-size: cover;
            background-position: center;
            position: fixed;
            inset: 0;
            opacity: 0.25;
            filter: blur(8px) brightness(0.7);
            z-index: 0;
            transform: scale(1.05);
        }
        .auth-card {
            background: rgba(18, 18, 24, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85);
        }
        .tab-btn.active {
            background: #ffffff;
            color: #050507;
            border-color: #ffffff;
            box-shadow: 0 4px 16px rgba(255, 255, 255, 0.2);
        }
        .toast { transform: translateY(150%); transition: transform .35s cubic-bezier(.2,.9,.3,1.2); }
        .toast.show { transform: translateY(0); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden relative">

    <div class="cinema-bg"></div>
    <div class="fixed inset-0 bg-gradient-to-t from-neutral-950 via-neutral-950/80 to-transparent z-0 pointer-events-none"></div>

    <!-- Header / Brand -->
    <header class="relative z-10 w-full container mx-auto px-6 py-6 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-3 group">
            <div class="w-9 h-9 bg-neutral-100 rounded-lg flex items-center justify-center transition-transform group-hover:scale-105">
                <svg class="w-5 h-5 text-neutral-950" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
            </div>
            <span class="text-xl font-black tracking-tight text-neutral-100">SUBTILE</span>
        </a>

        <div class="flex items-center gap-4">
            <a href="index.html" class="text-sm font-semibold text-neutral-400 hover:text-white transition-colors flex items-center gap-1.5">
                <i class="fas fa-arrow-left"></i>
                <span>Back to Home</span>
            </a>
        </div>
    </header>

    <!-- Main Auth Container -->
    <main class="relative z-10 container mx-auto px-4 py-8 flex items-center justify-center flex-1">
        <div class="auth-card w-full max-w-md rounded-2xl p-8 transition-all">
            
            <!-- Auth Tabs -->
            <div class="flex bg-neutral-900/90 border border-neutral-800 p-1 rounded-xl mb-8">
                <button id="tabLogin" onclick="switchAuthTab('login')" class="tab-btn active flex-1 py-2.5 rounded-lg text-sm font-bold transition-all text-center">
                    Sign In
                </button>
                <button id="tabRegister" onclick="switchAuthTab('register')" class="tab-btn flex-1 py-2.5 rounded-lg text-sm font-bold text-neutral-400 hover:text-neutral-200 transition-all text-center">
                    Create Account
                </button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-neutral-300 mb-1.5">Username or Email</label>
                    <div class="relative">
                        <input type="text" id="loginIdentifier" required autocomplete="username" placeholder="Enter your username or email" 
                            class="w-full bg-neutral-950/80 border border-neutral-800 rounded-xl py-3 ps-4 pe-10 text-sm focus:outline-none focus:border-neutral-400 transition-colors text-white placeholder:text-neutral-600">
                        <i class="fas fa-user absolute end-3.5 top-3.5 text-neutral-500 text-sm"></i>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-bold text-neutral-300">Password</label>
                        <a href="#" onclick="alert('Please contact support to reset your password.'); return false;" class="text-xs text-neutral-400 hover:text-white transition-colors">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••" 
                            class="w-full bg-neutral-950/80 border border-neutral-800 rounded-xl py-3 ps-4 pe-10 text-sm focus:outline-none focus:border-neutral-400 transition-colors text-white placeholder:text-neutral-600">
                        <i class="fas fa-lock absolute end-3.5 top-3.5 text-neutral-500 text-sm"></i>
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs text-neutral-400 py-1">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="rememberMe" class="rounded bg-neutral-900 border-neutral-700 text-white focus:ring-0">
                        <span>Remember me for 30 days</span>
                    </label>
                </div>

                <button type="submit" id="btnLoginSubmit" class="w-full bg-white text-neutral-950 hover:bg-neutral-200 font-black py-3 rounded-xl transition-all shadow-lg text-sm flex items-center justify-center gap-2 mt-4">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" onsubmit="handleRegisterSubmit(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-neutral-300 mb-1.5">Username</label>
                    <div class="relative">
                        <input type="text" id="regUsername" required autocomplete="username" placeholder="Choose a username" 
                            class="w-full bg-neutral-950/80 border border-neutral-800 rounded-xl py-3 ps-4 pe-10 text-sm focus:outline-none focus:border-neutral-400 transition-colors text-white placeholder:text-neutral-600">
                        <i class="fas fa-user-tag absolute end-3.5 top-3.5 text-neutral-500 text-sm"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-neutral-300 mb-1.5">Email Address</label>
                    <div class="relative">
                        <input type="email" id="regEmail" required autocomplete="email" placeholder="name@example.com" 
                            class="w-full bg-neutral-950/80 border border-neutral-800 rounded-xl py-3 ps-4 pe-10 text-sm focus:outline-none focus:border-neutral-400 transition-colors text-white placeholder:text-neutral-600">
                        <i class="fas fa-envelope absolute end-3.5 top-3.5 text-neutral-500 text-sm"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-neutral-300 mb-1.5">Password</label>
                    <div class="relative">
                        <input type="password" id="regPassword" required autocomplete="new-password" placeholder="At least 6 characters" 
                            class="w-full bg-neutral-950/80 border border-neutral-800 rounded-xl py-3 ps-4 pe-10 text-sm focus:outline-none focus:border-neutral-400 transition-colors text-white placeholder:text-neutral-600">
                        <i class="fas fa-lock absolute end-3.5 top-3.5 text-neutral-500 text-sm"></i>
                    </div>
                </div>

                <button type="submit" id="btnRegisterSubmit" class="w-full bg-white text-neutral-950 hover:bg-neutral-200 font-black py-3 rounded-xl transition-all shadow-lg text-sm flex items-center justify-center gap-2 mt-4">
                    <span>Create Account</span>
                    <i class="fas fa-user-plus"></i>
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-6 text-center">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-neutral-800"></div></div>
                <span class="relative bg-[#121218] px-3 text-[11px] font-bold text-neutral-500 uppercase tracking-widest">Or continue with</span>
            </div>

            <!-- Social Providers -->
            <div class="grid grid-cols-3 gap-2.5">
                <button type="button" onclick="showToast('Google Sign-In integration ready')" class="bg-neutral-900/90 hover:bg-neutral-800 border border-neutral-800 hover:border-neutral-700 py-2.5 rounded-xl text-xs font-bold transition-colors flex items-center justify-center gap-1.5">
                    <i class="fab fa-google text-amber-500"></i> Google
                </button>
                <button type="button" onclick="showToast('Discord Sign-In integration ready')" class="bg-neutral-900/90 hover:bg-neutral-800 border border-neutral-800 hover:border-neutral-700 py-2.5 rounded-xl text-xs font-bold transition-colors flex items-center justify-center gap-1.5">
                    <i class="fab fa-discord text-indigo-400"></i> Discord
                </button>
                <button type="button" onclick="showToast('GitHub Sign-In integration ready')" class="bg-neutral-900/90 hover:bg-neutral-800 border border-neutral-800 hover:border-neutral-700 py-2.5 rounded-xl text-xs font-bold transition-colors flex items-center justify-center gap-1.5">
                    <i class="fab fa-github"></i> GitHub
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 w-full text-center py-6 text-xs text-neutral-600 border-t border-neutral-900/60">
        © Subtile — Subtitles Archive. All rights reserved.
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="toast fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-neutral-900 border border-neutral-700 text-white px-5 py-3 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-2 pointer-events-none">
        <i id="toastIcon" class="fas fa-check-circle text-emerald-400"></i>
        <span id="toastMsg">Notification message</span>
    </div>

    <!-- Scripts -->
    <script src="js/security.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function switchAuthTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('tabLogin').classList.toggle('active', isLogin);
            document.getElementById('tabLogin').classList.toggle('text-neutral-400', !isLogin);
            
            document.getElementById('tabRegister').classList.toggle('active', !isLogin);
            document.getElementById('tabRegister').classList.toggle('text-neutral-400', isLogin);

            document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
            document.getElementById('registerForm').classList.toggle('hidden', isLogin);
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            
            toastMsg.textContent = msg;
            toastIcon.className = isError ? 'fas fa-exclamation-circle text-rose-400' : 'fas fa-check-circle text-emerald-400';
            
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('loginIdentifier').value.trim();
            const pw = document.getElementById('loginPassword').value;
            
            const res = Auth.login(id, pw);
            if (res.success) {
                showToast(`Welcome back, ${res.user.username}!`);
                setTimeout(() => window.location.href = 'index.html', 1000);
            } else {
                showToast(res.message || 'Login failed', true);
            }
        }

        function handleRegisterSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;

            const res = Auth.register({ username, email, password });
            if (res.success) {
                showToast(`Account created successfully! Welcome, ${username}`);
                setTimeout(() => window.location.href = 'index.html', 1200);
            } else {
                showToast(res.message || 'Registration failed', true);
            }
        }
    </script>
</body>
</html>
