<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(r) {
        if (r && r.length) {
          r.forEach(function(s) { s.unregister(); });
          if ('caches' in window) caches.keys().then(function(k) { k.forEach(function(c) { caches.delete(c); }); });
          setTimeout(function() { location.reload(); }, 100);
        }
      });
    }
    </script>
    <title>Subtile — Cinema Account Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/ui-upgrade.css">
    <style>
        :root {
            --bg-main: #050507;
            --bg-card: rgba(18, 18, 24, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
            --border-hover: rgba(255, 255, 255, 0.25);
            --text-main: #ffffff;
            --text-faded: #9ca3af;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); }
        .cinema-bg {
            background-image: url('https://images.metahub.space/background/medium/tt15398776/img');
            background-size: cover; background-position: center;
            position: fixed; inset: 0; opacity: 0.2; filter: brightness(0.7);
            z-index: 0; transform: scale(1.05);
        }
        .auth-card {
            background: var(--bg-card); backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px); border: 1px solid var(--border-color);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: all 0.4s ease;
        }
        .auth-card:hover {
            border-color: rgba(255,255,255,0.12);
            box-shadow: 0 36px 80px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .tab-btn { transition: all 0.25s ease; border: 1px solid transparent; }
        .tab-btn.active { background: #ffffff; color: #050507; border-color: #ffffff; box-shadow: 0 4px 16px rgba(255, 255, 255, 0.2); }
        .tab-btn:not(.active):hover { color: #d1d5db; }
        .form-input {
            width: 100%; background: rgba(5, 5, 7, 0.8); border: 1px solid #27272a;
            border-radius: 0.75rem; padding: 0.75rem 1rem 0.75rem 2.5rem;
            font-size: 0.875rem; color: #fff; outline: none; transition: border-color 0.2s;
        }
        .form-input:focus { border-color: #52525b; }
        .form-input::placeholder { color: #52525b; }
        .input-icon { position: absolute; right: 0.875rem; top: 50%; transform: translateY(-50%); color: #52525b; font-size: 0.875rem; pointer-events: none; }
        .password-strength { display: flex; gap: 0.25rem; margin-top: 0.35rem; }
        .str-bar { flex: 1; height: 3px; background: #27272a; border-radius: 2px; transition: background 0.2s; }
        .str-bar.weak { background: #ef4444; }
        .str-bar.medium { background: #f59e0b; }
        .str-bar.strong { background: #10b981; }
        .social-btn {
            background: rgba(255,255,255,0.04); border: 1px solid #27272a;
            color: #d1d5db; padding: 0.6rem; border-radius: 0.75rem;
            font-size: 0.75rem; font-weight: 700; cursor: pointer;
            transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 0.4rem;
        }
        .social-btn:hover { border-color: #3f3f46; background: rgba(255,255,255,0.08); color: #fff; }
        .toast { transform: translateY(150%); transition: transform .35s cubic-bezier(.2,.9,.3,1.2); }
        .toast.show { transform: translateY(0); }
        .form-error { color: #ef4444; font-size: 0.75rem; margin-top: 0.25rem; display: none; }
        .form-error.show { display: block; }
        .form-input.is-invalid { border-color: #ef4444; }
        .form-input.is-valid { border-color: #10b981; }
        .field-group { position: relative; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden relative">

    <div class="cinema-bg"></div>
    <div class="fixed inset-0 bg-gradient-to-t from-neutral-950 via-neutral-950/80 to-transparent z-0 pointer-events-none"></div>

    <!-- Header -->
    <header class="relative z-10 w-full container mx-auto px-6 py-6 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-3 group">
            <div class="w-9 h-9 bg-neutral-100 rounded-lg flex items-center justify-center transition-transform group-hover:scale-105">
                <svg class="w-5 h-5 text-neutral-950" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
            </div>
            <span class="text-xl font-black tracking-tight text-neutral-100">SUBTILE</span>
        </a>
        <div class="flex items-center gap-4">
            <div id="themeToggleNav"></div>
            <button onclick="toggleLang()" style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:#9ca3af; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:0.75rem; font-weight:800;" title="Toggle Language" id="langToggleBtn">AR</button>
            <a href="index.html" class="text-sm font-semibold text-neutral-400 hover:text-white transition-colors flex items-center gap-1.5">
                <i class="fas fa-arrow-left"></i>
                <span>Back to Home</span>
            </a>
        </div>
    </header>

    <!-- Main Auth -->
    <main class="relative z-10 container mx-auto px-4 py-8 flex items-center justify-center flex-1">
        <div class="auth-card w-full max-w-md rounded-2xl p-4 sm:p-8">

            <!-- Tabs -->
            <div class="flex bg-neutral-900/90 border border-neutral-800 p-1 rounded-xl mb-8">
                        <button id="tabLogin" onclick="switchAuthTab('login')" class="tab-btn btn-ripple active flex-1 py-2.5 rounded-lg text-sm font-bold text-center">Sign In</button>
                        <button id="tabRegister" onclick="switchAuthTab('register')" class="tab-btn btn-ripple flex-1 py-2.5 rounded-lg text-sm font-bold text-neutral-400 text-center">Create Account</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-neutral-300 mb-1.5">Username or Email</label>
                    <div class="field-group">
                        <input type="text" id="loginIdentifier" required autocomplete="username" placeholder="Enter your username or email" class="form-input">
                        <i class="fas fa-user input-icon"></i>
                    </div>
                    <div class="form-error" id="loginIdentifierError"></div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-bold text-neutral-300">Password</label>
                        <a href="#" onclick="switchAuthTab('forgot'); return false;" class="text-xs text-neutral-400 hover:text-white transition-colors">Forgot password?</a>
                    </div>
                    <div class="field-group">
                        <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••" class="form-input">
                        <i class="fas fa-lock input-icon"></i>
                    </div>
                    <div class="form-error" id="loginPasswordError"></div>
                </div>
                <div class="flex items-center gap-2 py-1">
                    <input type="checkbox" id="rememberMe" class="rounded bg-neutral-900 border-neutral-700 text-white focus:ring-0 w-4 h-4">
                    <label for="rememberMe" class="text-xs text-neutral-400 cursor-pointer select-none">Remember me for 30 days</label>
                </div>
                <button type="submit" id="btnLoginSubmit" class="w-full bg-white text-neutral-950 hover:bg-neutral-200 font-black py-3 rounded-xl transition-all shadow-lg text-sm flex items-center justify-center gap-2 mt-4">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" onsubmit="handleRegisterSubmit(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-neutral-300 mb-1.5">Username</label>
                    <div class="field-group">
                        <input type="text" id="regUsername" required autocomplete="username" placeholder="Choose a username" class="form-input">
                        <i class="fas fa-user-tag input-icon"></i>
                    </div>
                    <div class="form-error" id="regUsernameError"></div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-neutral-300 mb-1.5">Email Address</label>
                    <div class="field-group">
                        <input type="email" id="regEmail" required autocomplete="email" placeholder="name@example.com" class="form-input">
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                    <div class="form-error" id="regEmailError"></div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-neutral-300 mb-1.5">Password</label>
                    <div class="field-group">
                        <input type="password" id="regPassword" required autocomplete="new-password" placeholder="At least 8 characters" class="form-input">
                        <i class="fas fa-lock input-icon"></i>
                    </div>
                    <div class="password-strength">
                        <div class="str-bar" id="str1"></div>
                        <div class="str-bar" id="str2"></div>
                        <div class="str-bar" id="str3"></div>
                        <div class="str-bar" id="str4"></div>
                    </div>
                    <div class="form-error" id="regPasswordError"></div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-neutral-300 mb-1.5">Confirm Password</label>
                    <div class="field-group">
                        <input type="password" id="regPasswordConfirm" required autocomplete="new-password" placeholder="Re-enter password" class="form-input">
                        <i class="fas fa-lock input-icon"></i>
                    </div>
                    <div class="form-error" id="regPasswordConfirmError"></div>
                </div>
                <button type="submit" id="btnRegisterSubmit" class="w-full bg-white text-neutral-950 hover:bg-neutral-200 font-black py-3 rounded-xl transition-all shadow-lg text-sm flex items-center justify-center gap-2 mt-4">
                    <span>Create Account</span>
                    <i class="fas fa-user-plus"></i>
                </button>
            </form>

            <!-- Forgot Password Form -->
            <form id="forgotForm" onsubmit="handleForgotSubmit(event)" class="space-y-4 hidden">
                <div class="text-center mb-2">
                    <i class="fas fa-envelope text-3xl text-neutral-600 mb-3 block"></i>
                    <p class="text-sm text-neutral-400">Enter your email and we'll send you a link to reset your password.</p>
                </div>
                <div>
                    <label class="block text-xs font-bold text-neutral-300 mb-1.5">Email Address</label>
                    <div class="field-group">
                        <input type="email" id="forgotEmail" required autocomplete="email" placeholder="name@example.com" class="form-input">
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                    <div class="form-error" id="forgotEmailError"></div>
                </div>
                <button type="submit" id="btnForgotSubmit" class="w-full bg-white text-neutral-950 hover:bg-neutral-200 font-black py-3 rounded-xl transition-all shadow-lg text-sm flex items-center justify-center gap-2">
                    <span>Send Reset Link</span>
                    <i class="fas fa-paper-plane"></i>
                </button>
                <p class="text-center text-xs text-neutral-500">
                    <a href="#" onclick="switchAuthTab('login'); return false;" class="text-neutral-400 hover:text-white transition-colors">← Back to Sign In</a>
                </p>
            </form>

            <!-- Divider (only on login/register) -->
            <div id="socialDivider" class="relative my-6 text-center">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-neutral-800"></div></div>
                <span class="relative bg-[#121218] px-3 text-[11px] font-bold text-neutral-500 uppercase tracking-widest">Or continue with</span>
            </div>

            <!-- Social Providers -->
            <div id="socialButtons" class="grid grid-cols-3 gap-2.5">
                <button type="button" onclick="showToast('Google Sign-In integration ready')" class="social-btn">
                    <i class="fab fa-google text-amber-500"></i> Google
                </button>
                <button type="button" onclick="showToast('Discord Sign-In integration ready')" class="social-btn">
                    <i class="fab fa-discord text-indigo-400"></i> Discord
                </button>
                <button type="button" onclick="showToast('GitHub Sign-In integration ready')" class="social-btn">
                    <i class="fab fa-github"></i> GitHub
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 w-full text-center py-6 text-xs text-neutral-600 border-t border-neutral-900/60">
        © Subtile — Subtitles Archive. All rights reserved.
    </footer>

    <!-- Toast -->
    <div id="toast" class="toast fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-neutral-900 border border-neutral-700 text-white px-5 py-3 rounded-xl shadow-2xl text-xs font-bold flex items-center gap-2 pointer-events-none">
        <i id="toastIcon" class="fas fa-check-circle text-emerald-400"></i>
        <span id="toastMsg">Notification message</span>
    </div>

    <!-- Scripts -->
    <script src="js/error-boundary.js" defer></script>
    <script src="js/security.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script>
    "use strict";

    document.addEventListener('DOMContentLoaded', () => {
        if (typeof ThemeToggle !== 'undefined') ThemeToggle.renderToggle('themeToggleNav');
        if (typeof I18n !== 'undefined') {
            I18n.translatePage();
            const langBtn = document.getElementById('langToggleBtn');
            if (langBtn) langBtn.textContent = I18n.getLang() === 'ar' ? 'EN' : 'AR';
        }

        const params = new URLSearchParams(window.location.search);
        const initialTab = params.get('tab');
        if (initialTab && ['login', 'register', 'forgot'].includes(initialTab)) {
            switchAuthTab(initialTab);
        }

        Auth.onChange((user) => {
            if (user) {
                const redirect = params.get('redirect');
                window.location.href = redirect ? decodeURIComponent(redirect) : 'index.html';
            }
        });

        wireValidation();
    });

    function toggleLang() {
        if (typeof I18n === 'undefined') return;
        const next = I18n.getLang() === 'en' ? 'ar' : 'en';
        I18n.setLang(next);
        I18n.translatePage();
        const langBtn = document.getElementById('langToggleBtn');
        if (langBtn) langBtn.textContent = next === 'ar' ? 'EN' : 'AR';
        if (typeof ThemeToggle !== 'undefined') ThemeToggle.renderToggle('themeToggleNav');
        updatePageTexts(next);
    }

    function updatePageTexts(lang) {
        const isAr = lang === 'ar';
        document.querySelector('#tabLogin').textContent = isAr ? 'تسجيل الدخول' : 'Sign In';
        document.querySelector('#tabRegister').textContent = isAr ? 'إنشاء حساب' : 'Create Account';
        document.querySelector('#btnLoginSubmit span').textContent = isAr ? 'تسجيل الدخول' : 'Sign In';
        document.querySelector('#btnRegisterSubmit span').textContent = isAr ? 'إنشاء حساب' : 'Create Account';
        document.querySelector('#btnForgotSubmit span').textContent = isAr ? 'إرسال رابط إعادة التعيين' : 'Send Reset Link';
        document.title = isAr ? 'تسجيل الدخول | Subtile' : 'Subtile — Cinema Account Access';
    }

    function switchAuthTab(tab) {
        const isLogin = tab === 'login';
        const isRegister = tab === 'register';
        const isForgot = tab === 'forgot';

        document.getElementById('tabLogin').classList.toggle('active', isLogin);
        document.getElementById('tabLogin').classList.toggle('text-neutral-400', !isLogin);
        document.getElementById('tabRegister').classList.toggle('active', isRegister);
        document.getElementById('tabRegister').classList.toggle('text-neutral-400', !isRegister);

        document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
        document.getElementById('registerForm').classList.toggle('hidden', !isRegister);
        document.getElementById('forgotForm').classList.toggle('hidden', !isForgot);

        document.getElementById('socialDivider').classList.toggle('hidden', isForgot);
        document.getElementById('socialButtons').classList.toggle('hidden', isForgot);

        clearErrors();
    }

    function clearErrors() {
        document.querySelectorAll('.form-error').forEach(el => { el.classList.remove('show'); el.textContent = ''; });
        document.querySelectorAll('.form-input').forEach(el => el.classList.remove('is-invalid', 'is-valid'));
    }

    function showFieldError(id, msg) {
        const input = document.getElementById(id);
        const err = document.getElementById(id + 'Error');
        if (input) input.classList.add('is-invalid');
        if (err) { err.textContent = msg; err.classList.add('show'); }
    }

    function markValid(id) {
        const input = document.getElementById(id);
        const err = document.getElementById(id + 'Error');
        if (input) { input.classList.remove('is-invalid'); input.classList.add('is-valid'); }
        if (err) { err.textContent = ''; err.classList.remove('show'); }
    }

    function wireValidation() {
        const regUser = document.getElementById('regUsername');
        const regEmail = document.getElementById('regEmail');
        const regPass = document.getElementById('regPassword');

        if (regUser) regUser.addEventListener('input', () => {
            const v = regUser.value.trim();
            if (!v) return;
            Security.isValidUsername(v) ? markValid('regUsername') : showFieldError('regUsername', '3-20 characters, start with a letter.');
        });
        if (regEmail) regEmail.addEventListener('input', () => {
            const v = regEmail.value.trim();
            if (!v) return;
            Security.isValidEmail(v) ? markValid('regEmail') : showFieldError('regEmail', 'Invalid email format.');
        });
        if (regPass) regPass.addEventListener('input', () => {
            const s = Security.passwordStrength(regPass.value);
            updateStrengthBars(s);
            if (!regPass.value) return;
            s >= 2 ? markValid('regPassword') : showFieldError('regPassword', 'Use 8+ characters with numbers and letters.');
        });
    }

    function updateStrengthBars(score) {
        const cls = ['weak', 'weak', 'medium', 'strong', 'strong'];
        for (let i = 1; i <= 4; i++) {
            const bar = document.getElementById('str' + i);
            if (bar) { bar.className = 'str-bar'; if (i <= score) bar.classList.add(cls[score]); }
        }
    }

    async function handleLoginSubmit(e) {
        e.preventDefault();
        const id = document.getElementById('loginIdentifier').value.trim();
        const pw = document.getElementById('loginPassword').value;
        const btn = document.getElementById('btnLoginSubmit');
        clearErrors();

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

        try {
            await Auth.login({ identifier: id, password: pw });
            showToast('Welcome back!');
            const remember = document.getElementById('rememberMe').checked;
            if (remember) localStorage.setItem('subtile_remember', 'true');
        } catch (err) {
            if (err.message && /اسم المستخدم|البريد|المستخدم|Login|invalid|not found/i.test(err.message)) {
                showFieldError('loginIdentifier', err.message);
            } else if (err.message && /كلمة المرور|password|Wrong|incorrect/i.test(err.message)) {
                showFieldError('loginPassword', err.message);
            } else {
                showFieldError('loginPassword', err.message || 'Login failed');
            }
            btn.disabled = false;
            btn.innerHTML = '<span>Sign In</span><i class="fas fa-arrow-right"></i>';
        }
    }

    async function handleRegisterSubmit(e) {
        e.preventDefault();
        const username = document.getElementById('regUsername').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regPasswordConfirm').value;
        const btn = document.getElementById('btnRegisterSubmit');
        clearErrors();

        if (password !== confirm) {
            showFieldError('regPasswordConfirm', 'Passwords do not match.');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

        try {
            await Auth.register({ username, email, password });
            showToast('Account created! Welcome, ' + username);
        } catch (err) {
            const msg = err.message || '';
            if (/اسم المستخدم|username/i.test(msg)) showFieldError('regUsername', msg);
            else if (/البريد|email/i.test(msg)) showFieldError('regEmail', msg);
            else if (/كلمة المرور|password/i.test(msg)) showFieldError('regPassword', msg);
            else showToast(msg, true);
            btn.disabled = false;
            btn.innerHTML = '<span>Create Account</span><i class="fas fa-user-plus"></i>';
        }
    }

    async function handleForgotSubmit(e) {
        e.preventDefault();
        const email = document.getElementById('forgotEmail').value.trim();
        const btn = document.getElementById('btnForgotSubmit');
        clearErrors();

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

        try {
            await Auth.requestPasswordReset({ email });
            showToast('If the email exists, a reset link has been sent.');
            setTimeout(() => switchAuthTab('login'), 2000);
        } catch (err) {
            if (err.message && /البريد|email/i.test(err.message)) showFieldError('forgotEmail', err.message);
            else showToast(err.message || 'Failed to send reset link', true);
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<span>Send Reset Link</span><i class="fas fa-paper-plane"></i>';
        }
    }

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        const toastIcon = document.getElementById('toastIcon');
        toastMsg.textContent = msg;
        toastIcon.className = isError ? 'fas fa-exclamation-circle text-rose-400' : 'fas fa-check-circle text-emerald-400';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3500);
    }
    </script>
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(registrations => {
        for (const r of registrations) r.unregister();
    });
}
</script>
</body>
</html>
