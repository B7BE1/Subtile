    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #050507;
            --bg-glass: rgba(15, 15, 18, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.25);
            --text-main: #ffffff;
            --text-faded: #8a8a92;
            --transition-cine: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body { font-family: 'Tajawal', 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); }
        [dir="ltr"] body { font-family: 'Inter', 'Tajawal', sans-serif; }
        
        .nav-blur {
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            background: var(--bg-glass);
            border-bottom: 1px solid var(--border-color);
        }

        .banner-bg {
            background-size: cover;
            background-position: center top;
            position: absolute; inset: 0; z-index: 0;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
            opacity: 0.55;
            transition: background-image 0.5s ease;
        }

        .poster-container { position: relative; padding-bottom: 150%; }
        .poster-img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
            border-radius: 1rem; background: #121216; border: 1px solid var(--border-color);
            transition: var(--transition-cine);
        }
        .poster-fallback {
            position: absolute; inset: 0; border-radius: 1rem; background: #121216;
            display: none; align-items: center; justify-content: center; text-align: center;
            color: #525252; font-weight: 700; padding: 1rem; border: 1px solid var(--border-color);
        }

        /* Hollow Transparent Stroke Rank Numbers */
        .rank-number {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 6.5rem;
            line-height: 0.8;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.45);
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95);
            position: absolute;
            bottom: -12px;
            z-index: 25;
            pointer-events: none;
            user-select: none;
            transition: -webkit-text-stroke 0.3s ease, transform 0.3s ease;
        }
        .movie-card:hover .rank-number {
            -webkit-text-stroke: 2.5px rgba(255, 255, 255, 0.95);
            transform: scale(1.04);
        }
        [dir="rtl"] .rank-number { right: -10px; }
        [dir="ltr"] .rank-number { left: -10px; }

        .movie-card { position: relative; z-index: 1; transition: var(--transition-cine); }
        .movie-card:hover { transform: translateY(-6px); }
        .movie-card:hover .poster-img { filter: brightness(0.35); border-color: var(--border-hover); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .movie-card:hover .overlay-content { opacity: 1; }
        .overlay-content { opacity: 0; transition: opacity 0.3s ease; z-index: 30; }

        .reveal { opacity: 0; transform: translateY(20px); transition: opacity .5s ease, transform .5s ease; }
        .reveal.visible { opacity: 1; transform: none; }

        .filter-btn.active {
            background: #ffffff;
            color: #050507;
            border-color: #ffffff;
            box-shadow: 0 4px 16px rgba(255, 255, 255, 0.2);
        }

        .btn-pill {
            padding: 0.75rem 1.6rem; border-radius: 50px; font-weight: 700; cursor: pointer;
            transition: var(--transition-cine); text-decoration: none; display: inline-flex;
            align-items: center; gap: 0.6rem;
        }
        .btn-primary { background: #ffffff; color: #050507; }
        .btn-primary:hover { background: rgba(255,255,255,0.9); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,255,255,0.25); }
        .btn-secondary { background: rgba(255,255,255,0.05); color: #ffffff; border: 1px solid var(--border-color); }
        .btn-secondary:hover { border-color: var(--border-hover); background: rgba(255,255,255,0.12); transform: translateY(-2px); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050507; }
        ::-webkit-scrollbar-thumb { background: #222228; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3a44; }
    </style>
</head>

};

/* ---------------- State ---------------- */
let lang = localStorage.getItem("subtle-lang") || "ar";
let activeFilter = "all";
let searchQuery = "";

const t = key => I18N[lang][key];
const $ = id => document.getElementById(id);

/* ---------------- Render: i18n ---------------- */
function applyI18n() {
    document.documentElement.lang = lang;
    document.documentElement.dir = I18N[lang].dir;
    document.title = t("title");
    $("langToggle").textContent = t("toggle");
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
    updateAuthNav();
    renderFeatured();
    renderGrid();
}

function updateAuthNav() {
    const user = (typeof Auth !== 'undefined') ? Auth.getCurrentUser() : null;
    const btn = $("navAuthBtn");
    const txt = $("navAuthText");
    if (!btn || !txt) return;

    if (user && user.username) {
        txt.textContent = user.username;
        btn.href = "#";
        btn.onclick = (e) => {
            e.preventDefault();
            if (confirm(lang === 'ar' ? 'هل تريد تسجيل الخروج؟' : 'Do you want to log out?')) {
                Auth.logout();
                updateAuthNav();
            }
        };
    } else {
        txt.textContent = t("loginBtn");
        btn.href = "login.html";
        btn.onclick = null;
    }
}

/* ---------------- Render: Featured (Links to movie.html directly) ---------------- */
function renderFeatured() {
    const f = TITLES.find(x => x.featured);
    $("bannerBg").style.backgroundImage = `url('${f.backdrop}')`;
    $("featuredTitle").textContent = f.title;
    $("featuredDesc").textContent = f.desc[lang];
    $("featuredMeta").innerHTML =
        `<span>${f.year}</span><span class="w-1.5 h-1.5 bg-neutral-600 rounded-full"></span>` +
        `<span>${f.genre[lang]}</span><span class="w-1.5 h-1.5 bg-neutral-600 rounded-full"></span>` +
        `<span>${f.dl} ${t("downloads")}</span>`;
    const img = $("featuredPoster"), fb = $("featuredFallback");
    img.alt = f.title; img.style.display = "";
    img.onerror = () => { img.style.display = "none"; fb.style.display = "flex"; fb.textContent = f.title; };
    img.src = f.poster;
    
    const movieUrl = `movie.html?id=${f.id}&type=${f.type}`;
    $("featuredDownload").href = movieUrl;
    $("featuredInfo").href = movieUrl;
}

/* ---------------- Render: Grid (Direct Link to movie.html with Hollow Numbers) ---------------- */
function cardHTML(item, rank) {
    const movieUrl = `movie.html?id=${item.id}&type=${item.type}`;

    return `
    <a href="${movieUrl}" class="movie-card cursor-pointer group reveal block" data-id="${item.id}" aria-label="${item.title}">
        <div class="relative">
            <div class="poster-container">
                <img src="${item.poster}" alt="${item.title}" loading="lazy" class="poster-img shadow-2xl shadow-black/80"
                     onerror="this.style.display='none';this.nextElementSibling.style.display='flex';this.nextElementSibling.textContent='${item.title.replace(/'/g, "\\'")}'">
                <div class="poster-fallback"></div>
                <span class="rank-number">${rank}</span>
                <div class="overlay-content absolute inset-0 flex flex-col justify-end p-4 z-30">
                    <div class="w-full bg-white text-neutral-950 font-bold py-2.5 rounded-xl flex items-center justify-center gap-2 transition-transform group-hover:scale-105 shadow-xl">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        ${t("download")}
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-4">
            <div class="flex items-center gap-2 mb-1">
                <span class="bg-neutral-900 border border-neutral-800 text-neutral-300 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">${t("langName")[item.lang] || item.lang}</span>
                <span class="text-neutral-500 text-xs">${item.year}</span>
            </div>
            <h3 class="text-base font-bold text-neutral-100 truncate">${item.title}</h3>
            <p class="text-neutral-500 text-sm mt-0.5">${item.dl} ${t("downloads")}</p>
        </div>
    </a>`;
}

function renderGrid() {
    const q = searchQuery.trim().toLowerCase();
    const list = TITLES.filter(x => !x.featured)
        .filter(x => activeFilter === "all" || x.type === activeFilter)
        .filter(x => !q || x.title.toLowerCase().includes(q));

    $("grid").innerHTML = list.map((item, i) => cardHTML(item, i + 2)).join("");
    $("emptyState").classList.toggle("hidden", list.length > 0);
    observeReveals();
}

/* ---------------- Reveal on scroll ---------------- */
const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); } });
}, { threshold: 0.1 });
function observeReveals() { document.querySelectorAll(".reveal:not(.visible)").forEach(el => io.observe(el)); }

/* ---------------- Events ---------------- */
$("searchInput").addEventListener("input", e => { searchQuery = e.target.value; renderGrid(); });

$("searchInput").addEventListener("keydown", e => {
    if (e.key === "Enter" && searchQuery.trim()) {
        window.location.href = `browse.html?q=${encodeURIComponent(searchQuery.trim())}`;
    }
});

document.querySelectorAll(".filter-btn").forEach(btn => btn.addEventListener("click", () => {
    activeFilter = btn.dataset.filter;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b === btn));
    renderGrid();
}));

$("langToggle").addEventListener("click", () => {
    lang = lang === "ar" ? "en" : "ar";
    localStorage.setItem("subtle-lang", lang);
    applyI18n();
});

const toTop = $("toTop");
window.addEventListener("scroll", () => {
    const show = window.scrollY > 600;
    toTop.classList.toggle("hidden", !show);
    toTop.classList.toggle("flex", show);
}, { passive: true });
toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

/* ---------------- Init ---------------- */
$("year").textContent = new Date().getFullYear();
applyI18n();
</script>
</body>
</html>
