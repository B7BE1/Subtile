<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Top Header -->
  <header class="subdl-header">
    <a href="index.html" class="subdl-logo">
      <span class="logo-badge">SUBTILE</span>
    </a>

    <ul class="subdl-nav">
      <li><a href="index.html" class="subdl-nav-link active">Latest</a></li>
      <li><a href="#" class="subdl-nav-link">Trends</a></li>
      <li><a href="#" class="subdl-nav-link">Leaderboard</a></li>
      <li><a href="#" class="subdl-nav-link">Community</a></li>
    </ul>

    <div class="subdl-header-actions">
      <div id="navAuthSlot">
        <button class="btn-auth-subdl" onclick="openAuthModal('login')">
          <i class="fas fa-sign-in-alt"></i> Login / Sign Up
        </button>
      </div>
      <button class="btn-icon-subdl" onclick="openUploadModal()" title="Upload Subtitle">
        <i class="fas fa-upload"></i>
      </button>
      <button class="btn-icon-subdl" title="Settings">
        <i class="fas fa-cog"></i>
      </button>
    </div>
  </header>

  <!-- Clean Canvas Container (Ready to build piece by piece) -->
  <main class="subdl-container" id="mainContent">
    <!-- Blank clean area ready for your input -->
  </main>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- SubDL Bottom Navigation -->
  <footer class="subdl-footer">
    <ul class="subdl-footer-links">
      <li><a href="#">Filter Languages</a></li>
      <li><a href="#">Advertise</a></li>
      <li><a href="#">Search and Download API</a></li>
      <li><a href="#">DMCA</a></li>
      <li><a href="#">Terms</a></li>
    </ul>
    <div style="color: var(--text-muted);">
      &copy; 2026 Subtile
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/security.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-ui.js"></script>
</body>
</html>
