<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subtile - Trending Now</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; }
        .nav-blur { backdrop-filter: blur(16px); background: rgba(10, 10, 10, 0.85); }
        
        /* Banner Background with Fade-out effect */
        .banner-bg {
            background-size: cover;
            background-position: center top;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 100%);
            opacity: 0.6;
        }
        
        /* Perfect Poster Aspect Ratio */
        .poster-container { position: relative; padding-bottom: 150%; /* 2:3 Aspect Ratio */ }
        .poster-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
        
        /* Rank Number Styling - Directly Overlaying on the Poster */
        .rank-number {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 5.5rem;
            line-height: 0.8;
            color: #ffffff;
            -webkit-text-stroke: 3px #0a0a0a;
            text-shadow: 0 6px 20px rgba(0, 0, 0, 0.95), 0 2px 8px rgba(0, 0, 0, 0.8);
            position: absolute;
            left: -8px;
            bottom: -10px;
            z-index: 25;
            pointer-events: none;
            user-select: none;
        }
        
        /* Card Hover Effects */
        .movie-card { position: relative; z-index: 1; transition: transform 0.3s ease; }
        .movie-card:hover { transform: translateY(-5px); }
        .movie-card:hover .poster-img { filter: brightness(0.35); }
        .movie-card:hover .overlay-content { opacity: 1; }
        .overlay-content { opacity: 0; transition: opacity 0.3s ease; z-index: 30; }

        /* Search Dropdown */
        .search-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: rgba(18, 18, 18, 0.96);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            max-height: 380px;
            overflow-y: auto;
            display: none;
            z-index: 100;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
        }
        .search-dropdown.active { display: block; }
        .search-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover { background: rgba(255, 255, 255, 0.08); }
        .search-item img {
            width: 36px;
            height: 52px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
        }
    </style>
</head>
<body class="bg-neutral-950 text-white overflow-x-hidden">

    <!-- Navbar -->
    <header class="fixed top-0 w-full z-50 nav-blur border-b border-neutral-800/50">
        <div class="container mx-auto px-8 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-8 h-8 bg-neutral-100 rounded-md flex items-center justify-center">
                    <svg class="w-5 h-5 text-neutral-950" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
                </div>
                <span class="text-lg font-bold tracking-tight text-neutral-300 hidden sm:block">SUBTILE</span>
            </a>
            
            <div class="flex-1 max-w-xl mx-8 relative">
                <div class="relative">
                    <input type="text" id="mainSearchInput" placeholder="Search movies, TV shows, anime..." autocomplete="off" class="w-full bg-neutral-900 border border-neutral-800 rounded-lg py-2.5 pl-4 pr-10 text-sm focus:outline-none focus:border-neutral-500 transition-colors text-neutral-200 placeholder:text-neutral-600">
                    <svg class="absolute right-4 top-3 w-5 h-5 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <div id="mainSearchDropdown" class="search-dropdown"></div>
            </div>

            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-neutral-400">
                <a href="index.html" class="text-white border-b border-neutral-100 pb-1">Trending</a>
                <a href="browse.html#discover" class="hover:text-neutral-200 transition-colors">Discover</a>
                <a href="browse.html#latest" class="hover:text-neutral-200 transition-colors">Latest</a>
                <a href="browse.html#community" class="hover:text-neutral-200 transition-colors">Community</a>
            </nav>
        </div>
    </header>

    <!-- Featured Banner -->
    <section id="homeHeroBanner" class="relative w-full min-h-[85vh] flex items-center pt-24 pb-12">
        <div class="banner-bg" style="background-image: url('https://images.metahub.space/background/medium/tt15239678/img');"></div>
        
        <div class="relative z-10 container mx-auto px-8 flex flex-col md:flex-row items-center gap-12">
            <div class="hidden md:block w-64 flex-shrink-0">
                <div class="poster-container animate-pulse bg-neutral-900 rounded-xl" style="height: 384px;"></div>
            </div>

            <div class="max-w-2xl mt-8 md:mt-0 w-full animate-pulse">
                <div class="h-16 bg-neutral-900 rounded-lg w-32 mb-4"></div>
                <div class="h-24 bg-neutral-900 rounded-lg w-full mb-6"></div>
                <div class="h-4 bg-neutral-900 rounded-lg w-1/2 mb-8"></div>
            </div>
        </div>
    </section>

    <!-- Trending Grid -->
    <main class="container mx-auto px-8 pt-16 pb-20 relative z-20">
        
        <div class="mb-16 flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
            <div>
                <p class="text-neutral-500 font-medium mb-3 tracking-[0.2em] text-xs">TOP CHARTS</p>
                <h2 class="text-4xl md:text-5xl font-black text-neutral-50 tracking-tight">Trending Now</h2>
            </div>
            
            <div class="flex gap-2 flex-wrap" id="homeFilterPills">
                <button onclick="filterHomeTrending('all', this)" class="home-tab active px-4 py-2 rounded-lg bg-neutral-100 text-neutral-900 text-sm font-semibold transition-colors">All</button>
                <button onclick="filterHomeTrending('movie', this)" class="home-tab px-4 py-2 rounded-lg bg-neutral-900 border border-neutral-800 text-neutral-400 text-sm font-medium hover:bg-neutral-800 hover:text-neutral-100 transition-colors">Movies</button>
                <button onclick="filterHomeTrending('tv', this)" class="home-tab px-4 py-2 rounded-lg bg-neutral-900 border border-neutral-800 text-neutral-400 text-sm font-medium hover:bg-neutral-800 hover:text-neutral-100 transition-colors">TV Shows</button>
                <button onclick="filterHomeTrending('anime', this)" class="home-tab px-4 py-2 rounded-lg bg-neutral-900 border border-neutral-800 text-neutral-400 text-sm font-medium hover:bg-neutral-800 hover:text-neutral-100 transition-colors">Anime</button>
            </div>
        </div>

        <!-- Movies Grid (Top 10 Currently Trending) -->
        <div id="homeTrendingGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-x-8 gap-y-16">
            <div style="grid-column: 1 / -1; padding: 4rem; text-align: center; color: var(--text-muted);">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 1rem;"></i>
                <div>Loading trending titles...</div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-neutral-900 mt-20 relative z-30 bg-neutral-950">
        <div class="container mx-auto px-8 py-10 flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-neutral-600 text-sm">© 2024 Subtile Archive. Designed for cinephiles.</p>
            <div class="flex gap-8 text-sm text-neutral-500">
                <a href="#" class="hover:text-neutral-300 transition-colors">Contact</a>
                <a href="#" class="hover:text-neutral-300 transition-colors">Privacy Policy</a>
                <a href="#" class="hover:text-neutral-300 transition-colors">DMCA</a>
            </div>
        </div>
    </footer>

    <!-- Live Search Script -->
    <script>
      let searchTimer = null;
      const searchInput = document.getElementById('mainSearchInput');
      const searchDropdown = document.getElementById('mainSearchDropdown');

      if (searchInput && searchDropdown) {
        searchInput.addEventListener('input', (e) => {
          const q = e.target.value.trim();
          if (!q) {
            searchDropdown.classList.remove('active');
            return;
          }

          clearTimeout(searchTimer);
          searchTimer = setTimeout(async () => {
            try {
              const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
              if (res.ok) {
                const data = await res.json();
                renderDropdownResults(data.results || []);
              }
            } catch (err) {
              console.error('Search error:', err);
            }
          }, 200);
        });

        searchInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && searchInput.value.trim()) {
            window.location.href = `browse.html?q=${encodeURIComponent(searchInput.value.trim())}`;
          }
        });

        document.addEventListener('click', (e) => {
          if (!e.target.closest('#mainSearchInput') && !e.target.closest('#mainSearchDropdown')) {
            searchDropdown.classList.remove('active');
          }
        });
      }

      function renderDropdownResults(items) {
        if (!items || items.length === 0) {
          searchDropdown.innerHTML = '<div style="padding: 1rem; text-align: center; color: #737373; font-size: 0.85rem;">No results found</div>';
          searchDropdown.classList.add('active');
          return;
        }

        searchDropdown.innerHTML = items.slice(0, 8).map(m => {
          const typeLabel = m.type === 'anime' ? 'Anime' : (m.type === 'tv' ? 'TV Series' : 'Movie');
          const targetUrl = `movie.html?id=${encodeURIComponent(m.id || m.imdb_id)}&type=${m.type || 'movie'}`;

          return `
            <div class="search-item" onclick="window.location.href='${targetUrl}'">
              <img src="${m.poster || 'https://images.metahub.space/poster/small/tt15239678/img'}" alt="${m.title}" onerror="this.onerror=null; this.src='https://images.metahub.space/poster/small/tt15239678/img';">
              <div style="flex: 1; min-width: 0;">
                <div style="font-weight: 600; font-size: 0.88rem; color: #f5f5f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${m.title}</div>
                <div style="font-size: 0.75rem; color: #737373; display: flex; gap: 8px; margin-top: 2px;">
                  <span style="color: #60a5fa;">${typeLabel}</span>
                  <span>${m.year || m.releaseInfo || ''}</span>
                  ${m.rating ? `<span style="color: #fbbf24;"><i class="fas fa-star" style="font-size:0.7rem;"></i> ${m.rating}</span>` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('');

        searchDropdown.classList.add('active');
      }

      // Home Page Trending Logic
      async function filterHomeTrending(type, btn) {
        // Update active tab styles
        document.querySelectorAll('#homeFilterPills .home-tab').forEach(b => {
          b.className = "home-tab px-4 py-2 rounded-lg bg-neutral-900 border border-neutral-800 text-neutral-400 text-sm font-medium hover:bg-neutral-800 hover:text-neutral-100 transition-colors";
        });
        if (btn) {
          btn.className = "home-tab active px-4 py-2 rounded-lg bg-neutral-100 text-neutral-900 text-sm font-semibold transition-colors";
        }

        const grid = document.getElementById('homeTrendingGrid');
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; padding: 4rem; text-align: center; color: var(--text-muted);">
            <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 1rem;"></i>
            <div>Loading trending titles...</div>
          </div>
        `;

        try {
          const promises = [];

          if (type === 'all' || type === 'tv') {
            promises.push(
              fetch(`https://v3-cinemeta.strem.io/catalog/series/top.json`)
                .then(r => r.ok ? r.json() : { metas: [] })
                .then(d => (d.metas || []).slice(0, 11).map(m => ({
                  id: m.imdb_id || m.id, title: m.name, type: 'tv', 
                  year: (m.releaseInfo || m.year || '').toString().split(/[-–]/)[0].trim() || null,
                  poster: m.poster || `https://images.metahub.space/poster/small/${m.id}/img`,
                  backdrop: m.background || `https://images.metahub.space/background/medium/${m.id}/img`,
                  description: m.description || '',
                  genres: m.genres || ['TV Series']
                })))
                .catch(() => [])
            );
          }

          if (type === 'all' || type === 'movie') {
            promises.push(
              fetch(`https://v3-cinemeta.strem.io/catalog/movie/top.json`)
                .then(r => r.ok ? r.json() : { metas: [] })
                .then(d => (d.metas || []).slice(0, 11).map(m => ({
                  id: m.imdb_id || m.id, title: m.name, type: 'movie',
                  year: (m.releaseInfo || m.year || '').toString().split(/[-–]/)[0].trim() || null,
                  poster: m.poster || `https://images.metahub.space/poster/small/${m.id}/img`,
                  backdrop: m.background || `https://images.metahub.space/background/medium/${m.id}/img`,
                  description: m.description || '',
                  genres: m.genres || ['Movie']
                })))
                .catch(() => [])
            );
          }

          if (type === 'all' || type === 'anime') {
            promises.push(
              fetch(`https://api.jikan.moe/v4/top/anime?limit=11`)
                .then(r => r.ok ? r.json() : { data: [] })
                .then(d => (d.data || []).map(a => {
                  const posterUrl = (a.images && a.images.webp && a.images.webp.large_image_url) || '';
                  const bgUrl = (a.trailer && a.trailer.images && (a.trailer.images.maximum_image_url || a.trailer.images.large_image_url)) || posterUrl;
                  return {
                    id: `anime-${a.mal_id}`, title: a.title_english || a.title, type: 'anime',
                    year: a.year || (a.aired && a.aired.prop && a.aired.prop.from ? a.aired.prop.from.year : null),
                    poster: posterUrl,
                    backdrop: bgUrl,
                    description: (a.synopsis || '').split('[')[0],
                    genres: (a.genres || []).map(g => g.name)
                  };
                }))
                .catch(() => [])
            );
          }

          const settled = await Promise.all(promises);
          let results = settled.flat();
          
          results.sort(() => Math.random() - 0.5);
          results = results.slice(0, 11); // need 1 for hero + 10 for grid

          if (results.length === 0) {
            grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center;">No trending data available.</div>';
            return;
          }

          // 1. Render Hero Banner (index 0)
          const hero = results[0];
          const heroSection = document.getElementById('homeHeroBanner');
          const heroUrl = `movie.html?id=${encodeURIComponent(hero.id)}&type=${hero.type}`;
          const heroTypeLabel = hero.type === 'anime' ? 'Anime' : (hero.type === 'tv' ? 'TV Series' : 'Movie');
          
          heroSection.innerHTML = `
            <div class="banner-bg" style="background-image: url('${hero.backdrop || hero.poster}'); filter: brightness(0.4);"></div>
            <div class="relative z-10 container mx-auto px-8 flex flex-col md:flex-row items-center gap-12">
                <div class="hidden md:block w-64 flex-shrink-0">
                    <div class="poster-container">
                        <img src="${hero.poster}" alt="${hero.title}" class="poster-img shadow-2xl shadow-black/80 border border-neutral-800" onerror="this.onerror=null; this.src='https://images.metahub.space/poster/small/tt15239678/img';">
                    </div>
                </div>

                <div class="max-w-2xl mt-8 md:mt-0">
                    <div class="flex items-center gap-4 mb-4">
                        <span class="text-neutral-100 font-black text-7xl md:text-8xl tracking-terse">01</span>
                        <div class="border-l border-neutral-700 pl-4">
                            <p class="text-neutral-400 text-sm font-medium tracking-widest">CURRENT #1</p>
                            <p class="text-neutral-500 text-sm">Trending Worldwide</p>
                        </div>
                    </div>
                    
                    <h1 class="text-5xl md:text-7xl font-black text-neutral-50 mb-3 tracking-tight leading-none" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${hero.title}</h1>
                    <div class="flex items-center gap-4 mb-6 text-neutral-400 text-sm font-medium">
                        <span>${hero.year || ''}</span>
                        <span class="w-1 h-1 bg-neutral-600 rounded-full"></span>
                        <span>${hero.genres && hero.genres.length > 0 ? hero.genres[0] : heroTypeLabel}</span>
                        <span class="w-1 h-1 bg-neutral-600 rounded-full"></span>
                        <span>${(Math.random() * 5 + 1).toFixed(1)}M Downloads</span>
                    </div>
                    
                    <p class="text-neutral-300 text-lg leading-relaxed mb-8 max-w-xl" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
                        ${hero.description || 'Experience the epic trending title with perfectly synced and verified Arabic subtitles. Download directly below.'}
                    </p>

                    <div class="flex items-center gap-4">
                        <a href="${heroUrl}" class="bg-neutral-100 hover:bg-white text-neutral-900 font-bold py-3 px-8 rounded-lg flex items-center gap-2 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Download Subtitles
                        </a>
                        <a href="${heroUrl}" class="border border-neutral-600 hover:border-neutral-300 hover:text-neutral-100 text-neutral-300 font-bold py-3 px-8 rounded-lg transition-colors">
                            More Info
                        </a>
                    </div>
                </div>
            </div>
          `;

          // 2. Render Grid (index 1 to 10)
          const gridItems = results.slice(1, 11);
          grid.innerHTML = gridItems.map((m, index) => {
            const typeLabel = m.type === 'anime' ? 'Anime' : (m.type === 'tv' ? 'TV Series' : 'Movie');
            const targetUrl = `movie.html?id=${encodeURIComponent(m.id)}&type=${m.type}`;
            const fakeDl = (Math.random() * 5 + 1).toFixed(1) + 'M Downloads';
            
            return `
              <a href="${targetUrl}" class="movie-card cursor-pointer group block">
                  <div class="relative">
                      <div class="poster-container">
                          <img src="${m.poster}" alt="${m.title}" class="poster-img shadow-2xl shadow-black/60" onerror="this.onerror=null; this.src='https://images.metahub.space/poster/small/tt15239678/img';">
                          <span class="rank-number">${index + 2}</span>
                          <div class="overlay-content absolute inset-0 flex flex-col justify-end p-4 z-30">
                              <button class="w-full bg-neutral-100 hover:bg-white text-neutral-900 font-bold py-2 rounded-lg flex items-center justify-center gap-2 transition-colors">
                                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                  Download
                              </button>
                          </div>
                      </div>
                  </div>
                  <div class="mt-4">
                      <div class="flex items-center gap-2 mb-1">
                          <span class="bg-neutral-800 text-neutral-300 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">${typeLabel}</span>
                          <span class="text-neutral-600 text-xs">${m.year || ''}</span>
                      </div>
                      <h3 class="text-base font-bold text-neutral-100 truncate">${m.title}</h3>
                      <p class="text-neutral-500 text-sm mt-0.5">${fakeDl}</p>
                  </div>
              </a>
            `;
          }).join('');

        } catch (err) {
          console.error(err);
          grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #ef4444;">Failed to load trending data.</div>';
        }
      }

      // Initial load
      window.addEventListener('load', () => {
        filterHomeTrending('all', document.querySelector('#homeFilterPills .home-tab'));
      });
    </script>
</body>
</html>
