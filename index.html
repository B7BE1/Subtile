<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', 'Inter', sans-serif; background-color: #0a0a0a; }
        [dir="ltr"] body { font-family: 'Inter', 'Tajawal', sans-serif; }
        .nav-blur { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); background: rgba(10, 10, 10, 0.85); }

        .banner-bg {
            background-size: cover;
            background-position: center top;
            position: absolute; inset: 0; z-index: 0;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 100%);
            opacity: 0.6;
        }

        .poster-container { position: relative; padding-bottom: 150%; }
        .poster-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 12px; background: #171717; }
        .poster-fallback {
            position: absolute; inset: 0; border-radius: 12px; background: #171717;
            display: none; align-items: center; justify-content: center; text-align: center;
            color: #525252; font-weight: 700; padding: 1rem; border: 1px solid #262626;
        }

        /* Hollow Transparent Stroke Rank Numbers */
        .rank-number {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 6.5rem;
            line-height: 0.8;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.45);
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.9);
            position: absolute;
            bottom: -14px;
            z-index: 25;
            pointer-events: none;
            user-select: none;
            transition: -webkit-text-stroke 0.3s ease, transform 0.3s ease;
        }
        .movie-card:hover .rank-number {
            -webkit-text-stroke: 2.5px rgba(255, 255, 255, 0.9);
            transform: scale(1.03);
        }
        [dir="rtl"] .rank-number { right: -10px; }
        [dir="ltr"] .rank-number { left: -10px; }

        .movie-card { position: relative; z-index: 1; transition: transform 0.3s ease; }
        .movie-card:hover { transform: translateY(-5px); }
        .movie-card:hover .poster-img { filter: brightness(0.3); }
        .movie-card:hover .overlay-content { opacity: 1; }
        .overlay-content { opacity: 0; transition: opacity 0.3s ease; z-index: 30; }
        .movie-card:focus-visible { outline: 2px solid #a3a3a3; outline-offset: 4px; border-radius: 12px; }
        .movie-card:focus-visible .overlay-content { opacity: 1; }

        .reveal { opacity: 0; transform: translateY(24px); transition: opacity .6s ease, transform .6s ease; }
        .reveal.visible { opacity: 1; transform: none; }

        .filter-btn.active { background: #f5f5f5; color: #171717; border-color: #f5f5f5; }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: #404040; }

        @media (prefers-reduced-motion: reduce) {
            .reveal, .movie-card, .overlay-content { transition: none !important; }
        }
    </style>
</head>

    { id: "breaking-bad",        title: "Breaking Bad",        year: 2008, genre: { ar: "جريمة / دراما", en: "Crime / Drama" }, type: "tv", lang: "Arabic", dl: "1.35M", poster: "https://images.metahub.space/poster/small/tt0903747/img" },

    { id: "parasite",            title: "Parasite",            year: 2019, genre: { ar: "إثارة / دراما", en: "Thriller / Drama" }, type: "movie", lang: "Arabic", dl: "1.1M", poster: "https://images.metahub.space/poster/small/tt6751668/img" },
    { id: "solo-leveling",   title: "Solo Leveling",   year: 2024, genre: { ar: "أنمي / مغامرة", en: "Anime / Action" },     type: "anime", lang: "Arabic", dl: "1.6M", poster: "https://cdn.myanimelist.net/images/anime/1801/142390l.jpg" },
    { id: "jujutsu-kaisen",      title: "Jujutsu Kaisen",      year: 2020, genre: { ar: "أنمي / فانتازيا", en: "Anime / Fantasy" }, type: "anime", lang: "Arabic", dl: "920K", poster: "https://cdn.myanimelist.net/images/anime/1171/109222l.jpg" },
    { id: "house-of-the-dragon",            title: "House of the Dragon",            year: 2024, genre: { ar: "دراما / فانتازيا", en: "Drama / Fantasy" }, type: "tv", lang: "Arabic", dl: "2.1M", poster: "https://images.metahub.space/poster/small/tt11198330/img" },

/* ---------------- i18n ---------------- */
const I18N = {
    ar: {
        brand: "سبتايل", searchPh: "ابحث عن فيلم، مسلسل، أنمي...",
        navTrending: "الرائج", navLatest: "الأحدث", navUpload: "الاستكشاف",
        loginBtn: "دخول", logoutBtn: "خروج",
        current1: "المرتبة الأولى حالياً", trendingToday: "الرائج اليوم",
        downloadSubs: "تحميل الترجمة", moreInfo: "معلومات أكثر",
        topCharts: "أعلى القوائم", trendingNow: "الرائج الآن",
        fAll: "الكل", fMovies: "أفلام", fTv: "مسلسلات", fAnime: "أنمي",
        noResults: "لا توجد نتائج", noResultsHint: "جرّب كلمة بحث مختلفة أو غيّر التصنيف",
        footerText: "© سبتايل — أرشيف الترجمات. صُمم لعشاق السينما.",
        contact: "تواصل", privacy: "الخصوصية", DMCA: "DMCA",
        downloads: "تحميل", download: "تحميل",
        langName: { Arabic: "العربية", English: "الإنجليزية" },
        title: "سبتايل | Subtle — الترجمات الرائجة", toggle: "EN", dir: "rtl",
    },
    en: {
        brand: "SUBTILE", searchPh: "Search movies, TV shows, anime...",
        navTrending: "Trending", navLatest: "Latest", navUpload: "Discover",
        loginBtn: "Login", logoutBtn: "Logout",
        current1: "CURRENT #1", trendingToday: "Trending Today",
        downloadSubs: "Download Subtitles", moreInfo: "More Info",
        topCharts: "TOP CHARTS", trendingNow: "Trending Now",
        fAll: "All", fMovies: "Movies", fTv: "TV Shows", fAnime: "Anime",
        noResults: "No results found", noResultsHint: "Try a different search term or category",
        footerText: "© Subtle — Subtitles Archive. Designed for cinephiles.",
        contact: "Contact", privacy: "Privacy Policy", DMCA: "DMCA",
        downloads: "Downloads", download: "Download",
        langName: { Arabic: "Arabic", English: "English" },
        title: "Subtle — Trending Subtitles", toggle: "ع", dir: "ltr",
    }
};

/* ---------------- State ---------------- */
let lang = localStorage.getItem("subtle-lang") || "ar";
let activeFilter = "all";
let searchQuery = "";

const t = key => I18N[lang][key];
const $ = id => document.getElementById(id);

/* ---------------- Render: i18n ---------------- */
function applyI18n() {
    document.documentElement.lang = lang;
    document.documentElement.dir = I18N[lang].dir;
    document.title = t("title");
    $("langToggle").textContent = t("toggle");
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
    updateAuthNav();
    renderFeatured();
    renderGrid();
}

function updateAuthNav() {
    const user = (typeof Auth !== 'undefined') ? Auth.getCurrentUser() : null;
    const btn = $("navAuthBtn");
    const txt = $("navAuthText");
    if (!btn || !txt) return;

    if (user && user.username) {
        txt.textContent = user.username;
        btn.href = "#";
        btn.onclick = (e) => {
            e.preventDefault();
            if (confirm(lang === 'ar' ? 'هل تريد تسجيل الخروج؟' : 'Do you want to log out?')) {
                Auth.logout();
                updateAuthNav();
            }
        };
    } else {
        txt.textContent = t("loginBtn");
        btn.href = "login.html";
        btn.onclick = null;
    }
}

/* ---------------- Render: Featured (Links to movie.html directly) ---------------- */
function renderFeatured() {
    const f = TITLES.find(x => x.featured);
    $("bannerBg").style.backgroundImage = `url('${f.backdrop}')`;
    $("featuredTitle").textContent = f.title;
    $("featuredDesc").textContent = f.desc[lang];
    $("featuredMeta").innerHTML =
        `<span>${f.year}</span><span class="w-1 h-1 bg-neutral-600 rounded-full"></span>` +
        `<span>${f.genre[lang]}</span><span class="w-1 h-1 bg-neutral-600 rounded-full"></span>` +
        `<span>${f.dl} ${t("downloads")}</span>`;
    const img = $("featuredPoster"), fb = $("featuredFallback");
    img.alt = f.title; img.style.display = "";
    img.onerror = () => { img.style.display = "none"; fb.style.display = "flex"; fb.textContent = f.title; };
    img.src = f.poster;
    
    const movieUrl = `movie.html?id=${f.id}&type=${f.type}`;
    $("featuredDownload").href = movieUrl;
    $("featuredInfo").href = movieUrl;
}

/* ---------------- Render: Grid (Direct Link to movie.html with Hollow Numbers) ---------------- */
function cardHTML(item, rank) {
    const movieUrl = `movie.html?id=${item.id}&type=${item.type}`;

    return `
    <a href="${movieUrl}" class="movie-card cursor-pointer group reveal block" data-id="${item.id}" aria-label="${item.title}">
        <div class="relative">
            <div class="poster-container">
                <img src="${item.poster}" alt="${item.title}" loading="lazy" class="poster-img shadow-2xl shadow-black/60"
                     onerror="this.style.display='none';this.nextElementSibling.style.display='flex';this.nextElementSibling.textContent='${item.title.replace(/'/g, "\\'")}'">
                <div class="poster-fallback"></div>
                <span class="rank-number">${rank}</span>
                <div class="overlay-content absolute inset-0 flex flex-col justify-end p-4 z-30">
                    <div class="dl-btn w-full bg-neutral-100 hover:bg-white text-neutral-900 font-bold py-2 rounded-lg flex items-center justify-center gap-2 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        ${t("download")}
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-4">
            <div class="flex items-center gap-2 mb-1">
                <span class="bg-neutral-800 text-neutral-300 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">${t("langName")[item.lang] || item.lang}</span>
                <span class="text-neutral-600 text-xs">${item.year}</span>
            </div>
            <h3 class="text-base font-bold text-neutral-100 truncate">${item.title}</h3>
            <p class="text-neutral-500 text-sm mt-0.5">${item.dl} ${t("downloads")}</p>
        </div>
    </a>`;
}

function renderGrid() {
    const q = searchQuery.trim().toLowerCase();
    const list = TITLES.filter(x => !x.featured)
        .filter(x => activeFilter === "all" || x.type === activeFilter)
        .filter(x => !q || x.title.toLowerCase().includes(q));

    $("grid").innerHTML = list.map((item, i) => cardHTML(item, i + 2)).join("");
    $("emptyState").classList.toggle("hidden", list.length > 0);
    observeReveals();
}

/* ---------------- Reveal on scroll ---------------- */
const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); } });
}, { threshold: 0.1 });
function observeReveals() { document.querySelectorAll(".reveal:not(.visible)").forEach(el => io.observe(el)); }

/* ---------------- Events ---------------- */
$("searchInput").addEventListener("input", e => { searchQuery = e.target.value; renderGrid(); });

$("searchInput").addEventListener("keydown", e => {
    if (e.key === "Enter" && searchQuery.trim()) {
        window.location.href = `browse.html?q=${encodeURIComponent(searchQuery.trim())}`;
    }
});

document.querySelectorAll(".filter-btn").forEach(btn => btn.addEventListener("click", () => {
    activeFilter = btn.dataset.filter;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b === btn));
    renderGrid();
}));

$("langToggle").addEventListener("click", () => {
    lang = lang === "ar" ? "en" : "ar";
    localStorage.setItem("subtle-lang", lang);
    applyI18n();
});

const toTop = $("toTop");
window.addEventListener("scroll", () => {
    const show = window.scrollY > 600;
    toTop.classList.toggle("hidden", !show);
    toTop.classList.toggle("flex", show);
}, { passive: true });
toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

/* ---------------- Init ---------------- */
$("year").textContent = new Date().getFullYear();
applyI18n();
</script>
</body>
</html>
