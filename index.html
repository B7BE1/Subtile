<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Subtile — Premium Cinematic Subtitles Archive for Movies, TV Shows, and Anime.">
    <title>Subtile — Trending Subtitles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #050507;
            --bg-glass: rgba(15, 15, 18, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.25);
            --text-main: #ffffff;
            --text-faded: #8a8a92;
            --transition-cine: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); }
        
        .nav-blur {
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            background: var(--bg-glass);
            border-bottom: 1px solid var(--border-color);
        }

        .banner-bg {
            background-size: cover;
            background-position: center top;
            position: absolute; inset: 0; z-index: 0;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
            opacity: 0.55;
            transition: background-image 0.5s ease;
        }

        .poster-container { position: relative; padding-bottom: 150%; }
        .poster-img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
            border-radius: 1rem; background: #121216; border: 1px solid var(--border-color);
            transition: var(--transition-cine);
        }
        .poster-fallback {
            position: absolute; inset: 0; border-radius: 1rem; background: #121216;
            display: none; align-items: center; justify-content: center; text-align: center;
            color: #525252; font-weight: 700; padding: 1rem; border: 1px solid var(--border-color);
        }

        /* Hollow Transparent Stroke Rank Numbers */
        .rank-number {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 6.5rem;
            line-height: 0.8;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.45);
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95);
            position: absolute;
            bottom: -12px;
            left: -10px;
            z-index: 25;
            pointer-events: none;
            user-select: none;
            transition: -webkit-text-stroke 0.3s ease, transform 0.3s ease;
        }
        .movie-card:hover .rank-number {
            -webkit-text-stroke: 2.5px rgba(255, 255, 255, 0.95);
            transform: scale(1.04);
        }

        .movie-card { position: relative; z-index: 1; transition: var(--transition-cine); }
        .movie-card:hover { transform: translateY(-6px); }
        .movie-card:hover .poster-img { filter: brightness(0.35); border-color: var(--border-hover); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .movie-card:hover .overlay-content { opacity: 1; }
        .overlay-content { opacity: 0; transition: opacity 0.3s ease; z-index: 30; }

        .reveal { opacity: 0; transform: translateY(20px); transition: opacity .5s ease, transform .5s ease; }
        .reveal.visible { opacity: 1; transform: none; }

        .filter-btn.active {
            background: #ffffff;
            color: #050507;
            border-color: #ffffff;
            box-shadow: 0 4px 16px rgba(255, 255, 255, 0.2);
        }

        .btn-pill {
            padding: 0.75rem 1.6rem; border-radius: 50px; font-weight: 700; cursor: pointer;
            transition: var(--transition-cine); text-decoration: none; display: inline-flex;
            align-items: center; gap: 0.6rem;
        }
        .btn-primary { background: #ffffff; color: #050507; }
        .btn-primary:hover { background: rgba(255,255,255,0.9); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,255,255,0.25); }
        .btn-secondary { background: rgba(255,255,255,0.05); color: #ffffff; border: 1px solid var(--border-color); }
        .btn-secondary:hover { border-color: var(--border-hover); background: rgba(255,255,255,0.12); transform: translateY(-2px); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050507; }
        ::-webkit-scrollbar-thumb { background: #222228; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3a44; }
    </style>
</head>
<body class="overflow-x-hidden min-h-screen">

    <!-- Navbar -->
    <header class="fixed top-0 w-full z-50 nav-blur">
        <div class="container mx-auto px-4 sm:px-8 py-3.5 flex items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-3 flex-shrink-0 group">
                <div class="w-8 h-8 bg-neutral-100 rounded-lg flex items-center justify-center transition-transform group-hover:scale-105">
                    <svg class="w-5 h-5 text-neutral-950" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
                </div>
                <span class="text-lg font-black tracking-tight text-neutral-100 hidden sm:block">SUBTILE</span>
            </a>

            <div class="flex-1 max-w-xl">
                <div class="relative">
                    <input id="searchInput" type="search" placeholder="Search movies, TV shows, anime..."
                        class="w-full bg-neutral-900/90 border border-neutral-800 rounded-xl py-2.5 ps-4 pe-10 text-sm focus:outline-none focus:border-neutral-500 transition-colors text-neutral-200 placeholder:text-neutral-500">
                    <svg class="absolute end-3.5 top-3 w-4 h-4 text-neutral-500 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>

            <div class="flex items-center gap-4 flex-shrink-0">
                <nav class="hidden md:flex items-center gap-6 text-sm font-semibold text-neutral-400">
                    <a href="index.html" class="text-white border-b-2 border-white pb-0.5">Trending</a>
                    <a href="browse.html" class="hover:text-neutral-200 transition-colors">Browse</a>
                </nav>
                <a href="login.html" id="navAuthBtn" class="text-xs font-bold bg-neutral-100 hover:bg-white text-neutral-950 px-4 py-2 rounded-xl transition-all flex items-center gap-1.5 shadow-sm">
                    <i class="fas fa-user-circle text-sm"></i>
                    <span id="navAuthText">Login</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Featured Hero Banner (#01) -->
    <section class="relative w-full min-h-[85vh] flex items-center pt-24 pb-12">
        <div id="bannerBg" class="banner-bg"></div>
        <div class="relative z-10 container mx-auto px-4 sm:px-8 flex flex-col md:flex-row items-center gap-12">
            <div class="hidden md:block w-64 flex-shrink-0">
                <div class="poster-container">
                    <img id="featuredPoster" src="" alt="" class="poster-img shadow-2xl shadow-black/90 border border-neutral-700/60">
                    <div id="featuredFallback" class="poster-fallback"></div>
                </div>
            </div>

            <div class="max-w-2xl mt-4 md:mt-0">
                <div class="flex items-center gap-4 mb-4">
                    <span class="text-neutral-100 font-black text-7xl md:text-8xl leading-none">01</span>
                    <div class="border-s border-neutral-700 ps-4">
                        <p class="text-neutral-400 text-sm font-bold tracking-widest uppercase">Current #1 Title</p>
                        <p class="text-neutral-500 text-xs mt-0.5">Trending Today</p>
                    </div>
                </div>

                <h1 id="featuredTitle" class="text-5xl md:text-7xl font-black text-neutral-50 mb-3 tracking-tight leading-none"></h1>
                <div id="featuredMeta" class="flex items-center flex-wrap gap-x-4 gap-y-2 mb-6 text-neutral-400 text-sm font-medium"></div>
                <p id="featuredDesc" class="text-neutral-300 text-lg leading-relaxed mb-8 max-w-xl"></p>

                <!-- Direct navigation buttons to movie.html -->
                <div class="flex items-center gap-4 flex-wrap">
                    <a id="featuredDownload" href="#" class="btn-pill btn-primary">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        <span>Download Subtitles</span>
                    </a>
                    <a id="featuredInfo" href="#" class="btn-pill btn-secondary">
                        More Details
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Trending Grid -->
    <main class="container mx-auto px-4 sm:px-8 pt-12 pb-20 relative z-20">
        <div class="mb-14 flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
            <div>
                <p class="text-neutral-500 font-bold mb-2 tracking-[0.2em] text-xs uppercase">Top Charts</p>
                <h2 class="text-4xl md:text-5xl font-black text-neutral-50 tracking-tight">Trending Now</h2>
            </div>
            <div id="filters" class="flex gap-2 flex-wrap">
                <button data-filter="all"   class="filter-btn active px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-400 text-sm font-bold hover:bg-neutral-800 hover:text-white transition-all">All</button>
                <button data-filter="movie" class="filter-btn px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-400 text-sm font-bold hover:bg-neutral-800 hover:text-white transition-all">Movies</button>
                <button data-filter="tv"    class="filter-btn px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-400 text-sm font-bold hover:bg-neutral-800 hover:text-white transition-all">TV Shows</button>
                <button data-filter="anime" class="filter-btn px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-400 text-sm font-bold hover:bg-neutral-800 hover:text-white transition-all">Anime</button>
            </div>
        </div>

        <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-x-8 gap-y-16"></div>

        <div id="emptyState" class="hidden text-center py-24">
            <p class="text-5xl mb-4">🎬</p>
            <p class="text-neutral-300 font-bold text-xl mb-1">No results found</p>
            <p class="text-neutral-500 text-sm">Try a different search term or category filter</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-neutral-900 mt-20 relative z-30 bg-neutral-950/80">
        <div class="container mx-auto px-4 sm:px-8 py-10 flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-neutral-500 text-sm"><span id="year"></span> © Subtile — Subtitles Archive. Built for Cinephiles.</p>
            <div class="flex gap-8 text-sm text-neutral-500 font-medium">
                <a href="#" class="hover:text-neutral-300 transition-colors">Contact</a>
                <a href="#" class="hover:text-neutral-300 transition-colors">Privacy Policy</a>
                <a href="#" class="hover:text-neutral-300 transition-colors">DMCA</a>
            </div>
        </div>
    </footer>

    <!-- Back to top -->
    <button id="toTop" class="hidden fixed bottom-6 end-6 z-40 w-11 h-11 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-full items-center justify-center transition-colors shadow-lg" aria-label="Back to top">
        <svg class="w-5 h-5 mx-auto text-neutral-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/></svg>
    </button>

<script src="js/security.js"></script>
<script src="js/auth.js"></script>
<script>
"use strict";

let TITLES = [
    { id: "tt15398776",  title: "Oppenheimer",       year: 2023, genre: "Biography / Drama", type: "movie", lang: "English", dl: "4.2M", featured: true,
      poster: "https://images.metahub.space/poster/small/tt15398776/img", backdrop: "https://images.metahub.space/background/medium/tt15398776/img",
      desc: "The story of J. Robert Oppenheimer's role in the development of the atomic bomb during World War II." },
    { id: "tt15239678",  title: "Dune: Part Two",      year: 2024, genre: "Sci-Fi / Adventure", type: "movie", lang: "English", dl: "3.8M", poster: "https://images.metahub.space/poster/small/tt15239678/img" }
];

let activeFilter = "all";
let searchQuery = "";
const $ = id => document.getElementById(id);

async function loadLiveTrending() {
    try {
        const res = await fetch('/api/trending');
        if (res.ok) {
            const data = await res.json();
            if (data.trending && data.trending.length > 0) {
                TITLES = data.trending;
            }
        }
    } catch (e) {
        console.warn('Using local fallback for trending:', e);
    }
    renderFeatured();
    renderGrid();
}

function updateAuthNav() {
    const user = (typeof Auth !== 'undefined') ? Auth.getCurrentUser() : null;
    const btn = $("navAuthBtn");
    const txt = $("navAuthText");
    if (!btn || !txt) return;

    if (user && user.username) {
        txt.textContent = user.username;
        btn.href = "#";
        btn.onclick = (e) => {
            e.preventDefault();
            if (confirm('Do you want to log out?')) {
                Auth.logout();
                updateAuthNav();
            }
        };
    } else {
        txt.textContent = "Login";
        btn.href = "login.html";
        btn.onclick = null;
    }
}

function renderFeatured() {
    const f = TITLES.find(x => x.featured);
    $("bannerBg").style.backgroundImage = `url('${f.backdrop}')`;
    $("featuredTitle").textContent = f.title;
    $("featuredDesc").textContent = f.desc;
    $("featuredMeta").innerHTML =
        `<span>${f.year}</span><span class="w-1.5 h-1.5 bg-neutral-600 rounded-full"></span>` +
        `<span>${f.genre}</span><span class="w-1.5 h-1.5 bg-neutral-600 rounded-full"></span>` +
        `<span>${f.dl} Downloads</span>`;
    const img = $("featuredPoster"), fb = $("featuredFallback");
    img.alt = f.title; img.style.display = "";
    img.onerror = () => { img.style.display = "none"; fb.style.display = "flex"; fb.textContent = f.title; };
    img.src = f.poster;
    
    const movieUrl = `movie.html?id=${f.id}&type=${f.type}`;
    $("featuredDownload").href = movieUrl;
    $("featuredInfo").href = movieUrl;
}

function cardHTML(item, rank) {
    const movieUrl = `movie.html?id=${item.id}&type=${item.type}`;

    return `
    <a href="${movieUrl}" class="movie-card cursor-pointer group reveal block" data-id="${item.id}" aria-label="${item.title}">
        <div class="relative">
            <div class="poster-container">
                <img src="${item.poster}" alt="${item.title}" loading="lazy" class="poster-img shadow-2xl shadow-black/80"
                     onerror="this.style.display='none';this.nextElementSibling.style.display='flex';this.nextElementSibling.textContent='${item.title.replace(/'/g, "\\'")}'">
                <div class="poster-fallback"></div>
                <span class="rank-number">${rank}</span>
                <div class="overlay-content absolute inset-0 flex flex-col justify-end p-4 z-30">
                    <div class="w-full bg-white text-neutral-950 font-bold py-2.5 rounded-xl flex items-center justify-center gap-2 transition-transform group-hover:scale-105 shadow-xl">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Download
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-4">
            <div class="flex items-center gap-2 mb-1">
                <span class="bg-neutral-900 border border-neutral-800 text-neutral-300 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">${item.lang}</span>
                <span class="text-neutral-500 text-xs">${item.year}</span>
            </div>
            <h3 class="text-base font-bold text-neutral-100 truncate">${item.title}</h3>
            <p class="text-neutral-500 text-sm mt-0.5">${item.dl} Downloads</p>
        </div>
    </a>`;
}

function renderGrid() {
    const q = searchQuery.trim().toLowerCase();
    const list = TITLES.filter(x => !x.featured)
        .filter(x => activeFilter === "all" || x.type === activeFilter)
        .filter(x => !q || x.title.toLowerCase().includes(q));

    $("grid").innerHTML = list.map((item, i) => cardHTML(item, i + 2)).join("");
    $("emptyState").classList.toggle("hidden", list.length > 0);
    observeReveals();
}

const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); } });
}, { threshold: 0.1 });
function observeReveals() { document.querySelectorAll(".reveal:not(.visible)").forEach(el => io.observe(el)); }

$("searchInput").addEventListener("input", e => { searchQuery = e.target.value; renderGrid(); });

$("searchInput").addEventListener("keydown", e => {
    if (e.key === "Enter" && searchQuery.trim()) {
        window.location.href = `browse.html?q=${encodeURIComponent(searchQuery.trim())}`;
    }
});

document.querySelectorAll(".filter-btn").forEach(btn => btn.addEventListener("click", () => {
    activeFilter = btn.dataset.filter;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b === btn));
    renderGrid();
}));

const toTop = $("toTop");
window.addEventListener("scroll", () => {
    const show = window.scrollY > 600;
    toTop.classList.toggle("hidden", !show);
    toTop.classList.toggle("flex", show);
}, { passive: true });
toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

$("year").textContent = new Date().getFullYear();
updateAuthNav();
loadLiveTrending();
</script>
</body>
</html>
