<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse and discover subtitles for movies, TV series, and anime.">
    <title>Subtile — Discover & Browse Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050507; color: #fff; scroll-behavior: smooth; }
        .nav-blur { backdrop-filter: blur(20px); background: rgba(15, 15, 18, 0.75); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        
        .poster-container { position: relative; padding-bottom: 150%; }
        .poster-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); transition: filter 0.3s ease, transform 0.3s ease; }
        
        .movie-card { position: relative; z-index: 1; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .movie-card:hover { transform: translateY(-6px); }
        .movie-card:hover .poster-img { filter: brightness(0.35); border-color: rgba(255,255,255,0.25); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .movie-card:hover .overlay-content { opacity: 1; }
        .overlay-content { opacity: 0; transition: opacity 0.3s ease; }

        .search-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: rgba(18, 18, 24, 0.96);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            max-height: 380px;
            overflow-y: auto;
            display: none;
            z-index: 100;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
        }
        .search-dropdown.active { display: block; }
        .search-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: background 0.2s ease;
            text-decoration: none;
            color: #fff;
        }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover { background: rgba(255, 255, 255, 0.08); }
        .search-item img {
            width: 36px;
            height: 52px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .filter-btn.active {
            background: #ffffff;
            color: #050507;
            border-color: #ffffff;
            box-shadow: 0 4px 16px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="overflow-x-hidden min-h-screen">

    <!-- Navbar -->
    <header class="fixed top-0 w-full z-50 nav-blur">
        <div class="container mx-auto px-4 sm:px-8 py-3.5 flex items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-3 flex-shrink-0 group">
                <div class="w-8 h-8 bg-neutral-100 rounded-lg flex items-center justify-center transition-transform group-hover:scale-105">
                    <svg class="w-5 h-5 text-neutral-950" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
                </div>
                <span class="text-lg font-black tracking-tight text-neutral-100 hidden sm:block">SUBTILE</span>
            </a>
            
            <div class="flex-1 max-w-xl mx-4 relative">
                <div class="relative">
                    <input type="text" id="browseSearchInput" placeholder="Search movies, TV shows, anime..." autocomplete="off" class="w-full bg-neutral-900/90 border border-neutral-800 rounded-xl py-2.5 ps-4 pe-10 text-sm focus:outline-none focus:border-neutral-500 transition-colors text-neutral-200 placeholder:text-neutral-500">
                    <svg class="absolute end-3.5 top-3 w-4 h-4 text-neutral-500 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <div id="browseSearchDropdown" class="search-dropdown"></div>
            </div>

            <div class="flex items-center gap-4 flex-shrink-0">
                <nav class="hidden md:flex items-center gap-6 text-sm font-semibold text-neutral-400">
                    <a href="index.html" class="hover:text-white transition-colors">Trending</a>
                    <a href="browse.html" class="text-white border-b-2 border-white pb-0.5">Browse</a>
                </nav>
                <a href="login.html" class="text-xs font-bold bg-neutral-100 hover:bg-white text-neutral-950 px-4 py-2 rounded-xl transition-all flex items-center gap-1.5 shadow-sm">
                    <i class="fas fa-user-circle text-sm"></i>
                    <span>Login</span>
                </a>
            </div>
        </div>
    </header>

    <div class="pt-24"></div>

    <!-- Main Discovery Section -->
    <main class="container mx-auto px-4 sm:px-8 py-8">
        
        <!-- Header & Category Switchers -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-6 mb-10">
            <div>
                <p class="text-neutral-500 font-bold mb-2 tracking-[0.2em] text-xs uppercase">Complete Archive</p>
                <h1 class="text-4xl md:text-5xl font-black text-neutral-50 tracking-tight">Discover & Browse</h1>
            </div>
            
            <div class="flex gap-2 flex-wrap" id="browseCategoryFilters">
                <button data-cat="all" class="filter-btn active px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-400 text-sm font-bold hover:bg-neutral-800 hover:text-white transition-all">All Titles</button>
                <button data-cat="movie" class="filter-btn px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-400 text-sm font-bold hover:bg-neutral-800 hover:text-white transition-all">Movies</button>
                <button data-cat="tv" class="filter-btn px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-400 text-sm font-bold hover:bg-neutral-800 hover:text-white transition-all">TV Shows</button>
                <button data-cat="anime" class="filter-btn px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-400 text-sm font-bold hover:bg-neutral-800 hover:text-white transition-all">Anime</button>
            </div>
        </div>

        <!-- Catalog Grid -->
        <div id="catalogGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6"></div>

        <div id="catalogEmpty" class="hidden text-center py-24">
            <p class="text-5xl mb-4">🎬</p>
            <p class="text-neutral-300 font-bold text-xl mb-1">No titles found</p>
            <p class="text-neutral-500 text-sm">Try searching for another movie, series or anime title</p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-neutral-900 mt-20 bg-neutral-950/80">
        <div class="container mx-auto px-4 sm:px-8 py-10 flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-neutral-500 text-sm">© Subtile — Subtitles Archive. Built for Cinephiles.</p>
            <div class="flex gap-8 text-sm text-neutral-500 font-medium">
                <a href="#" class="hover:text-neutral-300 transition-colors">Contact</a>
                <a href="#" class="hover:text-neutral-300 transition-colors">Privacy Policy</a>
                <a href="#" class="hover:text-neutral-300 transition-colors">DMCA</a>
            </div>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script>
        const CATALOG = [
            { id: "tt15398776",  title: "Oppenheimer",       year: 2023, genre: "Biography / Drama", type: "movie", rating: 8.9, poster: "https://images.metahub.space/poster/small/tt15398776/img" },
            { id: "tt15239678",  title: "Dune: Part Two",      year: 2024, genre: "Sci-Fi / Adventure", type: "movie", rating: 8.6, poster: "https://images.metahub.space/poster/small/tt15239678/img" },
            { id: "tt1877830",   title: "The Batman",          year: 2022, genre: "Action / Crime", type: "movie", rating: 7.8, poster: "https://images.metahub.space/poster/small/tt1877830/img" },
            { id: "tt0816692",   title: "Interstellar",        year: 2014, genre: "Sci-Fi / Adventure", type: "movie", rating: 8.7, poster: "https://images.metahub.space/poster/small/tt0816692/img" },
            { id: "tt1375666",   title: "Inception",           year: 2010, genre: "Sci-Fi / Thriller", type: "movie", rating: 8.8, poster: "https://images.metahub.space/poster/small/tt1375666/img" },
            { id: "tt0468569",   title: "The Dark Knight",     year: 2008, genre: "Action / Crime", type: "movie", rating: 9.0, poster: "https://images.metahub.space/poster/small/tt0468569/img" },
            { id: "tt7286456",   title: "Joker",               year: 2019, genre: "Crime / Drama", type: "movie", rating: 8.4, poster: "https://images.metahub.space/poster/small/tt7286456/img" },
            { id: "tt6751668",   title: "Parasite",            year: 2019, genre: "Thriller / Drama", type: "movie", rating: 8.5, poster: "https://images.metahub.space/poster/small/tt6751668/img" },
            { id: "tt0137523",   title: "Fight Club",          year: 1999, genre: "Drama", type: "movie", rating: 8.8, poster: "https://images.metahub.space/poster/small/tt0137523/img" },
            { id: "tt0110912",   title: "Pulp Fiction",        year: 1994, genre: "Crime / Drama", type: "movie", rating: 8.9, poster: "https://images.metahub.space/poster/small/tt0110912/img" },
            { id: "tt0172495",   title: "Gladiator",           year: 2000, genre: "Action / Drama", type: "movie", rating: 8.5, poster: "https://images.metahub.space/poster/small/tt0172495/img" },
            { id: "tt21064510",  title: "Gladiator II",        year: 2024, genre: "Action / Drama", type: "movie", rating: 7.9, poster: "https://images.metahub.space/poster/small/tt21064510/img" },
            { id: "tt18411490",  title: "Alien: Romulus",      year: 2024, genre: "Horror / Sci-Fi", type: "movie", rating: 7.3, poster: "https://images.metahub.space/poster/small/tt18411490/img" },
            { id: "tt0903747",   title: "Breaking Bad",        year: 2008, genre: "Crime / Drama", type: "tv", rating: 9.5, poster: "https://images.metahub.space/poster/small/tt0903747/img" },
            { id: "tt3032476",   title: "Better Call Saul",    year: 2015, genre: "Crime / Drama", type: "tv", rating: 9.0, poster: "https://images.metahub.space/poster/small/tt3032476/img" },
            { id: "tt0944947",   title: "Game of Thrones",     year: 2011, genre: "Fantasy / Drama", type: "tv", rating: 9.2, poster: "https://images.metahub.space/poster/small/tt0944947/img" },
            { id: "tt11198330",  title: "House of the Dragon", year: 2022, genre: "Fantasy / Drama", type: "tv", rating: 8.4, poster: "https://images.metahub.space/poster/small/tt11198330/img" },
            { id: "tt4574334",   title: "Stranger Things",     year: 2016, genre: "Sci-Fi / Horror", type: "tv", rating: 8.7, poster: "https://images.metahub.space/poster/small/tt4574334/img" },
            { id: "tt3581920",   title: "The Last of Us",      year: 2023, genre: "Drama / Horror", type: "tv", rating: 8.8, poster: "https://images.metahub.space/poster/small/tt3581920/img" },
            { id: "tt1190634",   title: "The Boys",            year: 2019, genre: "Action / Sci-Fi", type: "tv", rating: 8.7, poster: "https://images.metahub.space/poster/small/tt1190634/img" },
            { id: "tt15435876",  title: "The Penguin",         year: 2024, genre: "Crime / Drama", type: "tv", rating: 8.8, poster: "https://images.metahub.space/poster/small/tt15435876/img" },
            { id: "tt2442560",   title: "Peaky Blinders",      year: 2013, genre: "Crime / Drama", type: "tv", rating: 8.8, poster: "https://images.metahub.space/poster/small/tt2442560/img" },
            { id: "anime-16498", title: "Attack on Titan",     year: 2013, genre: "Anime / Action", type: "anime", rating: 9.0, poster: "https://cdn.myanimelist.net/images/anime/10/47347l.jpg" },
            { id: "anime-52991", title: "Solo Leveling",       year: 2024, genre: "Anime / Action", type: "anime", rating: 8.5, poster: "https://cdn.myanimelist.net/images/anime/1801/142390l.jpg" },
            { id: "anime-40748", title: "Jujutsu Kaisen",      year: 2020, genre: "Anime / Fantasy", type: "anime", rating: 8.6, poster: "https://cdn.myanimelist.net/images/anime/1171/109222l.jpg" },
            { id: "anime-38000", title: "Demon Slayer",        year: 2019, genre: "Anime / Action", type: "anime", rating: 8.7, poster: "https://cdn.myanimelist.net/images/anime/1286/99889l.jpg" },
            { id: "anime-1535",  title: "Death Note",          year: 2006, genre: "Anime / Mystery", type: "anime", rating: 9.0, poster: "https://cdn.myanimelist.net/images/anime/9/9453l.jpg" },
            { id: "anime-5114",  title: "Fullmetal Alchemist", year: 2009, genre: "Anime / Adventure", type: "anime", rating: 9.1, poster: "https://cdn.myanimelist.net/images/anime/1223/96541l.jpg" },
            { id: "anime-11061", title: "Hunter x Hunter",     year: 2011, genre: "Anime / Adventure", type: "anime", rating: 9.0, poster: "https://cdn.myanimelist.net/images/anime/1337/99013l.jpg" },
            { id: "anime-37521", title: "Vinland Saga",        year: 2019, genre: "Anime / Drama", type: "anime", rating: 8.7, poster: "https://cdn.myanimelist.net/images/anime/1500/103006l.jpg" },
            { id: "anime-44511", title: "Chainsaw Man",        year: 2022, genre: "Anime / Action", type: "anime", rating: 8.5, poster: "https://cdn.myanimelist.net/images/anime/1806/126216l.jpg" },
            { id: "anime-9253",  title: "Steins;Gate",         year: 2011, genre: "Anime / Sci-Fi", type: "anime", rating: 9.1, poster: "https://cdn.myanimelist.net/images/anime/1935/127974l.jpg" },
            { id: "anime-21",    title: "One Piece",           year: 1999, genre: "Anime / Adventure", type: "anime", rating: 8.7, poster: "https://cdn.myanimelist.net/images/anime/6/73245l.jpg" },
            { id: "anime-20",    title: "Naruto",              year: 2002, genre: "Anime / Action", type: "anime", rating: 8.0, poster: "https://cdn.myanimelist.net/images/anime/13/17405l.jpg" },
            { id: "anime-269",   title: "Bleach",              year: 2004, genre: "Anime / Action", type: "anime", rating: 8.2, poster: "https://cdn.myanimelist.net/images/anime/3/40451l.jpg" }
        ];

        let activeCat = "all";
        let searchQ = "";

        const params = new URLSearchParams(window.location.search);
        if (params.get("q")) {
            searchQ = params.get("q");
            document.getElementById("browseSearchInput").value = searchQ;
        }

        function renderCatalog() {
            const q = searchQ.trim().toLowerCase();
            const filtered = CATALOG.filter(item => {
                const matchCat = activeCat === "all" || item.type === activeCat;
                const matchQ = !q || item.title.toLowerCase().includes(q) || (item.genre && item.genre.toLowerCase().includes(q));
                return matchCat && matchQ;
            });

            const grid = document.getElementById("catalogGrid");
            const empty = document.getElementById("catalogEmpty");

            if (filtered.length === 0) {
                grid.innerHTML = "";
                empty.classList.remove("hidden");
                return;
            }

            empty.classList.add("hidden");
            grid.innerHTML = filtered.map(item => `
                <a href="movie.html?id=${item.id}&type=${item.type}" class="movie-card group cursor-pointer block">
                    <div class="poster-container mb-3">
                        <img src="${item.poster}" alt="${item.title}" class="poster-img shadow-xl shadow-black/80" loading="lazy">
                        <div class="overlay-content absolute inset-0 flex flex-col justify-end p-3 z-30">
                            <div class="w-full bg-white text-neutral-950 text-xs font-bold py-2 rounded-lg flex items-center justify-center gap-1.5 shadow-lg">
                                <i class="fas fa-download"></i> View Subtitles
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-neutral-500 text-xs">${item.year}</span>
                        <span class="text-neutral-600">•</span>
                        <span class="text-neutral-400 text-xs font-semibold"><i class="fas fa-star text-amber-400 text-[10px]"></i> ${item.rating}</span>
                    </div>
                    <h3 class="text-sm font-bold text-neutral-100 truncate">${item.title}</h3>
                </a>
            `).join("");
        }

        // Live Search Input & Dropdown
        const input = document.getElementById("browseSearchInput");
        const dropdown = document.getElementById("browseSearchDropdown");

        input.addEventListener("input", (e) => {
            searchQ = e.target.value;
            renderCatalog();

            const val = searchQ.trim().toLowerCase();
            if (!val) {
                dropdown.classList.remove("active");
                return;
            }

            const matches = CATALOG.filter(m => m.title.toLowerCase().includes(val)).slice(0, 6);
            if (matches.length > 0) {
                dropdown.innerHTML = matches.map(m => `
                    <a href="movie.html?id=${m.id}&type=${m.type}" class="search-item">
                        <img src="${m.poster}" alt="${m.title}">
                        <div>
                            <div class="font-bold text-sm text-neutral-100">${m.title}</div>
                            <div class="text-xs text-neutral-400">${m.year} • ${m.type.toUpperCase()} • Rating: ${m.rating}</div>
                        </div>
                    </a>
                `).join("");
                dropdown.classList.add("active");
            } else {
                dropdown.classList.remove("active");
            }
        });

        document.addEventListener("click", (e) => {
            if (!input.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.remove("active");
            }
        });

        // Category Filter Buttons
        document.querySelectorAll("#browseCategoryFilters button").forEach(btn => {
            btn.addEventListener("click", () => {
                activeCat = btn.dataset.cat;
                document.querySelectorAll("#browseCategoryFilters button").forEach(b => b.classList.toggle("active", b === btn));
                renderCatalog();
            });
        });

        renderCatalog();
    </script>
</body>
</html>
