<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse and discover subtitles for movies, TV series, and anime.">
    <meta name="referrer" content="no-referrer">
    <title>Subtile — Discover & Browse Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050507; color: #fff; scroll-behavior: smooth; }
        .nav-blur { backdrop-filter: blur(20px); background: rgba(15, 15, 18, 0.75); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        
        .poster-container { position: relative; padding-bottom: 150%; }
        .poster-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); transition: filter 0.3s ease, transform 0.3s ease; }
        
        .movie-card { position: relative; z-index: 1; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .movie-card:hover { transform: translateY(-6px); }
        .movie-card:hover .poster-img { filter: brightness(0.35); border-color: rgba(255,255,255,0.25); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .movie-card:hover .overlay-content { opacity: 1; }
        .overlay-content { opacity: 0; transition: opacity 0.3s ease; }

        .search-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: rgba(18, 18, 24, 0.96);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            max-height: 380px;
            overflow-y: auto;
            display: none;
            z-index: 100;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
        }
        .search-dropdown.active { display: block; }
        .search-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: background 0.2s ease;
            text-decoration: none;
            color: #fff;
        }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover { background: rgba(255, 255, 255, 0.08); }
        .search-item img {
            width: 36px;
            height: 52px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
        }

        /* BUG FIX: this rule used to target ".filter-btn.active", but the
           buttons below use class "filter-tab-btn" — the two names never
           matched, so the active category tab never got its highlighted
           style. Selector corrected to actually match the markup. */
        .filter-tab-btn.active {
            background: #ffffff;
            color: #050507;
            border-color: #ffffff;
            box-shadow: 0 4px 16px rgba(255, 255, 255, 0.2);
        }

        #toastContainer { position: fixed; bottom: 2rem; right: 2rem; z-index: 999; display: flex; flex-direction: column; gap: 0.8rem; }
    </style>
</head>
<body class="overflow-x-hidden min-h-screen">

    <!-- Navbar -->
    <header class="fixed top-0 w-full z-50 nav-blur">
        <div class="container mx-auto px-4 sm:px-8 py-3.5 flex items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-3 flex-shrink-0 group">
                <div class="w-8 h-8 bg-neutral-100 rounded-lg flex items-center justify-center transition-transform group-hover:scale-105">
                    <svg class="w-5 h-5 text-neutral-950" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
                </div>
                <span class="text-lg font-black tracking-tight text-neutral-100 hidden sm:block">SUBTILE</span>
            </a>
            
            <div class="flex-1 max-w-xl mx-4 relative">
                <div class="relative">
                    <input type="text" id="catalogSearchInput" oninput="onCatalogSearch()" placeholder="Search movies, TV shows, anime..." autocomplete="off" class="w-full bg-neutral-900/90 border border-neutral-800 rounded-xl py-2.5 ps-4 pe-10 text-sm focus:outline-none focus:border-neutral-500 transition-colors text-neutral-200 placeholder:text-neutral-500">
                    <svg class="absolute end-3.5 top-3 w-4 h-4 text-neutral-500 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <div id="browseSearchDropdown" class="search-dropdown"></div>
            </div>

            <div class="flex items-center gap-4 flex-shrink-0">
                <nav class="hidden md:flex items-center gap-6 text-sm font-semibold text-neutral-400">
                    <a href="index.html" class="hover:text-white transition-colors">Trending</a>
                    <a href="browse.html" class="text-white border-b-2 border-white pb-0.5">Browse</a>
                </nav>
                <!-- CONNECTED: js/browse.js's setupAuthNavbar() already builds the
                     logged-in user dropdown (avatar, Profile, Upload, Logout) and
                     falls back to a login button — it just had no #navAuthSlot to
                     render into on this page, so it always looked logged-out even
                     when subhub_current_user was set. This div gives it a target;
                     the static markup below is the no-JS fallback and is replaced
                     on load. -->
                <div id="navAuthSlot">
                    <a href="login.html" class="text-xs font-bold bg-neutral-100 hover:bg-white text-neutral-950 px-4 py-2 rounded-xl transition-all flex items-center gap-1.5 shadow-sm">
                        <i class="fas fa-user-circle text-sm"></i>
                        <span>Login</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="pt-24"></div>

    <!-- Main Discovery Section -->
    <main class="container mx-auto px-4 sm:px-8 py-8">
        
        <!-- Header & Category Switchers -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-6 mb-10">
            <div>
                <p class="text-neutral-500 font-bold mb-2 tracking-[0.2em] text-xs uppercase">Complete Archive</p>
                <div class="flex items-center gap-4">
                    <h1 class="text-4xl md:text-5xl font-black text-neutral-50 tracking-tight">Discover & Browse</h1>
                    <span id="itemsCountBadge" class="text-sm bg-neutral-900 border border-neutral-800 px-3 py-1 rounded-full text-neutral-400 font-semibold">0 titles</span>
                </div>
            </div>
            
            <div class="flex gap-2 flex-wrap items-center" id="browseCategoryFilters">
                <button class="filter-tab-btn active px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-400 text-sm font-bold hover:bg-neutral-800 hover:text-white transition-all" onclick="filterCatalog('all', this)">All Titles</button>
                <button class="filter-tab-btn px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-400 text-sm font-bold hover:bg-neutral-800 hover:text-white transition-all" onclick="filterCatalog('movie', this)">Movies</button>
                <button class="filter-tab-btn px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-400 text-sm font-bold hover:bg-neutral-800 hover:text-white transition-all" onclick="filterCatalog('tv', this)">TV Shows</button>
                <button class="filter-tab-btn px-4 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-400 text-sm font-bold hover:bg-neutral-800 hover:text-white transition-all" onclick="filterCatalog('anime', this)">Anime</button>
                <!-- CONNECTED: js/browse.js already implements onCatalogSort()/currentSort
                     fully (rating/year/title) but browse.html had no control to trigger it. -->
                <select id="catalogSortSelect" onchange="onCatalogSort()" class="px-3 py-2 rounded-xl bg-neutral-900 border border-neutral-800 text-neutral-300 text-sm font-bold focus:outline-none focus:border-neutral-500 transition-colors">
                    <option value="rating" selected>Sort: Rating</option>
                    <option value="year">Sort: Year</option>
                    <option value="title">Sort: Title</option>
                </select>
            </div>
        </div>

        <!-- Catalog Grid -->
        <div id="catalogGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6"></div>

        <div id="catalogEmpty" class="hidden text-center py-24">
            <p class="text-5xl mb-4">🎬</p>
            <p class="text-neutral-300 font-bold text-xl mb-1">No titles found</p>
            <p class="text-neutral-500 text-sm">Try searching for another movie, series or anime title</p>
        </div>

        <!-- Infinite Loading Spinner -->
        <div id="loadingSpinner" class="hidden flex justify-center items-center py-12">
            <i class="fas fa-circle-notch fa-spin text-3xl text-neutral-500"></i>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-neutral-900 mt-20 bg-neutral-950/80">
        <div class="container mx-auto px-4 sm:px-8 py-10 flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-neutral-500 text-sm">© Subtile — Subtitles Archive. Built for Cinephiles.</p>
            <div class="flex gap-8 text-sm text-neutral-500 font-medium">
                <a href="#" class="hover:text-neutral-300 transition-colors">Contact</a>
                <a href="#" class="hover:text-neutral-300 transition-colors">Privacy Policy</a>
                <a href="#" class="hover:text-neutral-300 transition-colors">DMCA</a>
            </div>
        </div>
    </footer>

    <!-- CONNECTED: showToast()/handleLogout() etc. in js/browse.js already
         build and append toast elements here — this container was missing. -->
    <div id="toastContainer"></div>

    <!-- Auth Modal -->
    <div id="authModal" style="display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.8); backdrop-filter:blur(8px); align-items:center; justify-content:center; padding:1rem;" onclick="if(event.target===this)closeAuthModal()">
        <div style="background:#12151b; border:1px solid #23262e; border-radius:12px; max-width:440px; width:100%; padding:2rem; box-shadow:0 16px 40px rgba(0,0,0,0.8); position:relative;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                <h3 style="font-size:1.2rem; font-weight:700; color:#fff;">Sign In / Create Account</h3>
                <button onclick="closeAuthModal()" style="background:transparent; border:none; color:#6b7280; cursor:pointer; font-size:1.2rem;"><i class="fas fa-times"></i></button>
            </div>
            <form id="authLoginForm" onsubmit="handleAuthLogin(event)">
                <div style="margin-bottom:1rem;">
                    <label style="display:block; font-size:0.8rem; font-weight:600; color:#9aa2b1; margin-bottom:0.4rem;">Username or Email</label>
                    <input type="text" id="authLoginIdentifier" required placeholder="Enter username or email" style="width:100%; background:#0e1117; border:1px solid #23262e; border-radius:8px; padding:0.7rem 0.9rem; color:#fff; font-size:0.9rem; outline:none;">
                </div>
                <div style="margin-bottom:1rem;">
                    <label style="display:block; font-size:0.8rem; font-weight:600; color:#9aa2b1; margin-bottom:0.4rem;">Password</label>
                    <input type="password" id="authLoginPassword" required placeholder="Enter password" style="width:100%; background:#0e1117; border:1px solid #23262e; border-radius:8px; padding:0.7rem 0.9rem; color:#fff; font-size:0.9rem; outline:none;">
                </div>
                <button type="submit" style="width:100%; background:#2563eb; color:#fff; font-weight:700; border:none; padding:0.75rem; border-radius:8px; cursor:pointer; font-size:0.9rem;">Sign In</button>
            </form>
        </div>
    </div>

    <script src="js/security.js"></script>
    <script src="js/data.js"></script>
    <script src="js/browse.js"></script>
</body>
</html>
