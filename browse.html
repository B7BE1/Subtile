<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Movies & TV Shows - Subtile</title>
  <meta name="description" content="Browse all available movies, TV series, and subtitles on Subtile.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .browse-header-area {
      padding: 2.5rem 0 1.5rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 2rem;
    }
    .browse-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.4rem;
    }
    .browse-subtitle {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    .browse-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.8rem 1.2rem;
    }
    .filter-tabs {
      display: flex;
      gap: 0.4rem;
    }
    .filter-tab-btn {
      background: #1a1d24;
      border: 1px solid #23262e;
      color: var(--text-secondary);
      padding: 0.35rem 0.85rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    .filter-tab-btn.active, .filter-tab-btn:hover {
      background: #23262e;
      color: #fff;
      border-color: #3a3f4b;
    }
    .browse-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .browse-select {
      background: #0e1117;
      border: 1px solid #23262e;
      color: #f1f3f6;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.82rem;
      outline: none;
      cursor: pointer;
    }
    .browse-search-mini {
      background: #0e1117;
      border: 1px solid #23262e;
      color: #f1f3f6;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.82rem;
      outline: none;
      width: 180px;
    }
    .browse-search-mini:focus {
      border-color: #3a3f4b;
    }
    .items-count-badge {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="subdl-header">
    <a href="index.html" class="subdl-logo">
      <span class="logo-badge">SUBTILE</span>
    </a>

    <ul class="subdl-nav">
      <li><a href="index.html" class="subdl-nav-link">Latest</a></li>
      <li><a href="browse.html" class="subdl-nav-link active">Browse All</a></li>
      <li><a href="https://github.com/B7BE1/Subtile" target="_blank" class="subdl-nav-link">Community</a></li>
    </ul>

    <div class="subdl-header-actions">
      <div id="navAuthSlot">
        <button class="btn-auth-subdl" onclick="openAuthModal('login')">
          <i class="fas fa-sign-in-alt"></i> Login / Sign Up
        </button>
      </div>
      <button class="btn-icon-subdl" onclick="openUploadModal()" title="Upload Subtitle">
        <i class="fas fa-upload"></i>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="subdl-container">
    
    <div class="browse-header-area">
      <h1 class="browse-title">Explore Catalog</h1>
      <p class="browse-subtitle">Browse all available movies, series, and available subtitles</p>
    </div>

    <!-- Toolbar Filters -->
    <div class="browse-toolbar">
      <div class="filter-tabs">
        <button class="filter-tab-btn active" onclick="filterCatalog('all', this)">All Titles</button>
        <button class="filter-tab-btn" onclick="filterCatalog('movie', this)">Movies</button>
        <button class="filter-tab-btn" onclick="filterCatalog('tv', this)">TV Shows</button>
      </div>

      <div class="browse-controls">
        <input type="text" id="catalogSearchInput" class="browse-search-mini" placeholder="Filter by title..." oninput="onCatalogSearch()">
        
        <select id="catalogSortSelect" class="browse-select" onchange="onCatalogSort()">
          <option value="downloads">Sort by: Most Downloaded</option>
          <option value="rating">Sort by: Highest Rating</option>
          <option value="year">Sort by: Release Year</option>
          <option value="title">Sort by: Title (A-Z)</option>
        </select>

        <span id="itemsCountBadge" class="items-count-badge">0 titles</span>
      </div>
    </div>

    <!-- Movie Grid -->
    <div id="catalogGrid" class="movie-grid">
      <!-- Injected via JS -->
    </div>

  </main>

  <!-- Upload Modal -->
  <div id="uploadModal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Upload Subtitle</h3>
        <button class="modal-close" onclick="closeUploadModal()">&times;</button>
      </div>
      <form id="uploadForm" onsubmit="handleUploadSubtitle(event)">
        <div class="form-group">
          <label class="form-label">Movie / TV Show Title</label>
          <input type="text" class="form-control" placeholder="e.g. Dune: Part Two" required>
        </div>
        <div class="form-group" style="display: flex; gap: 0.8rem;">
          <div style="flex: 1;">
            <label class="form-label">Language</label>
            <select class="form-control">
              <option value="Arabic">Arabic</option>
              <option value="English">English</option>
              <option value="French">French</option>
              <option value="Spanish">Spanish</option>
            </select>
          </div>
          <div style="flex: 1;">
            <label class="form-label">Release Name</label>
            <input type="text" class="form-control" placeholder="1080p.BluRay.x264" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Subtitle File (.srt / .zip)</label>
          <input type="file" accept=".srt,.zip,.vtt" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Translator / Uploader</label>
          <input type="text" class="form-control" placeholder="Your name or team" required>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.8rem; margin-top: 1.5rem;">
          <button type="button" class="btn-auth-subdl" onclick="closeUploadModal()">Cancel</button>
          <button type="submit" class="btn-subdl-submit" style="width: auto; padding: 0.5rem 1.2rem;">Upload</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="authModal" class="modal-backdrop">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Subtile Account</h3>
        <button class="modal-close" onclick="closeAuthModal()">&times;</button>
      </div>
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1.2rem;">
        <button id="authTabLogin" class="btn-subdl-submit" style="flex: 1; padding: 0.4rem;" onclick="switchAuthTab('login')">Login</button>
        <button id="authTabRegister" class="btn-auth-subdl" style="flex: 1; padding: 0.4rem; justify-content: center;" onclick="switchAuthTab('register')">Register</button>
      </div>
      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label">Username or Email</label>
          <input type="text" id="loginUsername" class="form-control" placeholder="username" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-subdl-submit" style="margin-top: 0.5rem;">Sign In</button>
      </form>
      <form id="registerForm" style="display: none;" onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="regUsername" class="form-control" placeholder="username" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="regEmail" class="form-control" placeholder="email@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-subdl-submit" style="margin-top: 0.5rem;">Create Account</button>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Footer -->
  <footer class="subdl-footer">
    <ul class="subdl-footer-links">
      <li><a href="#">Filter Languages</a></li>
      <li><a href="#">Advertise</a></li>
      <li><a href="#">Search and Download API</a></li>
      <li><a href="#">DMCA</a></li>
      <li><a href="#">Terms</a></li>
    </ul>
    <div style="color: var(--text-muted);">
      &copy; 2026 Subtile
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/security.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-ui.js"></script>
  <script src="js/browse.js"></script>
</body>
</html>
