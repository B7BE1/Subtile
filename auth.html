<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | SubHub</title>
  <meta name="description" content="سجّل الدخول أو أنشئ حسابًا جديدًا في SubHub للوصول إلى مفضلاتك وترجماتك المرفوعة.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-glass-strong);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 2rem;
    }
    .auth-page-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 1.6rem;
      font-weight: 800;
      font-size: 1.4rem;
    }
    .auth-page-logo .logo-badge {
      background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
      color: #10131a;
      padding: 0.3rem 0.6rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
    }
    .auth-page-back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
    }
    .auth-page-back:hover { color: var(--text-primary); }
  </style>
</head>
<body>

  <main class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="auth-page-back"><i class="fas fa-arrow-right"></i> العودة إلى الرئيسية</a>

      <div class="auth-page-logo">
        <span class="logo-badge">SUB</span>
        <span>Hub<span style="color: var(--accent-secondary);">.DL</span></span>
      </div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-tab="login">تسجيل الدخول</button>
        <button type="button" class="auth-tab" data-tab="register">إنشاء حساب</button>
        <div class="auth-tab-indicator"></div>
      </div>

      <!-- Login Panel -->
      <div class="auth-panel active" data-panel="login">
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="loginIdentifier">اسم المستخدم أو البريد الإلكتروني</label>
            <input type="text" id="loginIdentifier" class="form-control" autocomplete="username" required>
            <div class="form-error" id="loginIdentifierError"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="loginPassword">كلمة المرور</label>
            <input type="password" id="loginPassword" class="form-control" autocomplete="current-password" required>
            <div class="form-error" id="loginPasswordError"></div>
          </div>
          <button type="submit" id="loginSubmitBtn" class="btn btn-primary auth-submit-btn">تسجيل الدخول</button>
        </form>
        <p class="auth-switch-link">نسيت كلمة المرور؟ <a href="#" data-auth-tab-trigger="forgot">إعادة تعيينها</a></p>
      </div>

      <!-- Register Panel -->
      <div class="auth-panel" data-panel="register">
        <form id="registerForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="regUsername">اسم المستخدم</label>
            <input type="text" id="regUsername" class="form-control" autocomplete="username" required>
            <div class="form-error" id="regUsernameError"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="regEmail">البريد الإلكتروني</label>
            <input type="email" id="regEmail" class="form-control" autocomplete="email" required>
            <div class="form-error" id="regEmailError"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="regPassword">كلمة المرور</label>
            <input type="password" id="regPassword" class="form-control" autocomplete="new-password" required>
            <div class="password-strength">
              <div class="password-strength-bar"></div>
              <div class="password-strength-bar"></div>
              <div class="password-strength-bar"></div>
              <div class="password-strength-bar"></div>
            </div>
            <div class="form-error" id="regPasswordError"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="regPasswordConfirm">تأكيد كلمة المرور</label>
            <input type="password" id="regPasswordConfirm" class="form-control" autocomplete="new-password" required>
            <div class="form-error" id="regPasswordConfirmError"></div>
          </div>
          <button type="submit" id="registerSubmitBtn" class="btn btn-primary auth-submit-btn">إنشاء حساب</button>
        </form>
      </div>

      <!-- Forgot Password Panel -->
      <div class="auth-panel" data-panel="forgot">
        <p class="form-hint" style="margin-bottom: 1rem;">أدخل بريدك الإلكتروني وسنرسل لك رابطًا لإعادة تعيين كلمة المرور.</p>
        <form id="forgotForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="forgotEmail">البريد الإلكتروني</label>
            <input type="email" id="forgotEmail" class="form-control" autocomplete="email" required>
            <div class="form-error" id="forgotEmailError"></div>
          </div>
          <button type="submit" id="forgotSubmitBtn" class="btn btn-primary auth-submit-btn">إرسال رابط إعادة التعيين</button>
        </form>
        <p class="auth-switch-link">تذكرت كلمة المرور؟ <a href="#" data-auth-tab-trigger="login">تسجيل الدخول</a></p>
      </div>
    </div>
  </main>

  <div id="toastContainer" class="toast-container" style="position: fixed; bottom: 2rem; inset-inline-start: 2rem; z-index: 300; display: flex; flex-direction: column; gap: 0.6rem;"></div>

  <!-- Scripts -->
  <script src="js/security.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/auth-ui.js"></script>
  <script>
    // This page has no navbar/#navAuthSlot — redirect to home once logged in,
    // unless the page was reached specifically to reset a password.
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const initialTab = params.get('tab');
      if (initialTab && ['login', 'register', 'forgot'].includes(initialTab)) {
        switchAuthTab(initialTab);
      }

      Auth.onChange((user) => {
        if (user) {
          const redirect = params.get('redirect');
          window.location.href = redirect ? decodeURIComponent(redirect) : 'index.html';
        }
      });
    });

    // showToast is normally defined in js/app.js (not loaded on this page).
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const icon = type === 'error' ? 'fa-times-circle' : type === 'info' ? 'fa-info-circle' : 'fa-check-circle';
      const color = type === 'error' ? 'var(--accent-primary)' : type === 'info' ? 'var(--accent-cyan)' : 'var(--accent-green)';
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const iconEl = document.createElement('i');
      iconEl.className = `fas ${icon}`;
      iconEl.style.color = color;
      const textEl = document.createElement('span');
      Security.setText(textEl, message);
      toast.appendChild(iconEl);
      toast.appendChild(textEl);
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('hide');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }
  </script>
</body>
</html>
